,048 = 2^11이므로 인덱스는 11비트이고, 태그는 32-11-5 = 16비트입니다. ②(18/9/5)는 같은 캐시를 4-way 집합 연관으로 구성해 집합 수가 512개(2^9)일 때의 값입니다. ④는 블록 크기를 16바이트로 잘못 본 경우입니다.","kw":["cache","computer_arch"]},{"s":"시스템 구조","tp":"캐시 매핑 방식","q":"캐시 사상(mapping) 방식에 대한 설명으로 옳은 것은?","o":["① 직접 사상은 메모리 블록이 캐시의 어느 라인에나 들어갈 수 있어 충돌 미스가 가장 적다.","② 완전 연관 사상은 블록을 임의의 라인에 저장할 수 있지만 모든 라인의 태그를 병렬 비교해야 하므로 하드웨어 비용이 크다.","③ 같은 캐시 용량에서 집합 연관 사상의 연관도(way 수)를 높이면 집합(set)의 수가 늘어난다.","④ 직접 사상에서는 교체할 라인을 고르기 위해 LRU와 같은 교체 알고리즘이 반드시 필요하다."],"a":1,"x":"완전 연관 사상은 위치 제약이 없어 충돌 미스가 적은 대신, 원하는 블록을 찾으려면 모든 태그를 동시에 비교하는 비교기가 필요해 비용과 전력이 큽니다. ①은 완전 연관 사상의 특징을 직접 사상으로 잘못 쓴 것이며, 직접 사상은 오히려 충돌 미스가 많습니다. ③은 반대로, 같은 용량에서 way 수를 늘리면 집합 수는 줄어듭니다. ④ 직접 사상은 들어갈 라인이 하나로 정해져 있어 교체 알고리즘이 필요 없습니다.","kw":["cache"]},{"s":"시스템 구조","tp":"메모리 계층과 지역성","q":"기억장치 계층 구조와 지역성(locality)에 대한 설명으로 옳지 않은 것은?","o":["① 계층의 상위(레지스터, 캐시)로 갈수록 접근 속도는 빠르고 비트당 비용은 높다.","② 시간 지역성은 최근에 접근한 데이터가 가까운 미래에 다시 접근될 가능성이 높다는 성질이다.","③ 공간 지역성은 접근한 주소 근처의 주소가 곧 접근될 가능성이 높다는 성질로, 블록 단위 적재가 이를 활용한다.","④ 캐시 블록 크기를 키울수록 공간 지역성을 더 잘 활용하므로 미스율은 항상 계속 감소한다."],"a":3,"x":"블록 크기를 키우면 처음에는 공간 지역성 덕분에 미스율이 줄지만, 같은 용량에서 블록 수가 줄어 충돌이 늘고 쓰지 않을 데이터까지 가져오게 되어 어느 지점부터는 미스율이 다시 증가합니다. 미스 시 가져올 양이 커져 미스 페널티도 커집니다. 따라서 '항상 계속 감소'는 틀립니다. ①~③은 메모리 계층과 지역성의 기본 정의로 옳습니다.","kw":["locality","memory","cache"]},{"s":"시스템 구조","tp":"인터럽트","q":"인터럽트에 대한 설명으로 옳지 않은 것은?","o":["① 0으로 나누기, 잘못된 메모리 접근처럼 실행 중인 프로그램의 오류로 발생하는 인터럽트는 외부 인터럽트로 분류된다.","② 인터럽트가 발생하면 CPU는 일반적으로 현재 실행 중인 명령어를 마친 뒤 PC 등 상태를 저장하고 인터럽트 서비스 루틴(ISR)으로 분기한다.","③ 여러 장치의 인터럽트 우선순위 판별은 소프트웨어적 폴링 방식이나 하드웨어적 데이지 체인 방식으로 할 수 있다.","④ 정전, 하드웨어 고장과 같은 기계 검사 인터럽트는 일반적으로 높은 우선순위를 가진다."],"a":0,"x":"0으로 나누기, 보호 영역 침범 같은 프로그램 오류로 생기는 인터럽트는 CPU 내부에서 발생하므로 내부 인터럽트(트랩, 예외)로 분류합니다. 외부 인터럽트는 입출력 장치, 타이머, 전원 이상처럼 CPU 바깥에서 오는 신호입니다. ②는 인터럽트 처리의 일반 순서, ③은 우선순위 판별의 두 방식, ④는 정전·기계 고장이 가장 긴급하다는 내용으로 옳습니다.","kw":["interrupt","cpu"]},{"s":"시스템 구조","tp":"DMA","q":"DMA(Direct Memory Access)에 대한 설명으로 옳은 것은?","o":["① DMA 방식에서도 데이터는 바이트마다 CPU 레지스터를 거쳐 메모리로 복사된다.","② DMA 전송이 진행되는 동안 CPU는 버스 사용 여부와 무관하게 어떤 작업도 수행할 수 없도록 완전히 정지한다.","③ DMA 제어기는 사이클 스틸링 등으로 CPU와 시스템 버스를 나누어 쓰며, 전송이 끝나면 인터럽트로 CPU에 완료를 알린다.","④ DMA는 프로그램 제어 입출력 방식보다 대용량 데이터 전송에 불리하다."],"a":2,"x":"DMA는 CPU가 전송 시작 정보(주소, 크기 등)만 설정해 주면 DMA 제어기가 장치와 메모리 사이에서 직접 데이터를 옮기고, 끝나면 인터럽트로 알려 줍니다. 버스는 사이클 스틸링 등으로 CPU와 나누어 쓰므로 CPU는 버스가 필요 없는 작업을 계속할 수 있습니다. ①은 프로그램 제어 I/O의 방식이고, ②는 CPU가 완전히 멈춘다는 점이 틀리며, ④는 반대로 DMA가 대용량 전송에 유리합니다.","kw":["interrupt","memory"]},{"s":"시스템 구조","tp":"프로세스와 스레드","q":"프로세스와 스레드에 대한 설명으로 옳지 않은 것은?","o":["① 같은 프로세스에 속한 스레드들은 코드, 데이터, 힙 영역을 공유한다.","② 각 스레드는 독립적인 스택과 프로그램 카운터를 포함한 레지스터 집합을 가진다.","③ 같은 프로세스 내 스레드 간 문맥 교환은 일반적으로 프로세스 간 문맥 교환보다 오버헤드가 작다.","④ 한 스레드에서 처리되지 않은 예외로 프로세스가 비정상 종료되어도 같은 프로세스의 다른 스레드는 영향을 받지 않고 계속 실행된다."],"a":3,"x":"스레드는 프로세스의 주소 공간과 자원을 공유하기 때문에 한 스레드의 치명적 오류로 프로세스가 종료되면 그 안의 모든 스레드가 함께 종료됩니다. 이것이 멀티스레드 구조의 대표적인 단점입니다. ①과 ②는 스레드가 공유하는 것과 독립적으로 갖는 것을 바르게 구분했고, ③은 주소 공간 전환(TLB 무효화 등)이 없어 스레드 전환이 가볍다는 옳은 설명입니다.","kw":["thread","process"]},{"s":"시스템 구조","tp":"CPU 스케줄링 계산(SJF)","q":"다음 프로세스를 비선점 SJF(Shortest Job First)로 스케줄링할 때 평균 대기 시간은? (문맥 교환 시간은 무시) / P1: 도착 0, 실행 8 / P2: 도착 1, 실행 4 / P3: 도착 2, 실행 9 / P4: 도착 3, 실행 5","o":["① 6.50","② 7.25","③ 7.75","④ 8.75"],"a":2,"x":"시각 0에는 P1만 있으므로 P1이 0~8 동안 실행됩니다(비선점). 시각 8에 대기 중인 P2(4), P3(9), P4(5) 중 가장 짧은 P2가 8~12, 다음 P4가 12~17, 마지막 P3가 17~26에 실행됩니다. 대기 시간은 P1 0, P2 8-1=7, P4 12-3=9, P3 17-2=15로 합 31, 평균 7.75입니다. 6.50은 선점형인 SRTF로 계산했을 때의 값이므로 비선점 조건과 맞지 않습니다.","kw":["cpu_scheduling"]},{"s":"시스템 구조","tp":"CPU 스케줄링 계산(RR)","q":"P1(실행 10), P2(실행 4), P3(실행 6)가 모두 시각 0에 P1, P2, P3 순서로 준비 큐에 도착했다. 시간 할당량(time quantum) 3인 라운드 로빈(RR)으로 스케줄링할 때 평균 대기 시간은? (문맥 교환 시간은 무시)","o":["① 약 9.67","② 약 8.33","③ 약 10.33","④ 약 7.67"],"a":0,"x":"실행 순서는 P1(0~3), P2(3~6), P3(6~9), P1(9~12), P2(12~13, 완료), P3(13~16, 완료), P1(16~19), P1(19~20, 완료)입니다. 대기 시간 = 완료 시각 - 실행 시간이므로 P1 20-10=10, P2 13-4=9, P3 16-6=10이고 평균은 29/3 ≈ 9.67입니다. 남은 시간이 할당량보다 짧으면 그만큼만 쓰고 끝난다는 점(P2의 12~13)을 놓치면 다른 값이 나옵니다.","kw":["cpu_scheduling"]},{"s":"시스템 구조","tp":"CPU 스케줄링 기법","q":"CPU 스케줄링 기법에 대한 설명으로 옳지 않은 것은?","o":["① SJF는 평균 대기 시간을 줄이는 데 유리하지만 실행 시간이 긴 프로세스가 계속 밀리는 기아(starvation)가 발생할 수 있다.","② RR에서 시간 할당량을 지나치게 크게 잡으면 FCFS와 비슷하게 동작한다.","③ HRN은 (대기 시간 + 서비스 시간) / 서비스 시간으로 우선순위를 정하므로 오래 기다린 프로세스의 우선순위가 올라가 기아가 완화된다.","④ 다단계 큐(Multilevel Queue) 스케줄링에서는 프로세스가 실행 특성에 따라 큐 사이를 자유롭게 이동하며 우선순위가 조정된다."],"a":3,"x":"큐 사이를 이동하며 우선순위가 조정되는 방식은 다단계 피드백 큐(MLFQ)입니다. 일반 다단계 큐는 프로세스가 처음 배정된 큐에 고정되어 이동하지 않습니다. ①은 SJF의 장단점, ②는 할당량이 크면 한 번에 끝까지 실행되어 FCFS처럼 된다는 점, ③은 HRN의 응답률 공식과 효과를 바르게 설명했습니다.","kw":["cpu_scheduling"]},{"s":"시스템 구조","tp":"교착상태","q":"교착상태(deadlock)에 대한 설명으로 옳지 않은 것은?","o":["① 상호 배제, 점유와 대기, 비선점, 환형 대기의 네 조건이 동시에 성립해야 교착상태가 발생할 수 있다.","② 은행가 알고리즘은 교착상태 예방(prevention) 기법으로, 네 가지 발생 조건 중 하나를 원천적으로 부정한다.","③ 모든 자원에 전역 순서를 매기고 오름차순으로만 요청하게 하면 환형 대기 조건을 제거할 수 있다.","④ 탐지 및 회복 방식은 대기 그래프 등으로 교착상태를 찾아낸 뒤 프로세스 종료나 자원 선점으로 해소한다."],"a":1,"x":"은행가 알고리즘은 예방이 아니라 회피(avoidance) 기법입니다. 발생 조건을 없애는 대신, 자원 요청을 들어줬을 때 시스템이 안전 상태(safe state)로 남는지 미리 검사해 불안전해지면 요청을 보류합니다. ①은 교착상태의 필요조건, ③은 환형 대기를 깨는 대표적 예방 방법, ④는 탐지·회복 방식의 설명으로 옳습니다.","kw":["deadlock","bankers"]},{"s":"시스템 구조","tp":"은행가 알고리즘 계산","q":"자원 유형 A, B, C를 쓰는 5개 프로세스의 현재 상태가 다음과 같고 가용(Available) 자원은 (3, 3, 2)이다. 다음 중 안전 순서(safe sequence)인 것은? / P0: 할당(0,1,0), 최대(7,5,3) / P1: 할당(2,0,0), 최대(3,2,2) / P2: 할당(3,0,2), 최대(9,0,2) / P3: 할당(2,1,1), 최대(2,2,2) / P4: 할당(0,0,2), 최대(4,3,3)","o":["① P0 → P1 → P2 → P3 → P4","② P2 → P1 → P3 → P4 → P0","③ P1 → P3 → P4 → P0 → P2","④ P4 → P1 → P3 → P0 → P2"],"a":2,"x":"필요(Need) = 최대 - 할당이므로 P0 (7,4,3), P1 (1,2,2), P2 (6,0,0), P3 (0,1,1), P4 (4,3,1)입니다. ③을 따라가면 P1(1,2,2≤3,3,2) 완료 후 가용 (5,3,2) → P3 완료 후 (7,4,3) → P4 완료 후 (7,4,5) → P0 완료 후 (7,5,5) → P2(6,0,0) 가능으로 모두 끝낼 수 있습니다. ①은 P0의 필요량 (7,4,3)을, ②는 P2의 (6,0,0)을, ④는 P4의 (4,3,1)을 처음 가용량 (3,3,2)로 충족할 수 없어 첫 단계부터 진행이 막힙니다.","kw":["bankers","deadlock"]},{"s":"시스템 구조","tp":"페이지 교체 부재 횟수 계산","q":"페이지 프레임 3개(초기에는 모두 비어 있음)를 가진 시스템에서 페이지 참조열이 7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2일 때 LRU 교체 알고리즘의 페이지 부재(page fault) 횟수는? (초기 적재로 인한 부재도 포함)","o":["① 7회","② 9회","③ 10회","④ 11회"],"a":1,"x":"LRU는 가장 오랫동안 참조되지 않은 페이지를 교체합니다. 처음 7, 0, 1에서 3회, 이후 2(7 교체), 3(1 교체), 4(2 교체), 2(3 교체), 3(0 교체), 0(4 교체)에서 부재가 나 총 9회이고, 0(두 번), 3, 2의 참조는 적중입니다. 같은 참조열에서 FIFO는 10회, 최적(OPT) 알고리즘은 7회가 되므로 ①과 ③은 다른 알고리즘으로 계산한 값입니다.","kw":["page_replacement","paging"]},{"s":"시스템 구조","tp":"요구 페이징 유효 접근 시간","q":"메모리 접근 시간이 100ns, 페이지 부재 처리 시간이 10ms인 요구 페이징 시스템에서 페이지 부재율이 0.0001(1만 번에 1번)일 때 유효 메모리 접근 시간으로 가장 가까운 것은?","o":["① 약 100ns","② 약 200ns","③ 약 1,000ns","④ 약 1,100ns"],"a":3,"x":"유효 접근 시간 = (1-p)×메모리 접근 시간 + p×부재 처리 시간입니다. 10ms = 10,000,000ns이므로 0.9999×100 + 0.0001×10,000,000 ≈ 99.99 + 1,000 ≈ 1,100ns입니다. 부재율이 아주 낮아도 디스크 접근이 워낙 느려 평균 접근 시간이 약 11배로 늘어난다는 점이 핵심입니다. ③은 정상 접근 시간 약 100ns를 빼먹은 값이고, ①은 부재 비용을 무시한 값입니다.","kw":["virtual_memory","paging"]},{"s":"시스템 구조","tp":"스레싱과 워킹셋","q":"스레싱(thrashing)과 그 대책에 대한 설명으로 옳은 것은?","o":["① 스레싱이 발생하면 다중 프로그래밍 정도(동시 실행 프로세스 수)를 높여야 CPU 이용률이 회복된다.","② 스레싱은 CPU 스케줄링의 시간 할당량이 너무 작아 문맥 교환이 지나치게 잦아지는 현상이다.","③ 워킹셋 모델은 일정 시간 창(window) 동안 참조된 페이지 집합을 메모리에 유지하도록 하여 스레싱을 방지한다.","④ PFF(Page Fault Frequency) 방식은 페이지 부재율이 상한보다 높으면 해당 프로세스에 할당된 프레임 수를 줄인다."],"a":2,"x":"워킹셋 모델은 프로세스가 최근에 자주 쓰는 페이지들(워킹셋)을 메모리에 확보해 줄 수 있을 때만 실행시켜 과도한 페이지 부재를 막습니다. ①은 반대로, 스레싱 상태에서 프로세스를 더 넣으면 프레임이 더 부족해져 악화되므로 오히려 줄여야 합니다. ②는 페이지 교체가 아니라 문맥 교환 문제여서 스레싱의 정의가 아닙니다. ④ PFF는 부재율이 상한을 넘으면 프레임을 더 주고, 하한보다 낮으면 회수합니다.","kw":["thrashing","locality"]},{"s":"시스템 구조","tp":"페이징과 세그멘테이션","q":"가상 메모리의 페이징과 세그멘테이션에 대한 설명으로 옳지 않은 것은?","o":["① 페이징은 외부 단편화가 발생하지만 내부 단편화는 발생하지 않는다.","② 세그멘테이션은 코드, 데이터, 스택 같은 논리적 단위로 가변 크기 분할을 하므로 외부 단편화가 생길 수 있다.","③ TLB는 페이지 테이블 항목을 저장하는 고속 캐시로, 주소 변환 시간을 줄여 준다.","④ 페이지 크기를 키우면 페이지 테이블의 항목 수는 줄지만 내부 단편화는 커질 수 있다."],"a":0,"x":"페이징은 메모리를 같은 크기의 프레임으로 나누므로 외부 단편화는 생기지 않지만, 프로세스의 마지막 페이지가 꽉 차지 않아 내부 단편화가 생길 수 있습니다. ①은 이 관계를 거꾸로 쓴 것입니다. ②는 가변 크기 분할의 특성, ③은 TLB의 역할, ④는 페이지 크기의 상충 관계를 바르게 설명했습니다.","kw":["paging","segmentation","virtual_memory"]},{"s":"시스템 구조","tp":"디스크 스케줄링 계산","q":"디스크 헤드가 현재 53번 실린더에 있고 대기 큐의 요청이 98, 183, 37, 122, 14, 124, 65, 67 순서로 도착해 있다. SSTF(Shortest Seek Time First) 방식으로 처리할 때 헤드의 총 이동 거리(실린더 수)는?","o":["① 236","② 208","③ 640","④ 299"],"a":0,"x":"SSTF는 현재 위치에서 가장 가까운 요청부터 처리합니다. 53 → 65(12) → 67(2) → 37(30) → 14(23) → 98(84) → 122(24) → 124(2) → 183(59) 순서로, 합계는 236입니다. 640은 도착 순서대로 처리하는 FCFS의 이동 거리이고, 208은 안쪽(낮은 번호)부터 LOOK 방식으로 처리했을 때의 값입니다. SSTF는 이동 거리가 짧은 대신 멀리 있는 요청이 오래 밀리는 기아가 생길 수 있습니다.","kw":["disk_scheduling"]},{"s":"시스템 구조","tp":"RAID 가용 용량 계산","q":"4TB 디스크 6개로 RAID를 구성할 때 RAID 5, RAID 6, RAID 10 각각의 사용 가능 용량으로 옳은 것은? (핫 스페어는 두지 않음)","o":["① 20TB / 18TB / 12TB","② 24TB / 20TB / 12TB","③ 20TB / 16TB / 12TB","④ 16TB / 12TB / 12TB"],"a":2,"x":"RAID 5는 디스크 1개 분량을 패리티로 쓰므로 (6-1)×4 = 20TB, RAID 6은 이중 패리티로 2개 분량을 쓰므로 (6-2)×4 = 16TB입니다. RAID 10은 미러링한 쌍을 스트라이핑하므로 전체의 절반인 24/2 = 12TB입니다. ②는 RAID 0처럼 패리티를 빼지 않은 값에서 출발한 오답이고, ①은 RAID 6의 패리티를 1개 분량으로 잘못 본 것입니다.","kw":["raid","storage"]},{"s":"시스템 구조","tp":"RAID 수준 비교","q":"RAID 수준별 특징에 대한 설명으로 옳지 않은 것은?","o":["① RAID 0은 스트라이핑만 하므로 성능은 좋지만 디스크 1개만 고장 나도 전체 데이터를 잃는다.","② RAID 5는 패리티를 전용 디스크 하나에 모아 저장하므로 쓰기 시 그 패리티 디스크에 병목이 생긴다.","③ RAID 6은 이중 패리티를 사용하여 디스크 2개가 동시에 고장 나도 데이터를 복구할 수 있다.","④ RAID 1은 미러링 방식으로 2개 디스크 구성 시 용량 효율이 50%이다."],"a":1,"x":"패리티를 전용 디스크 하나에 모아 두어 쓰기 병목이 생기는 구조는 RAID 4입니다. RAID 5는 이 문제를 해결하려고 패리티를 모든 디스크에 분산 저장합니다. ①은 중복이 없는 RAID 0의 위험, ③은 RAID 6의 이중 장애 허용, ④는 같은 데이터를 두 번 쓰는 RAID 1의 용량 효율을 바르게 설명했습니다.","kw":["raid"]},{"s":"시스템 구조","tp":"OSI 7계층","q":"OSI 참조 모델의 계층과 장비·프로토콜의 관계에 대한 설명으로 옳은 것은?","o":["① 라우터는 MAC 주소를 보고 프레임을 전달하는 데이터링크 계층 장비이다.","② TCP와 UDP는 IP와 함께 네트워크 계층에 속하는 프로토콜이다.","③ L2 스위치는 IP 주소를 기준으로 서로 다른 네트워크 간 경로를 선택한다.","④ 전송 계층은 포트 번호로 종단의 응용 프로세스를 식별하며, 이 계층의 데이터 단위를 세그먼트라고 한다."],"a":3,"x":"전송 계층(4계층)은 TCP·UDP가 동작하는 계층으로, 포트 번호로 같은 호스트 안의 서로 다른 응용 프로세스를 구분하고 TCP의 데이터 단위를 세그먼트라 부릅니다. ①의 라우터는 IP 주소로 경로를 정하는 네트워크 계층 장비입니다. ②의 TCP·UDP는 네트워크 계층이 아니라 전송 계층입니다. ③의 L2 스위치는 MAC 주소로 같은 네트워크 안에서 프레임을 전달하며, 경로 선택은 라우터(L3)의 일입니다.","kw":["osi","tcpip"]},{"s":"시스템 구조","tp":"TCP 흐름·혼잡 제어","q":"TCP의 흐름 제어와 혼잡 제어에 대한 설명으로 옳지 않은 것은?","o":["① 흐름 제어는 수신 측이 알려 주는 수신 윈도우(rwnd) 크기를 기준으로 송신량을 조절한다.","② 슬로 스타트 구간에서는 혼잡 윈도우(cwnd)가 RTT마다 대략 2배씩 늘고, 임계값(ssthresh)에 도달하면 혼잡 회피 단계에서 선형으로 증가한다.","③ TCP Reno는 3개의 중복 ACK을 받으면 cwnd를 1 MSS로 줄이고 슬로 스타트부터 다시 시작한다.","④ 송신 측이 한 번에 보낼 수 있는 양은 rwnd와 cwnd 중 작은 값으로 제한된다."],"a":2,"x":"TCP Reno는 3개의 중복 ACK을 받으면 빠른 재전송(fast retransmit) 후 빠른 회복(fast recovery)에 들어가 cwnd를 대략 절반으로 줄이고 혼잡 회피를 이어 갑니다. cwnd를 1 MSS로 줄이고 슬로 스타트부터 다시 하는 것은 타임아웃이 났을 때이거나, 중복 ACK에도 그렇게 반응하는 TCP Tahoe의 동작입니다. ①은 흐름 제어, ②는 슬로 스타트와 혼잡 회피, ④는 실제 송신 윈도우 결정 방식을 바르게 설명했습니다.","kw":["tcp_congestion","tcp"]},{"s":"시스템 구조","tp":"TCP 윈도우와 처리량 계산","q":"TCP 윈도우 크기가 65,535바이트로 고정되어 있고 왕복 시간(RTT)이 100ms인 경로에서, 다른 제약이 없을 때 단일 TCP 연결이 낼 수 있는 최대 처리량으로 가장 가까운 것은?","o":["① 약 0.66Mbps","② 약 5.24Mbps","③ 약 52.4Mbps","④ 약 655Mbps"],"a":1,"x":"윈도우 기반 전송에서는 한 RTT 동안 최대 윈도우 크기만큼만 보낼 수 있으므로 최대 처리량 = 윈도우 / RTT입니다. 65,535바이트 × 8비트 / 0.1초 ≈ 5,242,800bps ≈ 5.24Mbps입니다. ①은 초당 약 0.66MB(바이트)를 비트로 바꾸지 않고 단위만 Mbps로 붙인 오답입니다. 대역폭이 커도 RTT가 길면 처리량이 이렇게 제한되기 때문에, 고속·장거리 망에서는 윈도우 스케일링 옵션으로 윈도우를 키웁니다.","kw":["tcp_congestion","tcp"]},{"s":"시스템 구조","tp":"서브네팅 계산","q":"호스트 IP 주소가 172.16.45.130/27일 때, 이 호스트가 속한 서브넷의 네트워크 주소, 브로드캐스트 주소, 할당 가능한 호스트 수로 옳은 것은?","o":["① 172.16.45.128 / 172.16.45.191 / 62","② 172.16.45.128 / 172.16.45.159 / 30","③ 172.16.45.128 / 172.16.45.159 / 32","④ 172.16.45.96 / 172.16.45.127 / 30"],"a":1,"x":"/27은 마지막 옥텟에서 상위 3비트가 네트워크 부분이므로 블록 크기는 2^5 = 32입니다. 130은 128~159 블록에 속하므로 네트워크 주소는 172.16.45.128, 브로드캐스트 주소는 172.16.45.159입니다. 호스트 수는 32에서 네트워크 주소와 브로드캐스트 주소를 뺀 30개입니다. ③은 이 2개를 빼지 않았고, ①은 /26으로 계산했으며, ④는 바로 앞 블록입니다.","kw":["ip_address"]},{"s":"시스템 구조","tp":"라우팅 프로토콜","q":"라우팅 프로토콜에 대한 설명으로 옳지 않은 것은?","o":["① RIP는 거리 벡터 방식으로 홉 수를 메트릭으로 사용하며, 최대 15홉까지만 도달 가능한 것으로 본다.","② OSPF는 링크 상태 방식으로 다익스트라(SPF) 알고리즘을 사용하며, 영역(Area)으로 계층화해 대규모 망을 구성할 수 있다.","③ BGP는 하나의 AS 내부 라우팅에 사용되는 링크 상태 프로토콜로, 링크 비용만으로 최단 경로를 계산한다.","④ OSPF는 망 변화가 생기면 링크 상태 정보를 즉시 전파하므로 일반적으로 RIP보다 수렴 속도가 빠르다."],"a":2,"x":"BGP는 서로 다른 AS 사이(인터넷 사업자 간 등)의 라우팅에 쓰는 경로 벡터(path vector) 방식의 EGP입니다. 경로가 지나는 AS 목록과 다양한 속성을 바탕으로 정책 기반 경로를 선택하며, 링크 비용만으로 최단 경로를 구하지 않습니다. ①의 RIP 16홉은 도달 불가로 봅니다. ②와 ④는 OSPF의 특징으로 옳습니다.","kw":["rip_ospf","routing"]},{"s":"시스템 구조","tp":"IPv6","q":"IPv6에 대한 설명으로 옳지 않은 것은?","o":["① 주소 길이는 128비트이며 보통 16비트씩 8개 그룹을 16진수로 표기한다.","② 브로드캐스트 주소가 없고, 유니캐스트·멀티캐스트·애니캐스트 주소를 사용한다.","③ 기본 헤더를 40바이트 고정 길이로 단순화하고 헤더 체크섬 필드를 없앴으며, 부가 기능은 확장 헤더로 처리한다.","④ 경로 MTU보다 큰 패킷은 중간 라우터가 단편화(fragmentation)하여 전달한다."],"a":3,"x":"IPv6에서는 중간 라우터가 단편화를 하지 않습니다. 패킷이 너무 크면 라우터는 폐기하고 ICMPv6 'Packet Too Big' 메시지를 보내며, 송신 호스트가 경로 MTU 탐색으로 크기를 맞추고 필요하면 직접 단편화 확장 헤더를 씁니다. ①~③은 IPv6의 주소 체계, 주소 유형, 헤더 구조를 바르게 설명했습니다.","kw":["ipv6"]},{"s":"시스템 구조","tp":"VLAN","q":"VLAN에 대한 설명으로 옳은 것은?","o":["① IEEE 802.1Q는 이더넷 프레임에 4바이트 태그(VLAN ID 12비트 포함)를 넣어 하나의 트렁크 링크로 여러 VLAN의 트래픽을 전달하게 한다.","② 서로 다른 VLAN에 속한 호스트끼리는 L3 장비 없이 L2 스위치만으로 직접 통신할 수 있다.","③ VLAN을 나누면 브로드캐스트 도메인이 하나로 합쳐져 브로드캐스트 트래픽이 증가한다.","④ 802.1Q에서 사용할 수 있는 VLAN ID는 최대 65,536개이다."],"a":0,"x":"802.1Q 태그는 4바이트이며 그 안의 12비트 VLAN ID로 VLAN을 구분하고, 스위치 간 트렁크 포트에서 태그로 여러 VLAN 트래픽을 한 링크에 실어 보냅니다. ② VLAN이 다르면 서로 다른 네트워크이므로 라우터나 L3 스위치를 거쳐야 통신할 수 있습니다. ③은 반대로, VLAN은 브로드캐스트 도메인을 나누어 브로드캐스트 범위를 줄입니다. ④ 12비트이므로 4,096개(실사용은 0과 4095를 제외한 1~4094)입니다.","kw":["vlan"]},{"s":"시스템 구조","tp":"QoS","q":"네트워크 QoS 모델에 대한 설명으로 옳지 않은 것은?","o":["① IntServ는 RSVP로 흐름(flow)마다 경로상의 자원을 예약하므로 품질 보장은 강하지만 대규모 망에서는 확장성이 떨어진다.","② DiffServ는 흐름마다 RSVP로 종단 간 자원을 예약하며, 라우터마다 모든 흐름의 상태를 유지해야 한다.","③ DiffServ는 IP 헤더의 DSCP 필드에 트래픽 클래스를 표시하고, 각 라우터는 그 값에 따른 홉 단위 동작(PHB)으로 처리한다.","④ 음성 트래픽에는 지연과 지터를 줄이기 위해 EF(Expedited Forwarding) 클래스와 같은 우선 큐잉을 적용하는 것이 일반적이다."],"a":1,"x":"②는 IntServ의 특징을 DiffServ에 붙인 것입니다. DiffServ는 흐름별 예약 없이 패킷을 몇 개의 클래스로 표시(마킹)하고, 라우터는 클래스별로만 다르게 처리하므로 흐름 상태를 유지할 필요가 없어 확장성이 좋습니다. ①은 IntServ의 장단점, ③은 DSCP와 PHB, ④는 지연에 민감한 음성 트래픽 처리 방식을 바르게 설명했습니다.","kw":["qos"]},{"s":"시스템 구조","tp":"가상화와 컨테이너","q":"서버 가상화와 컨테이너에 대한 설명으로 옳지 않은 것은?","o":["① Type 1(베어메탈) 하이퍼바이저는 하드웨어 위에서 직접 동작하여 게스트 OS들을 실행한다.","② Type 2(호스티드) 하이퍼바이저는 호스트 OS 위에서 응용 프로그램처럼 동작한다.","③ 컨테이너는 각자 독립된 게스트 OS 커널을 포함하므로 가상 머신보다 격리 수준이 높고 이미지가 크다.","④ 리눅스 컨테이너는 네임스페이스로 프로세스·네트워크 등을 격리하고 cgroup으로 CPU·메모리 사용량을 제한한다."],"a":2,"x":"컨테이너는 호스트 OS의 커널을 공유하고 프로세스 수준에서 격리하므로, 게스트 OS를 통째로 담는 가상 머신보다 가볍고 빠르게 시작되는 대신 커널을 공유하는 만큼 격리 수준은 일반적으로 VM보다 낮습니다. 따라서 ③은 VM과 컨테이너의 특성을 뒤바꾼 설명입니다. ①과 ②는 하이퍼바이저 유형, ④는 컨테이너의 핵심 격리 기술을 바르게 설명했습니다.","kw":["container","hypervisor","virtualization"]},{"s":"시스템 구조","tp":"쿠버네티스","q":"쿠버네티스(Kubernetes)의 구성 요소에 대한 설명으로 옳은 것은?","o":["① 파드(Pod)는 하나 이상의 컨테이너를 묶은 최소 배포 단위이며, 같은 파드 안의 컨테이너들은 네트워크 네임스페이스(IP 주소)를 공유한다.","② 디플로이먼트(Deployment)는 각 파드에 고정된 고유 이름과 전용 영구 볼륨을 보장하므로 데이터베이스 같은 상태 유지 애플리케이션에 주로 쓴다.","③ 서비스(Service)는 소스 코드로부터 컨테이너 이미지를 빌드하여 레지스트리에 등록하는 오브젝트이다.","④ HPA(Horizontal Pod Autoscaler)는 부하가 늘면 클러스터의 워커 노드(서버) 수를 늘린다."],"a":0,"x":"파드는 쿠버네티스가 배포·관리하는 가장 작은 단위로, 같은 파드의 컨테이너들은 IP와 포트 공간을 공유해 localhost로 통신할 수 있습니다. ②의 고정 이름과 파드별 영구 볼륨은 StatefulSet의 특징이며, Deployment는 주로 상태가 없는 애플리케이션에 씁니다. ③ Service는 여러 파드에 대한 고정 접점(가상 IP, DNS 이름)과 부하 분산을 제공하는 오브젝트이지 이미지를 빌드하지 않습니다. ④ HPA는 파드 수를 늘리며, 노드 수 조정은 Cluster Autoscaler의 역할입니다.","kw":["kubernetes","container"]},{"s":"시스템 구조","tp":"클라우드 서비스 모델","q":"클라우드 서비스 모델과 책임 분담에 대한 설명으로 옳지 않은 것은?","o":["① IaaS에서는 이용자가 가상 서버의 운영체제, 미들웨어, 애플리케이션을 직접 설치하고 관리한다.","② PaaS에서는 제공자가 런타임과 미들웨어까지 관리하고, 이용자는 주로 애플리케이션과 데이터를 관리한다.","③ 서버리스(FaaS)는 이용자가 서버를 직접 준비하지 않고 함수 단위로 코드를 배포하며, 실행 횟수와 시간 기준으로 과금되는 것이 일반적이다.","④ 공동 책임 모델에서 SaaS를 이용하면 데이터 분류와 사용자 계정·접근 권한 관리 책임까지 모두 클라우드 제공자에게 넘어간다."],"a":3,"x":"공동 책임 모델에서 SaaS는 제공자가 인프라부터 애플리케이션까지 운영하지만, 어떤 데이터를 넣을지, 누구에게 어떤 권한을 줄지 같은 데이터와 계정·접근 관리 책임은 어느 서비스 모델에서든 이용자에게 남습니다. ①은 IaaS, ②는 PaaS, ③은 서버리스의 일반적인 특징을 바르게 설명했습니다.","kw":["cloud_service_model","serverless"]},{"s":"시스템 구조","tp":"클라우드 배포 모델과 오토스케일링","q":"클라우드 배포 모델과 확장 방식에 대한 설명으로 옳은 것은?","o":["① 하이브리드 클라우드는 한 퍼블릭 클라우드 사업자의 여러 리전을 함께 사용하는 형태를 말한다.","② 수평 확장(scale-out)은 인스턴스 수를 늘리는 방식이며, 오토스케일링은 CPU 사용률 같은 지표의 임계값에 따라 인스턴스 수를 자동으로 늘리거나 줄인다.","③ 커뮤니티 클라우드는 불특정 다수의 일반 대중에게 개방된 클라우드 형태이다.","④ 수직 확장(scale-up)은 서버 사양을 높이는 방식으로, 중단 없이 무한히 확장할 수 있어 수평 확장보다 확장 한계가 없다."],"a":1,"x":"수평 확장은 같은 역할의 서버를 여러 대로 늘리는 방식이고, 오토스케일링은 모니터링 지표나 일정에 따라 이 대수를 자동 조절해 부하 대응과 비용 절감을 함께 노립니다. ①의 하이브리드 클라우드는 프라이빗(온프레미스)과 퍼블릭 클라우드를 연계한 형태이며, 한 사업자의 여러 리전 사용은 하이브리드가 아닙니다. ③은 퍼블릭 클라우드의 설명이며, 커뮤니티 클라우드는 공통 목적을 가진 특정 조직들이 함께 씁니다. ④ 수직 확장은 단일 장비의 물리적 한계가 있고 보통 재시작 등 중단이 필요합니다.","kw":["cloud_deploy","autoscaling"]},{"s":"시스템 구조","tp":"DAS·NAS·SAN","q":"스토리지 연결 방식인 DAS, NAS, SAN에 대한 설명으로 옳은 것은?","o":["① SAN은 FC(Fibre Channel)나 iSCSI 같은 전용 스토리지 네트워크를 통해 서버에 블록 단위 스토리지를 제공한다.","② NAS는 서버에 블록 장치로 인식되므로 각 서버가 직접 자체 파일시스템으로 포맷하여 사용한다.","③ DAS는 네트워크를 통해 여러 서버가 동시에 공유하기 쉬운 구조로, 확장성이 가장 뛰어나다.","④ NAS는 FC 프로토콜로만 접근할 수 있어 일반 이더넷 환경에서는 사용할 수 없다."],"a":0,"x":"SAN은 서버와 스토리지를 전용 네트워크로 연결해 서버가 원격 디스크를 마치 로컬 디스크처럼 블록 단위로 쓰게 합니다. ②는 SAN의 특징이며, NAS는 자체 파일시스템을 가진 파일 서버로서 NFS·SMB 같은 파일 공유 프로토콜로 파일 단위 접근을 제공합니다. ③ DAS는 서버에 직접 붙인 저장장치라 공유와 확장성이 떨어집니다. ④ NAS는 일반 이더넷(TCP/IP) 위에서 동작합니다.","kw":["san_nas","storage"]},{"s":"시스템 구조","tp":"블록·파일·오브젝트 스토리지","q":"블록, 파일, 오브젝트 스토리지에 대한 설명으로 옳지 않은 것은?","o":["① 블록 스토리지는 데이터를 고정 크기 블록으로 다루어 지연이 낮고 랜덤 I/O 성능이 좋아 데이터베이스 저장소로 많이 쓰인다.","② 파일 스토리지는 디렉터리 계층 구조로 데이터를 관리하며 NFS, SMB 같은 프로토콜로 여러 클라이언트가 공유할 수 있다.","③ 오브젝트 스토리지는 객체의 일부 바이트만 제자리에서 수정하는 방식이 기본이어서, 잦은 부분 갱신이 일어나는 트랜잭션 DB 데이터 파일 저장에 가장 적합하다.","④ 오브젝트 스토리지는 데이터를 고유 ID와 메타데이터를 가진 객체로 평면 네임스페이스에 저장하고, 주로 HTTP 기반 REST API로 접근한다."],"a":2,"x":"오브젝트 스토리지는 객체를 통째로 저장·교체(PUT)하는 방식이 기본이며 부분 갱신과 낮은 지연에 약해, 트랜잭션 DB 데이터 파일보다는 백업, 로그, 이미지·동영상 같은 대용량 비정형 데이터에 적합합니다. 확장성이 매우 크고 메타데이터를 풍부하게 붙일 수 있다는 것이 장점입니다. ①, ②, ④는 각 스토리지 유형의 특징과 용도를 바르게 설명했습니다.","kw":["storage_types"]},{"s":"시스템 구조","tp":"재해복구 센터 유형","q":"재해복구(DR) 센터의 구축 유형에 대한 설명으로 옳지 않은 것은?","o":["① 미러 사이트는 주 센터와 같은 수준의 시스템을 갖추고 실시간으로 데이터를 동기화하여 RTO가 가장 짧다.","② 핫 사이트는 주 센터와 동등한 수준의 장비를 대기 상태로 두고 데이터를 주기적 또는 실시간으로 복제하여 빠르게 전환할 수 있다.","③ 웜 사이트는 중요 업무 위주로 일부 장비만 갖추어 두므로 핫 사이트보다 비용은 낮지만 복구에 더 오래 걸린다.","④ 콜드 사이트는 장비와 최신 데이터가 모두 준비되어 있어 구축 비용이 가장 높지만 RTO는 가장 짧다."],"a":3,"x":"콜드 사이트는 전산실 공간과 전원·통신 같은 기본 시설만 확보해 두고, 재해가 나면 그때 장비를 들여와 백업 데이터로 복구하는 방식입니다. 그래서 비용은 가장 낮지만 RTO는 가장 깁니다. ④는 미러 사이트의 특징을 콜드 사이트에 붙이고 RTO까지 거꾸로 쓴 설명입니다. ①~③은 미러, 핫, 웜 사이트의 비용과 복구 시간 관계를 바르게 설명했습니다.","kw":["drs","rto_rpo","bcp"]},{"s":"시스템 구조","tp":"RTO·RPO 사례","q":"어느 기관은 매일 00:00에 전체 백업만 수행하여 원격지에 보관한다. 어느 날 15:00에 주 시스템이 장애로 중단되었고, 백업 데이터로 복구하여 19:00에 서비스를 재개하였다. 이 사례에 대한 설명으로 옳은 것은? (백업은 정상 완료되었고 다른 복제 수단은 없음)","o":["① 마지막 백업 이후 약 15시간 분량의 데이터가 손실될 수 있으며 이는 RPO 관점의 문제이고, 서비스 재개까지 걸린 4시간은 RTO 관점에서 평가할 대상이다.","② 이 사례의 실제 RPO는 4시간, 실제 RTO는 15시간이다.","③ 데이터 손실량을 줄이려면 복구용 서버의 CPU와 메모리 성능을 높이는 것이 가장 직접적인 대책이다.","④ RTO는 백업 주기에 의해서만 결정되므로, 백업 주기를 줄이면 복구 시간도 반드시 같은 비율로 줄어든다."],"a":0,"x":"RPO는 '어느 시점까지의 데이터를 되살릴 수 있는가', 즉 허용 가능한 데이터 손실 범위로, 하루 1회 백업이면 최악의 경우 마지막 백업 이후(이 사례에서는 00:00~15:00, 약 15시간)의 데이터를 잃습니다. RTO는 장애 후 서비스를 재개하기까지 걸리는 시간으로, 이 사례에서는 15:00~19:00의 4시간입니다. ②는 두 값을 뒤바꿨습니다. ③ 데이터 손실을 줄이려면 백업 주기 단축이나 실시간 복제처럼 RPO를 낮추는 대책이 필요합니다. ④ RTO는 복구 절차, 대기 장비, 데이터 양 등에 좌우되며 백업 주기만으로 정해지지 않습니다.","kw":["rto_rpo","bcp"]},{"s":"시스템 구조","tp":"가용성 계산","q":"웹 서버 2대가 Active-Active로 병렬 구성되어 있고(둘 중 1대만 살아 있어도 서비스 가능), 그 뒤에 DB 서버 1대가 직렬로 연결되어 있다. 웹 서버 각각의 가용성은 99%, DB 서버의 가용성은 99.9%이며 각 장애는 서로 독립이다. 다른 구성 요소를 무시할 때 전체 시스템 가용성으로 가장 가까운 것은?","o":["① 약 99.00%","② 약 99.89%","③ 약 99.99%","④ 약 98.90%"],"a":1,"x":"병렬 구성의 가용성은 1 - (둘 다 장애일 확률)이므로 1 - (0.01×0.01) = 0.9999입니다. 여기에 DB 서버가 직렬로 붙으면 곱해야 하므로 0.9999 × 0.999 ≈ 0.99890, 즉 약 99.89%입니다. ③은 웹 서버 병렬 부분만 계산하고 DB를 빠뜨린 값이고, ④는 웹 서버를 1대(0.99 × 0.999)로 계산한 값입니다. 이처럼 직렬로 연결된 단일 장비(SPOF)가 전체 가용성의 상한을 정한다는 점이 핵심입니다.","kw":["drs","sla"]},{"s":"시스템 구조","tp":"성능 용량 산정(TPS)","q":"어떤 온라인 시스템에 동시 사용자 1,000명이 접속해 있다. 각 사용자는 요청을 보낸 뒤 응답을 받고, 평균 9초의 생각 시간(think time) 후 다음 요청을 보낸다. 평균 응답 시간이 1초일 때 이 시스템이 처리하는 초당 트랜잭션 수(TPS)는? (각 요청은 1건의 트랜잭션)","o":["① 1,000","② 약 111","③ 90","④ 100"],"a":3,"x":"한 사용자는 '응답 시간 1초 + 생각 시간 9초' = 10초마다 요청 1건을 보내므로, 사용자 1명이 내는 처리량은 초당 0.1건입니다. 따라서 TPS = 동시 사용자 수 / (응답 시간 + 생각 시간) = 1,000 / 10 = 100입니다(리틀의 법칙 응용). ②는 응답 시간을 빼고 생각 시간 9초만으로 나눈 값이고, ①은 생각 시간을 무시한 값입니다.","kw":["sla","autoscaling"]},{"s":"시스템 구조","tp":"데이터센터","q":"데이터센터 설비와 에너지 효율에 대한 설명으로 옳은 것은?","o":["① PUE는 데이터센터 전체 소비 전력을 IT 장비 소비 전력으로 나눈 값으로, 전체 1,500kW 중 IT 장비가 1,000kW를 쓰면 PUE는 1.5이며 1에 가까울수록 효율적이다.","② 냉복도·열복도(Cold/Hot Aisle) 배치에서는 랙의 앞면끼리 마주 보게 하여 그 사이를 열복도로 만든다.","③ 고효율 냉각을 적용하면 PUE를 0.8처럼 1보다 낮게 만들 수 있다.","④ UPS는 정전 시 수일 동안 전력을 공급하는 주 전원 장치로, 비상 발전기를 대신한다."],"a":0,"x":"PUE = 전체 시설 전력 / IT 장비 전력이므로 1,500 / 1,000 = 1.5이고, 냉각·전력 변환 손실 등 IT 외 소비가 적을수록 1에 가까워집니다. ② 서버는 앞면으로 찬 공기를 빨아들이므로 앞면끼리 마주 보는 통로가 냉복도, 뒷면끼리 마주 보는 통로가 열복도입니다. ③ 전체 전력은 IT 전력보다 작을 수 없으므로 PUE는 1 미만이 될 수 없습니다. ④ UPS는 정전 직후 발전기가 가동될 때까지 짧은 시간을 무정전으로 버텨 주는 장치이며, 장시간 전력은 비상 발전기가 담당합니다.","kw":["datacenter"]},{"s":"보안","tp":"정보보안 3요소(CIA)","q":"다음 중 정보보안 3요소 가운데 '가용성(Availability)'이 주로 침해된 사례는?","o":["① 관리자 계정 비밀번호가 평문으로 로그 파일에 기록되어 외부에 노출되었다.","② 공격자가 전송 중인 주문 데이터의 결제 금액을 변조하였다.","③ 퇴사 예정자가 고객 명단을 USB에 복사해 외부로 반출하였다.","④ 대량의 트래픽이 유입되어 온라인 쇼핑몰 서비스가 수 시간 동안 접속 불가 상태가 되었다."],"a":3,"x":"가용성은 인가된 사용자가 필요할 때 정보와 서비스를 이용할 수 있는 성질로, 트래픽 폭주로 서비스가 중단된 ④이 대표적인 가용성 침해입니다. ③과 ①는 허가되지 않은 사람에게 정보가 공개된 것이므로 기밀성 침해입니다. ②는 데이터가 허가 없이 변경된 것이므로 무결성 침해입니다.","kw":["cia","ddos"]},{"s":"보안","tp":"자산·위협·취약점과 위험 대응","q":"위험관리의 구성요소와 위험 대응 전략에 대한 설명으로 옳지 않은 것은?","o":["① 위험 회피(Avoidance)는 보험 가입이나 외주 계약을 통해 손실 부담을 제3자에게 넘기는 전략이다.","② 취약점은 위협이 이용할 수 있는 자산의 약점으로, 취약점이 없다면 위협이 있어도 피해로 이어지기 어렵다.","③ 위험 수용(Acceptance)은 대응 비용이 기대 손실보다 클 때 위험을 인지한 상태로 감수하는 전략이다.","④ 자산은 조직이 보호해야 할 가치가 있는 정보, 시스템, 인력, 시설 등을 말한다."],"a":0,"x":"보험 가입이나 외주 계약으로 손실 부담을 제3자에게 넘기는 것은 위험 전가(Transfer)이므로 ①가 틀렸습니다. 위험 회피는 위험을 일으키는 활동이나 서비스 자체를 중단·변경해 위험 원인을 없애는 전략입니다. ④, ②, ③는 자산·취약점·위험 수용의 일반적인 정의로 옳습니다. 위험은 보통 자산 가치, 위협, 취약점의 결합으로 평가합니다.","kw":["risk_terms","risk_response"]},{"s":"보안","tp":"정량적 위험분석(ALE)","q":"어느 회사의 고객 DB 서버 자산 가치는 10억 원이다. 랜섬웨어 감염 시 자산 가치의 30%가 손실되며(노출계수 EF = 0.3), 이러한 사고는 5년에 한 번 꼴로 발생할 것으로 예상된다. 이 위협의 연간 예상 손실액(ALE)은?","o":["① 3억 원","② 3천만 원","③ 6천만 원","④ 6억 원"],"a":2,"x":"단일 손실 예상액 SLE는 자산 가치 × 노출계수 = 10억 × 0.3 = 3억 원입니다. 연간 발생률 ARO는 5년에 1회이므로 0.2이고, ALE = SLE × ARO = 3억 × 0.2 = 6천만 원입니다. ①의 3억 원은 한 번 사고가 났을 때의 손실(SLE)일 뿐 연간 값이 아닙니다. ②은 ARO를 0.1로, ④은 ARO를 2로 잘못 계산한 값입니다.","kw":["risk_terms","risk_mgmt"]},{"s":"보안","tp":"대칭키·공개키 키 개수","q":"사용자 10명이 서로 1:1로 비밀 통신을 하려고 한다. 대칭키 암호만 사용할 때 필요한 비밀키의 총 개수와, 공개키 암호만 사용할 때 필요한 키(공개키+개인키)의 총 개수를 순서대로 바르게 짝지은 것은?","o":["① 100개, 20개","② 45개, 10개","③ 45개, 20개","④ 90개, 20개"],"a":2,"x":"대칭키 방식은 두 사람마다 서로 다른 비밀키 하나가 필요하므로 n(n-1)/2 = 10×9/2 = 45개입니다. 공개키 방식은 사용자마다 공개키·개인키 한 쌍만 있으면 되므로 2n = 20개입니다. ④의 90개는 쌍을 중복 계산한 값이고, ①의 100개는 n²으로 잘못 계산한 값입니다. ②의 10개는 개인키 또는 공개키 한쪽만 센 것입니다.","kw":["symmetric","asymmetric"]},{"s":"보안","tp":"공개키 암호","q":"공개키 암호 방식에 대한 설명으로 옳지 않은 것은?","o":["① ECC는 RSA에 비해 짧은 키 길이로 비슷한 수준의 안전성을 제공할 수 있다.","② 수신자의 공개키로 암호화한 메시지는 수신자의 개인키로만 복호화할 수 있다.","③ RSA는 이산대수 문제의 어려움에 안전성의 근거를 두고 있다.","④ 일반적으로 대칭키 암호보다 연산 속도가 느려 대용량 데이터 암호화에는 잘 쓰지 않는다."],"a":2,"x":"RSA의 안전성은 큰 수의 소인수분해 문제가 어렵다는 데 근거하므로 ③가 틀렸습니다. 이산대수 문제에 기반한 대표 방식은 Diffie-Hellman, ElGamal, DSA 등이며 ECC는 타원곡선 위의 이산대수 문제에 기반합니다. ②은 공개키 암호의 기밀성 제공 원리이고, ①은 ECC의 장점으로 옳습니다. ④처럼 공개키 암호는 느리기 때문에 실무에서는 키 교환에만 쓰고 데이터는 대칭키로 암호화합니다.","kw":["asymmetric","encryption"]},{"s":"보안","tp":"블록 암호 운용 모드","q":"블록 암호 운용 모드에 대한 설명으로 옳지 않은 것은?","o":["① CBC 모드는 각 블록을 독립적으로 암호화하므로 암호화 과정을 여러 블록에 대해 병렬로 처리할 수 있다.","② GCM 모드는 CTR 방식의 암호화에 인증 태그를 결합하여 기밀성과 무결성을 함께 제공한다.","③ ECB 모드는 동일한 평문 블록이 항상 동일한 암호문 블록으로 바뀌어 평문의 패턴이 드러날 수 있다.","④ CTR 모드는 카운터 값을 암호화한 결과를 평문과 XOR하므로 블록 단위 병렬 처리가 가능하다."],"a":0,"x":"CBC 모드는 직전 암호문 블록을 다음 평문 블록과 XOR한 뒤 암호화하므로 암호화는 순차적으로만 가능합니다(복호화는 병렬 처리가 가능). 따라서 ①이 틀렸습니다. ③은 ECB의 대표적 약점이고, ④의 CTR은 블록 간 의존성이 없어 병렬 처리와 임의 접근이 가능합니다. ②의 GCM은 인증 암호(AEAD) 모드로 TLS 1.3 등에서 널리 사용됩니다.","kw":["block_mode","symmetric"]},{"s":"보안","tp":"해시 함수의 안전성","q":"다음 설명에 해당하는 암호학적 해시 함수의 성질은? / 「메시지 M1이 주어졌을 때, H(M1) = H(M2)를 만족하면서 M1과 다른 메시지 M2를 찾는 것이 계산적으로 어려워야 한다.」","o":["① 충돌 저항성(Collision resistance)","② 제2역상 저항성(Second preimage resistance)","③ 눈사태 효과(Avalanche effect)","④ 역상 저항성(Preimage resistance)"],"a":1,"x":"이미 정해진 메시지 M1에 대해 같은 해시값을 갖는 다른 메시지 M2를 찾기 어려운 성질은 제2역상 저항성입니다. ④의 역상 저항성은 해시값 h만 주어졌을 때 H(M) = h인 M을 찾기 어려운 성질(일방향성)입니다. ①의 충돌 저항성은 M1, M2를 모두 자유롭게 골라도 해시값이 같은 쌍을 찾기 어려운 성질로, 제2역상 저항성보다 강한 조건입니다. ③은 입력이 조금만 바뀌어도 출력이 크게 바뀌는 특성으로, 지문이 말하는 성질과는 다릅니다.","kw":["hash_function"]},{"s":"보안","tp":"메시지 인증 코드(MAC)","q":"메시지 인증 코드(MAC)에 대한 설명으로 옳지 않은 것은?","o":["① 비밀키 없이 메시지만 변조한 공격자는 올바른 MAC 값을 다시 계산할 수 없다.","② MAC은 송신자와 수신자 중 누가 만들었는지 제3자에게 증명할 수 있으므로 부인방지 기능을 제공한다.","③ HMAC은 SHA-256 같은 해시 함수와 비밀키를 결합하여 MAC을 만드는 방식이다.","④ MAC은 송신자와 수신자가 공유한 비밀키를 사용하여 메시지의 무결성과 출처를 확인한다."],"a":1,"x":"MAC은 송신자와 수신자가 같은 비밀키를 공유하므로 두 사람 모두 같은 MAC을 만들 수 있습니다. 그래서 제3자 앞에서 누가 만들었는지 증명할 수 없어 부인방지를 제공하지 못하며, ②이 틀렸습니다. 부인방지가 필요하면 송신자만 가진 개인키로 서명하는 전자서명을 사용해야 합니다. ④, ③, ①는 MAC과 HMAC의 정상적인 특성입니다.","kw":["mac","digital_signature"]},{"s":"보안","tp":"전자서명","q":"A가 B에게 전자서명된 계약서를 보내려고 한다. 전자서명의 생성과 검증에 사용되는 키를 바르게 짝지은 것은?","o":["① 서명 생성: A의 개인키 / 서명 검증: A의 공개키","② 서명 생성: A의 공개키 / 서명 검증: A의 개인키","③ 서명 생성: B의 공개키 / 서명 검증: B의 개인키","④ 서명 생성: A와 B가 공유한 비밀키 / 서명 검증: 같은 비밀키"],"a":0,"x":"전자서명은 서명자만 가진 개인키로 서명(메시지 해시값에 서명)하고, 누구나 얻을 수 있는 서명자의 공개키로 검증합니다. 따라서 A의 개인키로 생성하고 A의 공개키로 검증하는 ①가 정답입니다. ③은 B에게 보내는 메시지를 암호화할 때(기밀성)의 키 사용 방식이지 서명 방식이 아닙니다. ④처럼 공유 비밀키를 쓰면 MAC과 같아져 부인방지를 제공하지 못합니다.","kw":["digital_signature","asymmetric"]},{"s":"보안","tp":"PKI 구성요소","q":"공개키 기반구조(PKI)에 대한 설명으로 옳지 않은 것은?","o":["① 등록기관(RA)은 인증서 신청자의 신원을 확인하고 CA를 대신해 등록 업무를 처리한다.","② 인증서 형식으로는 X.509 표준이 널리 사용된다.","③ CRL은 클라이언트가 특정 인증서의 상태를 실시간으로 질의하고 즉시 응답받는 온라인 프로토콜이다.","④ 인증기관(CA)은 공개키와 소유자 정보를 묶은 인증서를 발급하고 자신의 개인키로 서명한다."],"a":2,"x":"CRL(인증서 폐지 목록)은 CA가 주기적으로 발행하는 폐지된 인증서 목록 파일로, 갱신 주기 사이에는 최신 상태가 반영되지 않을 수 있습니다. 실시간으로 특정 인증서의 상태를 질의·응답하는 프로토콜은 OCSP이므로 ③이 틀렸습니다. ④, ①는 CA와 RA의 역할로 옳고, ②의 X.509는 PKI 인증서의 대표 표준입니다.","kw":["pki"]},{"s":"보안","tp":"전자봉투","q":"전자봉투(Digital Envelope)를 이용해 A가 B에게 대용량 문서를 기밀성 있게 전송하는 절차로 옳은 것은?","o":["① 임의의 세션키(대칭키)로 문서를 암호화한 뒤, 그 세션키를 B의 공개키로 암호화하여 함께 보낸다.","② A의 개인키로 문서 전체를 암호화한 뒤, B는 A의 공개키로 복호화한다.","③ B의 공개키로 문서 전체를 암호화하고, 세션키는 사용하지 않는다.","④ 세션키로 문서를 암호화한 뒤, 세션키를 A의 공개키로 암호화하여 함께 보낸다."],"a":0,"x":"전자봉투는 빠른 대칭키로 문서를 암호화하고, 그 대칭 세션키만 수신자 B의 공개키로 암호화해 함께 보내는 방식입니다. B는 자신의 개인키로 세션키를 꺼낸 뒤 문서를 복호화하므로 ①가 정답입니다. ②은 누구나 A의 공개키로 풀 수 있어 기밀성이 없고, ③는 대용량 데이터를 느린 공개키로 처리해 비효율적입니다. ④은 세션키를 A의 공개키로 감싸므로 B가 풀 수 없습니다.","kw":["digital_envelope","asymmetric","symmetric"]},{"s":"보안","tp":"양자내성암호(PQC)","q":"양자컴퓨팅 위협과 양자내성암호(PQC)에 대한 설명으로 옳지 않은 것은?","o":["① 지금 암호문을 수집해 두었다가 나중에 양자컴퓨터로 해독하는 '선수집 후해독' 위협 때문에 조기 전환이 강조된다.","② Shor 알고리즘은 소인수분해와 이산대수 문제를 효율적으로 풀 수 있어 RSA와 ECC의 안전성을 위협한다.","③ NIST는 격자 기반의 ML-KEM(CRYSTALS-Kyber 기반)을 키 캡슐화 표준으로 제정하였다.","④ Shor 알고리즘은 AES 같은 대칭키 암호도 다항 시간에 해독할 수 있으므로 대칭키 암호 역시 PQC 알고리즘으로 전면 교체해야 한다."],"a":3,"x":"대칭키 암호에 영향을 주는 양자 알고리즘은 Grover 알고리즘으로, 전수조사 속도를 제곱근 수준으로 줄여 실질 키 길이를 절반 정도로 낮추는 효과가 있습니다. 그래서 대칭키는 AES-256처럼 키 길이를 늘리는 방식으로 대응하며, 전면 교체가 필요한 것은 아니므로 ④이 틀렸습니다. ②는 Shor 알고리즘의 영향으로 옳고, ③은 2024년 NIST가 발표한 FIPS 203(ML-KEM)에 해당합니다. ①는 PQC 전환을 서두르는 대표적인 이유입니다.","kw":["pqc","quantum_computing"]},{"s":"보안","tp":"다중 인증(MFA)","q":"다음 중 서로 다른 유형의 인증 요소를 결합한 다중 인증(MFA)에 해당하는 것은?","o":["① 지문 인식 + 얼굴 인식","② PIN 번호 + 비밀번호","③ 비밀번호 + 보안 질문(어머니의 성함)","④ 비밀번호 + 스마트폰 OTP 앱에 표시된 일회용 번호"],"a":3,"x":"MFA는 지식 기반(알고 있는 것), 소유 기반(가지고 있는 것), 존재 기반(생체 등 자신의 특성) 중 서로 다른 유형을 둘 이상 결합해야 합니다. ④는 비밀번호(지식)와 OTP 앱이 설치된 스마트폰(소유)을 결합하므로 MFA입니다. ③과 ②은 모두 지식 기반 요소만 두 번 쓴 것이고, ①는 생체(존재 기반) 요소만 두 개 쓴 것이므로 같은 유형의 반복입니다.","kw":["mfa","authentication"]},{"s":"보안","tp":"FIDO와 패스키","q":"FIDO(Fast IDentity Online) 인증에 대한 설명으로 옳지 않은 것은?","o":["① 서버에 공유 비밀(비밀번호)이 저장되지 않으므로 서버 DB가 유출되어도 계정 탈취 위험이 줄어든다.","② 인증 응답이 접속한 웹사이트의 출처(origin)에 묶이므로 피싱 사이트에서 재사용하기 어렵다.","③ 사용자 기기에서 생성한 키 쌍 중 공개키만 서비스 서버에 등록한다.","④ 사용자의 지문·얼굴 등 생체정보 템플릿을 서비스 서버에 등록해 두고, 로그인할 때마다 서버에서 비교·검증한다."],"a":3,"x":"FIDO에서 생체 인식은 사용자 기기 안에서 개인키 사용을 허락받는 로컬 검증 수단일 뿐, 생체정보는 서버로 전송·저장되지 않습니다. 따라서 생체 템플릿을 서버에서 비교한다는 ④이 틀렸습니다. 서버에는 공개키만 등록되고(③), 기기의 개인키로 서명한 챌린지 응답을 공개키로 검증합니다. 공유 비밀이 없고 출처에 묶여 있어 유출·피싱에 강하다는 ①, ②는 옳습니다.","kw":["fido","authentication"]},{"s":"보안","tp":"OAuth 2.0과 OIDC","q":"OAuth 2.0 및 OpenID Connect(OIDC)에 대한 설명으로 옳지 않은 것은?","o":["① 권한 부여 코드(Authorization Code) 방식에 PKCE를 함께 쓰면 공개 클라이언트에서 코드 가로채기 공격을 완화할 수 있다.","② OAuth 2.0 표준 자체가 사용자 인증 결과를 담는 ID 토큰 형식을 정의하므로, 별도 표준 없이도 로그인 인증 용도로 그대로 쓰도록 설계되었다.","③ OIDC는 OAuth 2.0 위에 인증 계층을 더한 것으로, 사용자 신원 정보를 담은 ID 토큰을 발급한다.","④ OAuth 2.0은 사용자의 비밀번호를 제3자 앱에 넘기지 않고 자원 접근 권한을 위임하기 위한 프레임워크이다."],"a":1,"x":"OAuth 2.0은 인가(권한 위임) 프레임워크이며, 사용자의 신원을 증명하는 ID 토큰은 정의하지 않습니다. ID 토큰은 OAuth 2.0 위에 인증 기능을 얹은 OIDC가 정의하므로 ②가 틀렸습니다. ④은 OAuth의 목적, ①는 PKCE의 역할, ③은 OIDC의 정의로 모두 옳습니다. 액세스 토큰만으로 로그인을 구현하면 토큰이 누구를 위해 발급됐는지 확인하기 어려워 보안 문제가 생길 수 있습니다.","kw":["oauth","jwt"]},{"s":"보안","tp":"Kerberos 인증","q":"Kerberos 인증 프로토콜에 대한 설명으로 옳지 않은 것은?","o":["① 공개키 인증서를 기반으로 동작하므로 서버와 클라이언트 사이의 시간 동기화가 필요하지 않다.","② KDC는 인증 서버(AS)와 티켓 발급 서버(TGS)로 구성된다.","③ 사용자는 AS로부터 받은 TGT를 이용해 TGS에서 서비스별 티켓을 발급받는다.","④ KDC에 인증이 집중되므로 KDC가 장애나 공격을 받으면 전체 인증이 영향을 받는다."],"a":0,"x":"Kerberos는 대칭키 암호를 기반으로 하는 티켓 방식 인증 프로토콜이며, 재전송 공격을 막기 위해 타임스탬프를 사용하므로 시스템 간 시간 동기화가 필요합니다. 따라서 ①이 틀렸습니다. ②, ③은 KDC 구성과 TGT·서비스 티켓 흐름으로 옳습니다. ④처럼 KDC가 단일 실패 지점이 될 수 있다는 점은 Kerberos의 대표적 단점입니다.","kw":["authentication","sso"]},{"s":"보안","tp":"SSO(Single Sign-On)","q":"SSO에 대한 설명으로 옳은 것을 모두 고른 것은? / ㄱ. 한 번의 인증으로 여러 시스템을 이용할 수 있어 사용자 편의성이 높아진다. / ㄴ. 인증 서버가 단일 실패 지점이 될 수 있고, SSO 계정이 탈취되면 연결된 시스템 전체가 위험해질 수 있다. / ㄷ. SSO를 도입하면 인증이 통합되므로 각 애플리케이션의 권한(인가) 관리는 더 이상 필요 없다. / ㄹ. SAML은 XML 기반으로 인증·속성 정보를 교환하는 표준으로 웹 SSO 구현에 사용된다.","o":["① ㄱ, ㄴ","② ㄱ, ㄴ, ㄷ, ㄹ","③ ㄱ, ㄴ, ㄹ","④ ㄴ, ㄷ, ㄹ"],"a":2,"x":"ㄱ은 SSO의 장점, ㄴ은 대표적 단점(단일 실패 지점과 피해 범위 확대)으로 옳습니다. ㄹ의 SAML은 IdP와 SP 사이에 XML 기반 어서션을 주고받는 웹 SSO 표준입니다. ㄷ은 틀렸습니다. SSO는 '누구인가'를 확인하는 인증을 통합할 뿐이고, '무엇을 할 수 있는가'라는 인가는 각 애플리케이션이나 별도 권한 체계에서 계속 관리해야 합니다. 그래서 SSO 도입 시 MFA를 함께 적용해 계정 탈취 위험을 줄이는 것이 권장됩니다.","kw":["sso","authentication"]},{"s":"보안","tp":"접근통제 모델","q":"다음 설명과 접근통제 모델을 바르게 짝지은 것은? / ㄱ. 객체의 소유자가 다른 사용자에게 접근 권한을 재량껏 부여한다. / ㄴ. 주체와 객체에 부여된 보안 등급(레이블)을 비교해 시스템이 강제로 접근 여부를 결정한다. / ㄷ. 사용자의 직무에 따라 정의된 역할에 권한을 부여하고, 사용자는 역할을 할당받는다.","o":["① ㄱ: DAC, ㄴ: RBAC, ㄷ: ABAC","② ㄱ: MAC, ㄴ: DAC, ㄷ: RBAC","③ ㄱ: RBAC, ㄴ: MAC, ㄷ: DAC","④ ㄱ: DAC, ㄴ: MAC, ㄷ: RBAC"],"a":3,"x":"소유자가 재량으로 권한을 주는 방식은 임의적 접근통제(DAC)로, 파일 소유자가 권한을 설정하는 일반 운영체제 방식이 예입니다. 보안 등급 레이블을 비교해 시스템이 강제하는 방식은 강제적 접근통제(MAC)로 군사·정부 시스템에 많이 쓰입니다. 역할 단위로 권한을 묶어 할당하는 방식은 역할 기반 접근통제(RBAC)입니다. ①의 ABAC는 사용자·자원·환경의 속성을 조합한 정책으로 판단하는 모델로 ㄷ과는 다릅니다.","kw":["access_control"]},{"s":"보안","tp":"BLP 모델","q":"보안 등급이 '일급비밀 > 비밀 > 대외비' 순으로 정의된 시스템에 벨-라파둘라(BLP) 모델이 적용되어 있다. '비밀' 등급 사용자가 수행할 수 있는 작업으로 옳은 것은?","o":["① 대외비 문서 읽기 및 일급비밀 문서에 쓰기","② 일급비밀 문서 읽기","③ 일급비밀 문서 읽기 및 대외비 문서에 쓰기","④ 대외비 문서에 쓰기"],"a":0,"x":"BLP는 기밀성 모델로, 자신보다 높은 등급은 읽지 못하고(No Read Up) 자신보다 낮은 등급에는 쓰지 못합니다(No Write Down, *-속성). 따라서 '비밀' 사용자는 낮은 등급인 대외비를 읽을 수 있고, 높은 등급인 일급비밀에 쓰는 것은 허용되므로 ①가 정답입니다. ②은 Read Up, ④는 Write Down이라 금지되며, ③은 두 규칙을 모두 위반합니다. 상위 등급 쓰기를 허용하는 이유는 정보가 낮은 등급으로 새어 나가는 것만 막으면 기밀성이 유지되기 때문입니다.","kw":["blp_biba","access_control"]},{"s":"보안","tp":"RBAC와 ABAC","q":"역할 기반 접근통제(RBAC)와 속성 기반 접근통제(ABAC)에 대한 설명으로 옳지 않은 것은?","o":["① 인사이동이 잦은 조직에서 RBAC를 쓰면 사용자의 역할만 바꾸어 권한 변경을 간단히 처리할 수 있다.","② RBAC는 상충되는 역할을 한 사람이 동시에 갖지 못하게 하는 직무 분리 제약을 적용할 수 있다.","③ ABAC는 사용자 부서, 자원 등급, 접속 시간·위치 등 여러 속성을 조합해 세밀한 정책을 표현할 수 있다.","④ RBAC는 개별 사용자에게 권한을 하나씩 직접 할당하는 방식이므로 사용자 수가 늘어날수록 관리가 쉬워진다."],"a":3,"x":"RBAC는 권한을 역할에 부여하고 사용자는 역할을 할당받는 간접 방식이므로, 사용자에게 권한을 직접 준다는 ④이 틀렸습니다. 권한을 사용자마다 직접 관리하면 사용자 수가 늘어날수록 오히려 관리가 어려워집니다. ②의 직무 분리와 ①의 역할 변경을 통한 손쉬운 권한 관리는 RBAC의 장점입니다. ③은 ABAC의 특징으로, 상황(맥락)에 따른 세밀한 통제가 가능해 제로트러스트 환경에서도 활용됩니다.","kw":["access_control"]},{"s":"보안","tp":"방화벽 유형","q":"방화벽의 유형별 특징에 대한 설명으로 옳지 않은 것은?","o":["① 상태 기반 검사(Stateful Inspection) 방화벽은 세션 상태 테이블을 유지하여 정상 연결에 속한 응답 패킷인지 판단한다.","② 애플리케이션 게이트웨이(프록시) 방식은 응용 계층에서 연결을 중계하므로 세밀한 통제가 가능하지만 처리 부하가 크다.","③ 패킷 필터링 방화벽은 애플리케이션 계층의 페이로드 내용까지 분석하므로 SQL 인젝션 같은 웹 공격을 정밀하게 차단한다.","④ 웹 방화벽(WAF)은 HTTP/HTTPS 트래픽을 분석하여 웹 애플리케이션 공격을 탐지·차단하는 데 특화되어 있다."],"a":2,"x":"패킷 필터링 방화벽은 주로 네트워크·전송 계층 헤더의 출발지·목적지 IP와 포트, 프로토콜 정보로 허용 여부를 판단하며 페이로드 내용은 보지 않습니다. 따라서 SQL 인젝션 같은 응용 계층 공격을 정밀하게 막는다는 ③가 틀렸습니다. 이런 공격은 ④의 WAF나 ②의 애플리케이션 게이트웨이처럼 응용 계층을 분석하는 장비가 담당합니다. ①은 상태 기반 방화벽의 핵심 원리로 옳습니다.","kw":["firewall"]},{"s":"보안","tp":"IDS와 IPS","q":"침입탐지시스템(IDS)과 침입방지시스템(IPS)에 대한 설명으로 옳지 않은 것은?","o":["① IPS는 일반적으로 트래픽 경로에 인라인으로 설치되어 탐지한 공격을 실시간으로 차단할 수 있다.","② 오용 탐지(시그니처 기반)는 알려진 공격 패턴과 비교하므로 오탐이 비교적 적지만 제로데이 공격 탐지에는 약하다.","③ 네트워크 기반 IDS는 미러링된 트래픽을 분석하는 경우가 많아 주로 탐지와 경보 역할을 한다.","④ 이상 탐지(행위 기반)는 알려진 공격 시그니처 DB와 패킷을 대조하는 방식이므로 새로운 공격을 탐지할 수 없다."],"a":3,"x":"이상 탐지는 정상 행위의 기준(프로파일)을 만들어 두고 이를 벗어나는 행위를 공격으로 보는 방식입니다. 시그니처 DB와 대조하는 것은 오용 탐지이므로 ④이 틀렸으며, 이상 탐지는 오히려 알려지지 않은 공격을 탐지할 가능성이 있는 대신 오탐이 많은 편입니다. ②은 오용 탐지의 특징, ①는 인라인 IPS의 특징, ③는 미러링 기반 NIDS의 특징으로 옳습니다.","kw":["ids_ips"]},{"s":"보안","tp":"IPSec","q":"IPSec에 대한 설명으로 옳지 않은 것은?","o":["① AH 프로토콜은 페이로드를 암호화하여 기밀성을 제공하고, ESP는 암호화 없이 무결성만 제공한다.","② 터널 모드는 원래의 IP 패킷 전체를 새로운 IP 헤더로 감싸므로 게이트웨이 간 VPN 구성에 주로 사용된다.","③ IKE는 통신 당사자 간에 보안 연관(SA)을 협상하고 키를 교환하는 데 사용된다.","④ 네트워크 계층(IP 계층)에서 동작하므로 상위 애플리케이션을 수정하지 않고 보호를 적용할 수 있다."],"a":0,"x":"AH(인증 헤더)는 데이터 무결성과 출처 인증을 제공하지만 암호화를 하지 않아 기밀성은 제공하지 않습니다. 암호화로 기밀성을 제공하는 것은 ESP이며, ESP는 무결성·인증 기능도 함께 제공할 수 있습니다. 따라서 두 프로토콜의 역할을 뒤바꾼 ①가 틀렸습니다. ④, ②, ③은 IPSec의 계층, 터널 모드, IKE에 대한 올바른 설명입니다.","kw":["vpn"]},{"s":"보안","tp":"TLS 1.3 핸드셰이크","q":"TLS 1.3에 대한 설명으로 옳지 않은 것은?","o":["① 키 교환에 (EC)DHE를 사용하므로 서버 개인키가 나중에 유출되어도 과거 세션이 복호화되지 않는 전방 비밀성을 제공한다.","② 정적 RSA 키 교환을 기본 키 교환 방식으로 유지하여 기존 TLS 1.2 서버와의 키 교환 호환성을 높였다.","③ 세션 재개 시 0-RTT 데이터를 보낼 수 있지만, 이 데이터는 재전송(replay) 공격에 취약할 수 있다.","④ 전체 핸드셰이크가 1-RTT로 줄어 TLS 1.2보다 연결 수립 지연이 짧다."],"a":1,"x":"TLS 1.3은 전방 비밀성(PFS)이 없는 정적 RSA 키 교환을 아예 제거하고, 임시 키를 쓰는 (EC)DHE 방식만 허용합니다. 따라서 ②이 틀렸습니다. ④의 1-RTT 핸드셰이크, ①의 전방 비밀성은 TLS 1.3의 핵심 개선점입니다. ③처럼 0-RTT는 속도는 빠르지만 재전송 공격 위험이 있어 멱등(같은 요청을 반복해도 결과가 같은)한 요청에만 쓰는 것이 권장됩니다.","kw":["tls"]},{"s":"보안","tp":"SQL 인젝션 대응","q":"다음 코드는 로그인 시 사용자 입력값을 문자열 연결로 SQL에 넣고 있다. / String sql = 'SELECT * FROM users WHERE id=' + 입력id + ' AND pw=' + 입력pw; / 이 코드의 SQL 인젝션 취약점을 제거하기 위한 가장 근본적인 대책은?","o":["① 데이터베이스 오류 메시지를 화면에 상세히 출력하도록 설정한다.","② 웹 서버 앞단에 DDoS 방어 장비를 설치한다.","③ PreparedStatement 등으로 SQL 구문과 입력값을 분리하는 파라미터 바인딩을 적용한다.","④ 로그인 페이지 URL을 추측하기 어려운 주소로 변경한다."],"a":2,"x":"SQL 인젝션은 입력값이 SQL 구문의 일부로 해석되면서 발생하므로, SQL 구조를 먼저 고정하고 입력값은 데이터로만 바인딩하는 파라미터화된 쿼리(③)가 가장 근본적인 대책입니다. ②의 DDoS 방어 장비는 대량 트래픽 공격용이라 인젝션과 관계가 없습니다. ①은 오히려 DB 구조 정보를 노출해 공격을 돕습니다. ④는 숨기기에 의존하는 방법일 뿐 취약점 자체는 남아 있습니다.","kw":["injection","secure_coding"]},{"s":"보안","tp":"XSS와 CSRF","q":"XSS와 CSRF 및 그 대응 방안에 대한 설명으로 옳지 않은 것은?","o":["① CSRF는 로그인한 사용자의 인증된 세션을 악용해 사용자가 의도하지 않은 요청을 서버로 보내게 만드는 공격이다.","② XSS 대응으로 출력 시 HTML 인코딩(이스케이프)과 콘텐츠 보안 정책(CSP)을 적용할 수 있다.","③ 쿠키에 HttpOnly 속성을 설정하면 브라우저가 해당 쿠키를 요청에 자동으로 포함하지 않으므로 CSRF를 근본적으로 차단할 수 있다.","④ 저장형 XSS는 게시판 등에 저장된 악성 스크립트가 다른 사용자의 브라우저에서 실행되는 공격이다."],"a":2,"x":"HttpOnly 속성은 자바스크립트가 쿠키를 읽지 못하게 막아 XSS로 인한 세션 쿠키 탈취를 줄이는 기능입니다. HttpOnly 쿠키도 요청 시에는 브라우저가 자동으로 전송하므로 CSRF는 막지 못하며, ③이 틀렸습니다. CSRF 대응에는 요청마다 검증하는 CSRF 토큰, 쿠키의 SameSite 속성, 중요 기능의 재인증 등을 사용합니다. ④, ②, ①는 XSS·CSRF의 정의와 대응으로 옳습니다.","kw":["xss_csrf"]},{"s":"보안","tp":"OWASP Top 10","q":"OWASP Top 10 2021 버전에서 1위(A01)로 선정된 취약점 항목은?","o":["① 인젝션(Injection)","② 암호화 실패(Cryptographic Failures)","③ 취약한 접근 통제(Broken Access Control)","④ 보안 설정 오류(Security Misconfiguration)"],"a":2,"x":"OWASP Top 10 2021에서는 취약한 접근 통제(Broken Access Control)가 1위로 올라섰습니다. 다른 사용자의 데이터를 URL 파라미터만 바꿔 조회하는 것처럼 권한 검증이 빠진 문제가 매우 많이 발견되었기 때문입니다. ①의 인젝션은 2017년 버전 1위였으나 2021년에는 3위로 내려갔습니다. ②는 2021년 2위, ④은 5위입니다.","kw":["owasp"]},{"s":"보안","tp":"시큐어코딩 보안약점 유형","q":"행정안전부 소프트웨어 개발보안 가이드의 보안약점 유형과 사례를 짝지은 것으로 옳지 않은 것은?","o":["① 하드코드된 비밀번호 - 에러처리","② 검사 시점과 사용 시점(TOCTOU) 경쟁 조건 - 시간 및 상태","③ 오류 메시지를 통한 시스템 정보 노출 - 에러처리","④ 널(Null) 포인터 역참조 - 코드오류"],"a":0,"x":"소스코드에 비밀번호나 암호키를 직접 적어 두는 문제는 인증·암호화·권한 관리 등을 다루는 '보안기능' 유형에 속하므로 ①이 틀렸습니다. ②의 TOCTOU는 확인 시점과 사용 시점 사이에 상태가 바뀌는 문제로 '시간 및 상태' 유형입니다. ③처럼 스택 트레이스 등 상세 오류가 노출되는 것은 '에러처리' 유형이고, ④의 널 포인터 역참조는 '코드오류' 유형입니다.","kw":["secure_coding"]},{"s":"보안","tp":"랜섬웨어 대응","q":"랜섬웨어 대비 및 대응 방안으로 옳지 않은 것은?","o":["① 감염이 의심되면 해당 단말을 즉시 네트워크에서 분리해 확산을 막는다.","② 백업 데이터는 빠른 복구를 위해 운영 서버와 같은 네트워크의 공유 폴더에 항상 쓰기 가능한 상태로 마운트해 둔다.","③ 최근 랜섬웨어는 데이터를 암호화하기 전에 외부로 빼돌린 뒤 유출 공개를 빌미로 협박하는 이중 갈취 방식을 사용하기도 한다.","④ 중요 데이터는 여러 사본을 서로 다른 매체에 보관하고, 그중 하나는 네트워크와 분리된 오프라인 또는 변경 불가(immutable) 저장소에 둔다."],"a":1,"x":"랜섬웨어는 네트워크로 접근 가능한 공유 폴더까지 찾아 암호화하므로, 백업을 운영망에 항상 쓰기 가능하게 연결해 두면 백업까지 함께 암호화될 수 있습니다. 따라서 ②가 틀렸습니다. ④은 이른바 3-2-1 백업 원칙과 오프라인·불변 백업을 의미하며 가장 중요한 대비책입니다. ①은 초기 확산 차단 조치이고, ③는 최근 랜섬웨어 조직의 대표적인 수법입니다.","kw":["ransomware","malware"]},{"s":"보안","tp":"DDoS 공격 유형","q":"다음 지문에서 설명하는 공격과 그 대응 방안을 바르게 짝지은 것은? / 「공격자가 출발지 IP를 위조한 TCP 연결 요청 패킷을 대량으로 보내고 최종 ACK를 보내지 않아, 서버의 반개방(half-open) 연결 대기 큐를 가득 채워 정상 사용자의 접속을 막는다.」","o":["① HTTP GET 플러딩 - 캡차(CAPTCHA) 적용","② UDP 플러딩 - 불필요한 UDP 포트 차단","③ SYN 플러딩 - SYN 쿠키 적용 및 백로그 큐 크기 확대","④ Slowloris - 세션 타임아웃 단축"],"a":2,"x":"TCP 3-way 핸드셰이크에서 SYN만 대량으로 보내고 ACK를 보내지 않아 반개방 연결을 쌓는 공격은 SYN 플러딩입니다. SYN 쿠키는 연결이 완료되기 전까지 서버가 상태를 저장하지 않게 해 대기 큐 소진을 막는 대표적 대응책이며, 백로그 큐 확대도 보조 수단이 됩니다. ②, ①, ④의 공격과 대응은 각각 그 자체로는 연관이 있지만, 지문이 설명하는 TCP 연결 요청 기반 공격과는 다릅니다. 특히 Slowloris는 HTTP 헤더를 아주 느리게 보내 연결을 오래 붙잡는 공격입니다.","kw":["ddos"]},{"s":"보안","tp":"SIEM·SOAR·EDR","q":"다음 설명과 보안관제 솔루션을 바르게 짝지은 것은? / ㄱ. 방화벽·서버·애플리케이션 등 여러 출처의 로그를 수집·정규화하고 상관분석하여 보안 이벤트를 탐지한다. / ㄴ. 정의된 플레이북에 따라 위협 대응 절차를 자동화하고 여러 보안 도구를 연계·조율한다. / ㄷ. PC·서버 등 단말에서 프로세스·파일·레지스트리 행위를 지속적으로 기록·분석해 위협을 탐지하고 단말 격리 등으로 대응한다.","o":["① ㄱ: SIEM, ㄴ: SOAR, ㄷ: EDR","② ㄱ: EDR, ㄴ: SOAR, ㄷ: SIEM","③ ㄱ: SIEM, ㄴ: EDR, ㄷ: SOAR","④ ㄱ: SOAR, ㄴ: SIEM, ㄷ: EDR"],"a":0,"x":"여러 장비의 로그를 모아 상관분석하는 것은 SIEM, 플레이북 기반으로 대응을 자동화·조율하는 것은 SOAR, 단말(엔드포인트) 행위를 감시하고 대응하는 것은 EDR입니다. 따라서 ①가 정답입니다. 보통 SIEM이 탐지한 이벤트를 SOAR가 받아 EDR의 단말 격리 같은 조치를 자동 실행하는 식으로 함께 사용합니다. 나머지 보기는 세 솔루션의 역할을 서로 뒤바꾼 것입니다.","kw":["siem_soar","edr"]},{"s":"보안","tp":"제로트러스트","q":"제로트러스트(Zero Trust) 보안 모델에 대한 설명으로 옳지 않은 것은?","o":["① 사용자와 단말이 VPN을 통해 내부망에 한 번 접속하면 신뢰 구역에 들어온 것으로 보고 이후 내부 자원 접근은 추가 검증 없이 허용한다.","② 마이크로 세그멘테이션으로 네트워크를 잘게 나누어 침해 시 내부 확산(측면 이동)을 줄인다.","③ '절대 신뢰하지 말고 항상 검증하라(Never trust, always verify)'를 기본 원칙으로 한다.","④ 사용자·기기 상태·접속 맥락 등을 근거로 접근할 때마다 최소 권한을 동적으로 부여한다."],"a":0,"x":"제로트러스트는 내부망이라는 위치만으로 신뢰를 주지 않고, 자원에 접근할 때마다 신원과 기기 상태 등을 계속 검증합니다. 내부망 진입 후 추가 검증 없이 허용하는 ①은 전통적인 경계 기반 보안 방식이므로 틀렸습니다. ③는 제로트러스트의 핵심 원칙이고, ②의 마이크로 세그멘테이션과 ④의 동적 최소 권한 부여는 대표적인 구현 요소입니다.","kw":["zero_trust"]},{"s":"보안","tp":"디지털 포렌식 원칙","q":"수사관이 압수한 하드디스크에 대해 '누가, 언제, 어디서 인수받아 어떻게 보관·이송했는지'를 증거 수집부터 법정 제출 시점까지 빠짐없이 기록하였다. 이와 가장 관련 깊은 디지털 포렌식의 기본 원칙은?","o":["① 신속성의 원칙","② 연계 보관성의 원칙(Chain of Custody)","③ 정당성의 원칙","④ 재현의 원칙"],"a":1,"x":"증거물이 수집된 이후 이동·보관·분석·제출에 이르는 모든 단계의 담당자와 경로를 기록해, 중간에 바뀌거나 오염되지 않았음을 보장하는 것은 연계 보관성의 원칙입니다. ③의 정당성은 적법한 절차와 권한으로 증거를 수집해야 한다는 원칙입니다. ④의 재현성은 같은 조건에서 분석하면 같은 결과가 나와야 한다는 원칙이고, ①의 신속성은 휘발성 증거가 사라지기 전에 빠르게 수집해야 한다는 원칙입니다. 실무에서는 수집 직후 해시값을 계산·기록해 무결성도 함께 입증합니다.","kw":["forensics"]},{"s":"보안","tp":"ISMS-P 인증","q":"ISMS-P 인증 제도에 대한 설명으로 옳지 않은 것은?","o":["① 인증의 유효기간은 3년이며, 유효기간 중에는 매년 사후심사를 받아야 한다.","② 일정 요건에 해당하는 정보통신서비스 제공자 등은 ISMS 인증을 의무적으로 받아야 한다.","③ ISMS-P 인증기준은 ISMS 인증기준에 개인정보 처리 단계별 요구사항을 추가한 구조이다.","④ ISMS-P 인증은 개인정보를 처리하는 모든 개인정보처리자가 법적으로 반드시 취득해야 하는 의무 인증이다."],"a":3,"x":"법적 의무 대상이 정해져 있는 것은 정보통신망법에 근거한 ISMS 인증이며, 개인정보 영역까지 포함하는 ISMS-P 인증은 기업이 자율적으로 신청하는 인증입니다. 따라서 모든 개인정보처리자가 의무 취득해야 한다는 ④이 틀렸습니다. ③은 ISMS-P 인증기준의 구성으로 옳습니다. ①의 3년 유효기간과 매년 사후심사, ②의 ISMS 의무 대상 제도도 옳은 설명입니다.","kw":["isms_p"]},{"s":"보안","tp":"CC 인증과 CSAP","q":"정보보호 관련 인증 제도에 대한 설명으로 옳지 않은 것은?","o":["① CC에서 보호프로파일(PP)은 특정 제품군의 공통 보안 요구사항을, 보안목표명세서(ST)는 특정 평가 대상 제품의 보안 목표와 기능을 기술한다.","② CSAP는 공공기관에 클라우드 서비스를 제공하려는 사업자의 서비스가 정해진 보안 기준을 충족하는지 평가·인증하는 제도이다.","③ CC(Common Criteria)는 정보보호 제품의 보안성을 평가하는 국제 표준으로 ISO/IEC 15408로 제정되어 있다.","④ CC의 평가보증등급(EAL)은 EAL1부터 EAL5까지 5단계로 구성되며, 숫자가 높을수록 보증 수준이 낮다."],"a":3,"x":"CC의 평가보증등급은 EAL1부터 EAL7까지 7단계이며, 숫자가 높을수록 더 엄격한 평가를 거친 높은 보증 수준을 뜻합니다. 따라서 단계 수와 방향을 모두 잘못 쓴 ④가 틀렸습니다. ③은 CC의 국제 표준 근거, ①는 PP와 ST의 차이로 옳습니다. ②의 CSAP는 공공 부문 클라우드 도입 시 서비스의 보안성을 검증하는 제도입니다.","kw":["cc_cert","csap"]},{"s":"보안","tp":"가명정보","q":"개인정보보호법상 가명정보에 대한 설명으로 옳지 않은 것은?","o":["① 통계작성, 과학적 연구, 공익적 기록보존 등의 목적으로는 정보주체의 동의 없이 가명정보를 처리할 수 있다.","② 서로 다른 개인정보처리자 간의 가명정보 결합은 지정된 전문기관을 통해 수행한다.","③ 가명정보는 추가 정보 없이는 특정 개인을 알아볼 수 없으므로 개인정보에 해당하지 않으며, 개인정보보호법의 적용을 받지 않는다.","④ 누구든지 특정 개인을 알아보기 위한 목적으로 가명정보를 처리해서는 안 된다."],"a":2,"x":"가명정보는 추가 정보와 결합하면 다시 개인을 알아볼 수 있으므로 여전히 개인정보에 포함되며, 법의 적용을 받습니다. 법 적용에서 제외되는 것은 시간·비용·기술을 합리적으로 고려해도 개인을 알아볼 수 없는 익명정보이므로 ③이 틀렸습니다. ①는 가명정보 특례의 처리 목적, ④은 재식별 목적 처리 금지, ②는 결합전문기관을 통한 결합 절차로 모두 옳습니다.","kw":["pseudonym","anonymization","privacy_law"]},{"s":"보안","tp":"개인정보 안전성 확보조치","q":"개인정보의 안전성 확보조치에 관한 설명으로 옳지 않은 것은?","o":["① 개인정보처리시스템에 대한 접근 권한은 업무 수행에 필요한 최소한의 범위로 차등 부여한다.","② 개인정보취급자의 개인정보처리시스템 접속기록을 보관하고 정기적으로 점검한다.","③ 비밀번호는 분실 시 원래 값을 찾아 줄 수 있도록 AES 같은 양방향 암호화 방식으로 저장해야 한다.","④ 개인정보 보호를 위한 내부 관리계획을 수립·시행한다."],"a":2,"x":"비밀번호는 관리자도 원래 값을 알 수 없도록 복호화되지 않는 일방향 암호화(해시)로 저장해야 하므로 ③가 틀렸습니다. 분실 시에는 원래 비밀번호를 알려 주는 대신 본인 확인 후 재설정하게 하는 것이 올바른 방식입니다. ①은 최소 권한 원칙에 따른 접근 권한 관리, ②은 접속기록의 보관·점검, ④는 내부 관리계획 수립으로 모두 안전성 확보조치의 주요 항목입니다.","kw":["safety_measures","hash_function"]},{"s":"보안","tp":"개인정보 영향평가","q":"개인정보 영향평가(PIA)에 대한 설명으로 옳은 것은?","o":["① 공공기관이 일정 요건에 해당하는 개인정보파일을 구축·운용하거나 변경하려는 경우 수행하며, 설계 단계에서 수행해 결과를 반영하는 것이 바람직하다.","② 영향평가는 시스템 구축이 완료되고 운영이 안정화된 후에 수행하는 것이 원칙이다.","③ 공공기관은 영향평가를 외부 기관에 맡길 수 없으며 반드시 내부 직원이 자체적으로 수행해야 한다.","④ 개인정보를 처리하는 모든 민간 기업은 신규 시스템을 구축할 때마다 영향평가를 의무적으로 수행해야 한다."],"a":0,"x":"개인정보 영향평가는 공공기관이 일정 요건의 개인정보파일을 구축·변경할 때 의무적으로 수행하며, 위험 요소를 미리 찾아 설계에 반영하려는 제도이므로 분석·설계 단계에서 하는 것이 바람직합니다. 따라서 ①이 옳습니다. ④은 민간은 의무가 아니라 자율 수행 대상이라 틀렸고, ②는 구축 완료 후에는 개선 비용이 커져 제도 취지에 맞지 않습니다. ③는 틀렸으며, 공공기관은 개인정보보호위원회가 지정한 영향평가기관에 평가를 의뢰합니다.","kw":["privacy_law","pbd"]},{"s":"보안","tp":"개인정보 전송요구권","q":"개인정보보호법상 정보주체의 개인정보 전송 요구권에 대한 설명으로 옳지 않은 것은?","o":["① 정보주체는 자신의 개인정보를 본인에게 전송하거나 다른 개인정보처리자 등에게 전송하도록 요구할 수 있다.","② 전송 대상은 정보주체의 동의나 계약 이행 등을 근거로 처리되는 개인정보를 중심으로 한다.","③ 전송은 컴퓨터 등 정보처리장치로 처리 가능한 형태로 이루어져야 한다.","④ 개인정보처리자가 수집한 정보를 분석·가공하여 별도로 새로 생성한 정보도 예외 없이 모두 전송 대상에 포함된다."],"a":3,"x":"전송 요구권은 정보주체가 자기 정보를 본인 또는 다른 처리자에게 옮기도록 요구하는 권리로, 이른바 개인정보 이동권에 해당합니다. 다만 처리자가 수집한 정보를 기초로 분석·가공하여 별도로 생성한 정보는 처리자의 노력이 들어간 결과물이므로 전송 대상에서 제외되며, ④가 틀렸습니다. ①, ②, ③은 전송 요구의 상대방, 대상 정보, 전송 형태에 대한 올바른 설명입니다.","kw":["mydata","privacy_law"]},{"s":"보안","tp":"클라우드 공동 책임 모델","q":"클라우드 보안의 공동 책임 모델(Shared Responsibility Model)에 대한 설명으로 옳지 않은 것은?","o":["① IaaS에서는 가상 머신의 게스트 운영체제 보안 패치도 클라우드 서비스 제공자(CSP)가 전적으로 책임진다.","② SaaS에서도 사용자 계정·접근 권한 관리와 저장하는 데이터 보호는 이용자의 책임이 남는다.","③ IaaS → PaaS → SaaS로 갈수록 이용자가 직접 관리하는 책임 범위가 줄어든다.","④ 데이터센터의 물리적 보안과 하드웨어 관리는 서비스 모델과 관계없이 CSP의 책임이다."],"a":0,"x":"IaaS에서 CSP는 물리 인프라와 가상화 계층까지 책임지고, 그 위의 게스트 운영체제·미들웨어·애플리케이션·데이터는 이용자가 관리합니다. 따라서 게스트 OS 패치를 CSP가 전적으로 책임진다는 ①이 틀렸습니다. ④는 모든 모델에서 공통인 CSP 책임이고, ②처럼 SaaS라도 계정과 데이터 관리는 이용자 몫입니다. ③는 서비스 모델이 올라갈수록 CSP의 관리 범위가 넓어진다는 뜻으로 옳습니다.","kw":["cloud"]}];const KN={"data":"데이터","information":"정보","bit_byte":"비트와 바이트","computer_arch":"컴퓨터 구조(폰 노이만)","cpu":"CPU(중앙처리장치)","memory":"주기억장치(RAM)","storage":"보조기억장치(HDD·SSD)","cache":"캐시 메모리","program":"프로그램","software":"소프트웨어","os":"운영체제(OS)","algorithm":"알고리즘","complexity":"시간복잡도(Big-O)","datastruct":"자료구조","file":"파일","db":"데이터베이스","dbms":"DBMS","network":"네트워크","protocol":"프로토콜","client_server":"클라이언트-서버","api":"API","interface":"인터페이스","info_system":"정보시스템","probability":"확률","statistics":"통계","ai":"인공지능(AI)","ml":"머신러닝","project":"프로젝트","array":"배열","linked_list":"연결 리스트","stack":"스택","queue":"큐","tree":"트리","bst":"이진 탐색 트리(BST)","avl":"균형 트리(AVL·Red-Black)","btree":"B-트리와 B+트리","heap":"힙과 우선순위 큐","graph":"그래프","hashing":"해싱과 해시 테이블","sorting":"정렬 알고리즘","quick_sort":"퀵 정렬","merge_sort":"병합 정렬","recursion":"재귀","divide_conquer":"분할정복","dynamic_programming":"동적계획법","greedy":"탐욕 알고리즘","metaheuristic":"메타휴리스틱(유전 알고리즘 등)","process":"프로세스","thread":"스레드","pcb":"PCB와 문맥 교환","interrupt":"인터럽트","cpu_scheduling":"CPU 스케줄링","critical_section":"임계구역과 경쟁 조건","mutex":"뮤텍스","semaphore":"세마포어","deadlock":"교착상태","bankers":"은행가 알고리즘","priority_inversion":"우선순위 역전","ipc":"프로세스 간 통신(IPC)","virtual_memory":"가상  if(shown)h+=`<div class="xp"><b>정답 ${q.a.length===4?'모두 정답':q.a.map(i=>'①②③④'[i]).join(', ')}</b>${q.y?' (공식)':''} ${esc(q.x)}${q.kw.length?`<div>${q.kw.map(k=>`<a class="kwl" href="./#kw=${k}">키워드: ${esc(KN[k]||k)} ›</a>`).join('')}</div>`:''}<div><button class="mini ghost" data-act="reset">다시 풀기</button></div></div>`;
 return h+'</article>';}

 $('#gList').innerHTML=L.slice(0,G.lim).map(card).join('')||'<p class="sub card">해당 문제가 없어요.</p>';
 $('#gMore').hidden=L.length<=G.lim;$('#gMore').textContent=`더 보기 (${L.length-G.lim}개 남음)`;}
$('#gList').addEventListener('click',e=>{const art=e.target.closest('.gq');if(!art)return;const id=art.dataset.id,q=byId(id);const o=e.target.closest('[data-o]');const a=e.target.closest('[data-act]');
 if(o&&res[id]==null&&!open.has(id)){res[id]=+o.dataset.o;st.set('itpe-gamri2',res);}
 else if(a&&a.dataset.act==='show'){open.has(id)?open.delete(id):open.add(id);}
 else if(a&&a.dataset.act==='reset'){delete res[id];open.delete(id);st.set('itpe-gamri2',res);}
 else return;
 art.outerHTML=card(q);count(list());});
document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{G.cat=b.dataset.cat;st.set('itpe-gcat',G.cat);G.y=0;G.s='';G.lim=30;G.order=null;render();}));
$('#gYear').addEventListener('click',e=>{const b=e.target.closest('[data-gy]');if(!b)return;G.y=+b.dataset.gy;G.lim=30;render();});
$('#gSub').addEventListener('click',e=>{const b=e.target.closest('[data-gs]');if(!b)return;G.s=b.dataset.gs;G.lim=30;render();});
document.querySelectorAll('[data-gm]').forEach(b=>b.addEventListener('click',()=>{G.m=b.dataset.gm;G.lim=30;if(G.m==='shuf')G.order=null;document.querySelectorAll('[data-gm]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();}));
let tm;$('#gText').addEventListener('input',e=>{clearTimeout(tm);tm=setTimeout(()=>{G.text=e.target.value.trim();G.lim=30;render();},150)});
$('#gMore').addEventListener('click',()=>{G.lim+=30;render();});
render();
</script>
</body>
</html>
