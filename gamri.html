<style>
/* Mobile-first, iPhone 11 Pro (375×812). Thumb zone: bottom tab bar. One column, 44px+ targets, 16px inputs (no iOS zoom). */
:root{
  /* Bright, single light theme by choice: sky-blue sheet, mint for done, sunny yellow highlights */
  --bg:#f3f8ff; --card:#ffffff; --ink:#1d2a44; --sub:#62708a; --line:#e3ebf7; --soft:#edf3fd;
  --accent:#3d6df2; --accent-soft:#e6eeff; --done:#1fb68a; --ai:#a35cf0; --ai-soft:#f4ebff; --sun:#ffc94a; --sun-soft:#fff6dc; --pink:#ff7aa2;
  --a1:#3d6df2; --a2:#1fb68a; --a3:#f29a2e; --a4:#7b8aa6; --a5:#f0607a; --a6:#c49a1a; --a7:#a35cf0;
  --f:"Pretendard Variable","Pretendard","IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  --fd:"Jua","Pretendard Variable","IBM Plex Sans KR",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --tabh:58px; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg) linear-gradient(180deg,#e3efff 0,#f3f8ff 260px) no-repeat;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 16px)}
.wrap{max-width:560px;margin:0 auto}
header{padding-block:14px 6px}
header .t{font-size:13px;color:var(--accent);font-weight:600;letter-spacing:.01em}
h1{font-family:var(--fd);font-size:28px;line-height:1.25;margin:2px 0 0;font-weight:400;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--fd);font-size:20px;margin:24px 0 10px;font-weight:400}
p{margin:0 0 10px}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 2px 10px rgba(61,109,242,.06)}
.stack{display:grid;gap:10px}
.prog{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#6fa8ff);width:0;transition:width .25s}
.big{font-size:28px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.1}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* check rows */
.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(61,109,242,.06)}
.list li{border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.chk{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:12px 14px;min-height:52px;cursor:pointer}
.chk input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:1px 0 0;border:2px solid var(--line);border-radius:7px;background:var(--card);display:grid;place-content:center;cursor:pointer}
.chk input::after{content:"";width:12px;height:7px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.chk input:checked{background:var(--done);border-color:var(--done)}
.chk input:checked::after{opacity:1}
.chk input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chk .m{font-size:12px;color:var(--sub);font-family:var(--mono);display:block;margin-bottom:2px}
.chk .q{display:block;font-size:16px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
li.done .q{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--line)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:4px;vertical-align:1px}
.tag.ai{color:var(--ai);background:var(--ai-soft)}
/* filter chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:600 14px var(--f);color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:36px;cursor:pointer}
.chip[aria-pressed="true"]{color:#fff;background:var(--accent);border-color:var(--accent)}
.search{width:100%;font:16px var(--f);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px;height:44px}
.search:focus{outline:2px solid var(--accent);outline-offset:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:10px;padding:3px;gap:3px;margin:8px 0}
.seg button{font:600 14px var(--f);color:var(--sub);background:none;border:0;border-radius:8px;height:34px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.count{font-size:13px;color:var(--sub);margin:4px 2px 8px}
.more{display:block;width:100%;margin-top:10px;height:44px;font:600 15px var(--f);color:var(--accent);background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer}
/* topics */
.topic{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;min-height:52px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);font:16px var(--f);color:var(--ink);cursor:pointer}
.topic:last-child{border-bottom:0}
.topic .n{font-family:var(--mono);font-weight:700;color:var(--accent);font-size:15px}
.topic .r{display:block;font-size:12px;color:var(--sub);font-family:var(--mono)}
/* guide accordions */
details{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(61,109,242,.06)}
details+details{margin-top:10px}
summary{list-style:none;padding:14px 16px;min-height:52px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);margin-top:-4px;transition:transform .2s}
details[open] summary::after{transform:rotate(225deg);margin-top:4px}
.dbody{padding:0 16px 14px;font-size:15px}
.dbody ul,.dbody ol{padding-left:20px;margin:0 0 8px}
.dbody li{margin-bottom:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
.kv b{white-space:nowrap}
.bar{display:grid;grid-template-columns:96px 1fr 30px;gap:8px;align-items:center;font-size:13px;margin-bottom:6px}
.bar .tr{height:10px;background:var(--soft);border-radius:3px;overflow:hidden}.bar .tr i{display:block;height:100%}
.bar .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
pre{font:13px/1.65 var(--mono);background:var(--soft);border-radius:10px;padding:12px;margin:0 0 8px;white-space:pre-wrap}
a{color:var(--accent)}
.links a{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.links a:last-child{border-bottom:0}
.links a span{color:var(--sub);font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
/* bottom tab bar */
nav.tab{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);
  padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
nav.tab button{height:var(--tabh);background:none;border:0;font:600 11px var(--f);color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
nav.tab button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tab button[aria-selected="true"]{color:var(--accent)}
nav.tab button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.num{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.row+.prog,.row ~ .prog{margin-top:6px}
.qc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(61,109,242,.06)}
.qc.ok{border-color:color-mix(in srgb,var(--done) 45%,var(--line))}
.qc.again{border-color:color-mix(in srgb,var(--a3) 55%,var(--line))}
.qc .qh{padding:14px 16px 4px}
.qc .qm{font-size:12px;color:var(--sub);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.qc .qq{font-size:17px;font-weight:700;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
.st{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px}
.st.ok{color:var(--done);background:color-mix(in srgb,var(--done) 14%,transparent)}
.st.again{color:var(--a3);background:color-mix(in srgb,var(--a3) 16%,transparent)}
.reveal{display:block;width:calc(100% - 32px);margin:10px 16px 14px;height:44px;font:600 15px var(--f);color:var(--accent);background:var(--accent-soft);border:0;border-radius:10px;cursor:pointer}
.ans{padding:0 16px 14px;font-size:15px}
.ans .def{background:var(--soft);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.ans ol{padding-left:20px;margin:0 0 10px}.ans li{margin-bottom:8px;word-break:keep-all;overflow-wrap:anywhere}
.ans .kw{font-size:13px;color:var(--sub);margin-bottom:12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns button{height:46px;border-radius:10px;font:700 15px var(--f);cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btns .b-ok{background:var(--done);border-color:var(--done);color:#fff}
.btns .b-again{color:var(--a3);border-color:color-mix(in srgb,var(--a3) 50%,var(--line))}
.go{display:block;margin-top:8px;height:44px;width:100%;font:600 14px var(--f);color:var(--sub);background:none;border:1px dashed var(--line);border-radius:10px;cursor:pointer}
.pat{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:6px 6px 6px 12px;font-size:14px;margin:4px 0 6px}
.pat span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pat button{flex:0 0 auto;height:34px;padding:0 12px;border:0;border-radius:8px;background:var(--card);color:var(--accent);font:600 14px var(--f);cursor:pointer}
.sunny{background:var(--sun-soft);border-color:#ffe7a3}
.hello{display:flex;align-items:center;gap:12px}
.hello .em{flex:0 0 auto;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--sun),#ffa94a);display:grid;place-content:center;color:#fff;font-family:var(--fd);font-size:20px}
.quote{font-family:var(--fd);font-size:20px;line-height:1.45;color:var(--ink)}
.tip{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;padding:12px 0;border-bottom:1px dashed var(--line)}
.tip:last-child{border-bottom:0}
.tip .ic{width:36px;height:36px;border-radius:12px;display:grid;place-content:center;font-family:var(--fd);font-size:17px;color:#fff}
.tip b{display:block;font-size:16px;margin-bottom:2px}
.tip p{margin:0;color:var(--sub);font-size:15px;word-break:keep-all}
.go-list a{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;padding:10px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.go-list a:last-child{border-bottom:0}
.go-list a small{display:block;color:var(--sub);font-size:13px}
.go-list a .arr{flex:0 0 auto;color:var(--accent);font-weight:700}
.steps{counter-reset:st;list-style:none;margin:0;padding:0}
.steps li{counter-increment:st;display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px;word-break:keep-all}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(st);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-content:center;font-size:13px}
.help{padding:0 14px 12px 54px;font-size:14px;color:var(--sub);word-break:keep-all}
li.done .help{display:none}
.mini{display:inline-flex;align-items:center;min-height:36px;margin:6px 6px 0 0;padding:0 12px;border:0;border-radius:10px;background:var(--accent-soft);color:var(--accent);font:600 14px var(--f);cursor:pointer;text-align:left}
.mini.ghost{background:var(--soft);color:var(--sub)}
.kwl li{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-height:52px}
.kwl li:last-child{border-bottom:0}
.kwl .nm{flex:1;font-weight:700;font-size:16px;word-break:keep-all}
.kwl .gm{font-size:12px;color:var(--sub);font-weight:500;display:block}
.kwl .bd{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.bd.ok{background:#e3f6ee;color:#14825f}.bd.again{background:#fff1c9;color:#9a6a00}.bd.due{background:#ffe3e3;color:#c0392b}
.kwv{padding-bottom:20px}
.crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px;color:var(--sub);margin:10px 0 6px}
.crumb button{border:0;background:var(--soft);color:var(--ink);border-radius:8px;padding:4px 8px;font:600 13px var(--f);cursor:pointer}
.kwbig{text-align:center;padding:28px 12px 18px}
.kwbig .g{font-size:13px;color:var(--accent);font-weight:600}
.kwbig .term{font-family:var(--fd);font-size:34px;line-height:1.2;margin:8px 0 6px;word-break:keep-all}
.kwbig .hint{font-size:14px;color:var(--sub)}
.sec{margin-top:12px}.sec>.lab{display:flex;align-items:center;gap:6px}
.sec .num{display:inline-grid;place-content:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px}
.chipbtn{display:inline-flex;align-items:center;gap:4px;margin:4px 6px 0 0;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font:600 14px var(--f);color:var(--ink);cursor:pointer}
.chipbtn.down{border-color:color-mix(in srgb,var(--a3) 60%,var(--line));background:#fff7ea}
.kq{border:1px solid var(--line);border-radius:12px;margin:6px 0;overflow:hidden}
.kq button{display:block;width:100%;text-align:left;background:var(--soft);border:0;padding:10px 12px;font:600 15px var(--f);color:var(--ink);cursor:pointer;word-break:keep-all}
.kq .a{padding:10px 12px;font-size:15px;word-break:keep-all}
.kwnav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kwnav button{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);font:600 14px var(--f);color:var(--ink);cursor:pointer}
ul.kk{margin:0;padding-left:18px}ul.kk li{margin:4px 0;font-size:15px;word-break:keep-all}
.rk{list-style:none;margin:0;padding:0!important}.rk>li{margin:0!important}
.rk>li{border-bottom:1px solid var(--line);padding:10px 0}.rk>li:last-child{border-bottom:0}
.rk .rh{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;width:100%;background:none;border:0;padding:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.rk .no{font-family:var(--mono);font-weight:700;color:var(--accent);text-align:center}
.rk .nm{font-weight:700;font-size:15px;line-height:1.35}
.rk .ct{font-family:var(--mono);font-size:13px;color:var(--sub);white-space:nowrap}
.rk .st3{grid-column:2/4;display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft);margin-top:6px}
.rk .st3 i{display:block;height:100%}
.rk .rb{margin:8px 0 0 36px;font-size:14px}
.rk .rb ul{margin:6px 0 0;padding-left:18px}.rk .rb li{margin:3px 0}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--sub);margin:4px 0 10px}.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.hot{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:#fff1c9;color:#9a6a00;font-size:11px;font-weight:700;vertical-align:2px}
.qa{padding:0 14px 12px 54px}
.qa.open{font-size:15px}
.qa ol{padding-left:20px;margin:8px 0}.qa li{margin-bottom:6px;word-break:keep-all;overflow-wrap:anywhere}
.easy{background:var(--sun-soft);border-radius:12px;padding:10px 12px;margin:6px 0 10px;font-size:15px;word-break:keep-all}
.easy b{color:#9a7300;margin-right:4px}

<script>
const GQ=[{"s":"감리 및 사업관리","tp":"감리 개념","q":"전자정부법상 정보시스템 감리의 개념에 대한 설명으로 가장 적절한 것은?","o":["① 발주기관이 사업자의 성과를 평가하여 대가 지급 여부를 최종 결정하는 검사·검수 행위","② 감리발주자 및 피감리인의 이해관계로부터 독립된 자가 제3자의 관점에서 정보시스템의 구축 및 운영 등에 관한 사항을 종합적으로 점검하고 문제점을 개선하도록 하는 것","③ 개발사업자가 자체 품질보증 조직을 운영하여 자사 산출물을 검토하는 내부 활동","④ 운영 중 발생한 보안사고의 원인을 수사기관과 함께 조사하는 디지털 포렌식 활동"],"a":1,"x":"정보시스템 감리의 핵심은 발주자와 사업자 어느 쪽의 이해관계에도 묶이지 않은 독립된 제3자가 구축·운영 전반을 종합 점검하고 개선을 유도한다는 점입니다. 검사·검수와 대가 지급 결정은 발주기관 고유 권한이지 감리 자체가 아닙니다. 사업자 내부 품질보증은 독립된 제3자 점검이 아니므로 감리와 다르고, 보안사고 포렌식 조사는 감리의 정의와 무관합니다.","kw":["audit","e_gov_law"]},{"s":"감리 및 사업관리","tp":"감리 목적","q":"정보시스템 감리의 목적 또는 기대 효과로 옳지 않은 것은?","o":["① 정보시스템의 효율성을 향상시킨다","② 정보시스템의 안전성을 확보한다","③ 사업 수행 중 위험과 문제점을 조기에 식별해 개선을 유도한다","④ 감리인이 피감리인을 대신해 결함을 직접 수정하고 산출물을 작성하여 납기 준수를 보장한다"],"a":3,"x":"감리는 점검하고 개선을 '권고·요구'하는 역할이며, 결함 수정과 산출물 작성은 어디까지나 피감리인(사업자)의 책임입니다. 감리인이 직접 개발·수정을 하면 스스로 만든 것을 스스로 점검하게 되어 독립성이 무너집니다. 효율성 향상, 안전성 확보, 위험의 조기 식별과 개선 유도는 모두 감리의 대표적인 목적입니다.","kw":["audit"]},{"s":"감리 및 사업관리","tp":"감리 시점","q":"정보시스템 구축사업에서 단계별 감리를 3회 실시하는 경우, 일반적인 감리 시점의 조합으로 옳은 것은?","o":["① 요구정의 단계 – 설계 단계 – 종료 단계","② 착수 단계 – 개발 단계 – 운영 단계","③ 계획 단계 – 분석 단계 – 테스트 단계","④ 설계 단계 – 구현 단계 – 유지보수 단계"],"a":0,"x":"구축사업 단계별 감리는 일반적으로 요구정의, 설계, 종료 시점에 수행하며, 사업 특성에 따라 설계·종료 2회로 하기도 합니다. 요구정의 단계 감리는 요구사항이 과업 범위에 맞게 정의됐는지를, 설계 단계 감리는 설계 산출물의 적정성을, 종료 단계 감리는 과업 이행과 시험·이관 준비를 봅니다. 나머지 조합은 일반적인 감리 시점 구분이 아니며, 운영·유지보수는 구축 감리가 아니라 운영 감리의 영역입니다.","kw":["audit"]},{"s":"감리 및 사업관리","tp":"감리 시점별 점검","q":"요구정의 단계 감리에서 중점적으로 점검할 사항으로 가장 적절한 것은?","o":["① 통합시험에서 발견된 결함이 모두 조치되었는지","② 운영 조직으로의 시스템 이관과 인수인계가 완료되었는지","③ 하자보수 계획이 수립되어 이행되고 있는지","④ 요구사항이 제안요청서·계약서 등 과업 내용과 대비해 누락이나 모호함 없이 정의되었고 추적 가능한지"],"a":3,"x":"요구정의 단계 감리는 사업 초기에 요구사항이 과업 범위를 빠짐없이 반영했는지, 모호하지 않은지, 이후 설계·시험까지 추적할 수 있는지를 확인하는 것이 핵심입니다. 이 시점에 요구가 흔들리면 이후 단계의 재작업과 과업 분쟁으로 이어지기 때문입니다. 통합시험 결함 조치, 운영 이관·인수인계, 하자보수는 모두 종료 단계 이후에 확인할 내용입니다.","kw":["audit","requirements"]},{"s":"감리 및 사업관리","tp":"감리 수행 절차","q":"다음 감리 수행 활동을 일반적인 순서대로 바르게 나열한 것은? / ㄱ. 감리계획 수립 / ㄴ. 예비조사 / ㄷ. 감리보고서 작성·통보 / ㄹ. 시정조치 확인 / ㅁ. 감리 실시(현장 점검)","o":["① ㄱ → ㄴ → ㅁ → ㄷ → ㄹ","② ㄴ → ㄱ → ㅁ → ㄹ → ㄷ","③ ㄱ → ㅁ → ㄴ → ㄷ → ㄹ","④ ㄴ → ㄱ → ㅁ → ㄷ → ㄹ"],"a":3,"x":"감리는 먼저 예비조사로 사업 특성과 위험을 파악하고, 이를 바탕으로 감리계획을 세운 뒤 현장 감리를 실시합니다. 실시 결과를 감리보고서로 정리해 감리발주자에게 통보하고, 지적사항에 대한 피감리인의 시정조치 이행 여부를 마지막으로 확인합니다. 계획을 예비조사보다 먼저 세우면 근거 없는 계획이 되고, 보고서보다 시정조치 확인이 먼저 올 수는 없습니다.","kw":["audit"]},{"s":"감리 및 사업관리","tp":"감리 수행 절차","q":"감리 수행 절차 중 '예비조사'에 대한 설명으로 옳은 것은?","o":["① 감리 결과 지적된 문제점이 시정되었는지 확인하는 활동","② 감리 종료 후 감리원의 업무 성과를 평가하는 활동","③ 사업의 특성·범위·주요 위험 등을 사전에 파악하여 점검 항목, 투입 인력, 일정 등 감리계획 수립에 반영하는 활동","④ 사업자 선정을 위해 제안서의 기술 부분을 평가하는 활동"],"a":2,"x":"예비조사는 본 감리에 앞서 사업 개요, 진행 상황, 산출물 현황, 주요 이슈를 파악해 무엇을 중점적으로 볼지 정하는 준비 단계입니다. 그래서 예비조사 결과가 감리계획의 점검 항목과 투입 인력 산정의 근거가 됩니다. 지적사항 시정 확인은 시정조치 확인 단계이고, 감리원 성과 평가나 제안서 기술평가는 예비조사와 관계가 없습니다.","kw":["audit"]},{"s":"감리 및 사업관리","tp":"시정조치 확인","q":"감리 결과 지적사항의 시정조치에 관한 설명으로 옳지 않은 것은?","o":["① 감리발주자는 감리 결과에 따라 피감리인에게 시정조치를 요구할 수 있다","② 피감리인은 시정조치 계획을 수립·이행하고 그 결과를 감리발주자에게 알린다","③ 감리 지적사항은 단순 참고 의견이므로 피감리인은 시정 여부를 임의로 정하며 결과를 감리발주자에게 알릴 필요가 없다","④ 시정조치 이행 여부는 감리인의 확인을 거치거나 후속 단계 감리에서 다시 점검될 수 있다"],"a":2,"x":"감리 지적사항은 감리발주자가 피감리인에게 시정조치를 요구하는 근거가 되며, 피감리인은 정당한 사유가 없으면 이를 이행하고 결과를 알려야 합니다. 그래서 임의로 무시하고 통보도 하지 않아도 된다는 설명이 틀렸습니다. 시정조치 계획 수립·이행·통보, 감리인의 이행 확인, 후속 단계 감리에서의 재점검은 모두 시정조치 체계의 정상적인 흐름입니다.","kw":["audit","e_gov_law"]},{"s":"감리 및 사업관리","tp":"감리원 구분","q":"정보시스템 감리원에 대한 설명으로 옳은 것은?","o":["① 감리원 자격은 피감리인이 사업마다 임의로 부여한다","② 감리원은 수석감리원과 감리원으로 구분되며, 수석감리원은 감리팀을 총괄하는 책임자 역할을 한다","③ 수석감리원은 해당 사업 개발사업자의 PM이 겸임하는 것이 원칙이다","④ 감리원은 독립성 요건이 없으므로 피감리인 소속 직원도 감리원이 될 수 있다"],"a":1,"x":"감리원은 수석감리원과 감리원으로 나뉘며, 수석감리원은 감리계획부터 보고서까지 감리팀을 총괄하고 감리원은 분야별 점검을 맡습니다. 감리원 자격은 법령에서 정한 기준에 따라 인정되며 피감리인이 임의로 줄 수 없습니다. 사업자 PM 겸임이나 피감리인 소속 직원의 감리 참여는 '스스로를 점검'하는 구조라 감리의 독립성 원칙에 정면으로 어긋납니다.","kw":["audit"]},{"s":"감리 및 사업관리","tp":"감리 독립성","q":"A감리법인이 B기관의 정보시스템 구축사업에 대한 감리를 수행하려 한다. 다음 중 감리의 독립성 측면에서 가장 문제가 되는 상황은?","o":["① A감리법인이 해당 사업을 수행하는 개발사업자와 계열회사 관계에 있다","② A감리법인이 다른 기관의 유사한 사업을 감리한 경험이 있다","③ A감리법인의 감리원이 해당 분야 기술사 자격을 보유하고 있다","④ A감리법인이 과거 B기관의 다른 사업을 감리한 적이 있다"],"a":0,"x":"감리는 피감리인의 이해관계로부터 독립되어야 하므로, 감리법인이 해당 사업 수행자와 계열관계에 있으면 공정한 점검을 기대하기 어렵습니다. 이런 경우는 감리 수행이 제한되는 대표적 사례입니다. 유사 사업 감리 경험이나 기술사 자격은 오히려 전문성을 뒷받침하고, 같은 발주기관의 다른 사업을 감리했다는 사실만으로는 해당 사업 사업자와 이해관계가 생기지 않습니다.","kw":["audit"]},{"s":"감리 및 사업관리","tp":"감리 시점별 점검","q":"구축사업의 종료 단계 감리에서 점검할 내용으로 가장 거리가 먼 것은?","o":["① 과업 내용 대비 기능 구현의 완료 여부(과업 이행 여부)","② 통합시험·인수시험 결과와 발견 결함의 조치 여부","③ 운영자 교육, 운영 매뉴얼 등 운영 이관 준비의 적정성","④ 업무 요구사항을 처음 도출하기 위한 현행 업무 인터뷰 계획의 적정성"],"a":3,"x":"종료 단계 감리는 계약된 과업이 실제로 다 구현됐는지, 시험 결과와 결함 조치가 충분한지, 운영으로 넘길 준비가 됐는지를 확인합니다. 요구사항 도출을 위한 인터뷰 계획은 사업 초기 요구정의 단계에서 점검할 내용이라 종료 시점과 맞지 않습니다. 과업 이행 여부, 시험 결과, 운영 이관 준비는 종료 단계 감리의 대표적 점검 항목입니다.","kw":["audit","test_levels"]},{"s":"감리 및 사업관리","tp":"PMO와 감리","q":"PMO와 정보시스템 감리를 비교한 설명으로 가장 적절한 것은?","o":["① 감리를 실시하는 사업에는 PMO를 둘 수 없도록 법으로 금지되어 있다","② PMO는 사업 종료 후에만 투입되어 사후 성과평가만 수행한다","③ 감리는 발주기관을 대신해 사업자에 대한 검사·검수를 최종 확정하는 권한을 가진다","④ PMO는 발주기관을 지원하여 사업 기간 전반에 걸쳐 상시적으로 사업관리를 수행하고, 감리는 독립된 제3자가 주로 정해진 시점에 점검하는 성격이 강하다"],"a":3,"x":"PMO는 발주기관 편에서 진척, 위험, 품질, 변경 등을 사업 전 기간에 걸쳐 관리·지원하는 조직이고, 감리는 독립된 제3자가 단계별 시점에 종합 점검하는 활동입니다. 둘은 역할이 달라 한 사업에 함께 적용될 수 있으므로 법으로 금지된다는 설명은 틀립니다. PMO는 사후 평가만 하는 조직이 아니며, 검사·검수의 최종 확정은 발주기관의 권한입니다.","kw":["pmo","audit"]},{"s":"감리 및 사업관리","tp":"PMO 업무","q":"전자정부사업관리 위탁(PMO) 사업자가 수행하는 업무로 가장 거리가 먼 것은?","o":["① 개발사업자를 대신해 응용 프로그램을 직접 개발하여 납품하는 업무","② 사업 진척 및 일정 관리 지원","③ 위험·이슈의 식별과 대응 관리 지원","④ 사업자 산출물 검토 등 품질관리 지원"],"a":0,"x":"PMO는 발주기관을 대신·지원해 사업을 '관리'하는 역할이지, 시스템을 직접 '개발'하는 역할이 아닙니다. 관리 주체가 직접 개발까지 하면 스스로 만든 결과물을 스스로 관리하게 되어 견제가 사라집니다. 진척·일정 관리, 위험·이슈 관리, 산출물 검토를 통한 품질관리 지원은 PMO의 대표 업무입니다.","kw":["pmo","pm"]},{"s":"감리 및 사업관리","tp":"과업심의위원회","q":"공공 소프트웨어사업의 과업심의위원회에 대한 설명으로 옳은 것은?","o":["① 발주기관이 SW사업의 과업 내용을 확정하거나 과업을 변경할 때 그 적정성과 계약금액 조정 등을 심의한다","② 감리법인 선정을 위한 기술평가만을 전담한다","③ 기관의 연간 정보화 예산 총액을 편성·의결한다","④ SW기술자의 경력과 등급을 판정한다"],"a":0,"x":"과업심의위원회는 '과업이 무엇인지'와 '과업이 바뀌면 대가를 어떻게 조정할지'를 공식적으로 심의하는 장치입니다. 불명확한 과업과 대가 없는 과업 변경이 공공 SW사업의 고질적 문제였기 때문에 도입되었습니다. 감리법인 기술평가, 정보화 예산 편성, SW기술자 경력 판정은 이 위원회의 역할이 아닙니다.","kw":["sw_procurement"]},{"s":"감리 및 사업관리","tp":"분리발주","q":"공공 SW사업의 상용 소프트웨어 분리발주 제도에 대한 설명으로 옳은 것은?","o":["① 하드웨어 장비만 별도로 구매하도록 하는 제도이다","② 개발과 유지보수를 반드시 같은 사업자에게 맡기도록 하는 제도이다","③ 일정 요건을 갖춘 상용 SW를 시스템 구축 사업자를 통해 일괄 구매하지 않고 발주기관이 별도로 발주하여, 상용 SW가 제값을 받도록 하는 제도이다","④ 상용 SW를 원도급자가 하도급 형태로 공급하도록 의무화하는 제도이다"],"a":2,"x":"분리발주는 상용 SW를 통합 사업에 끼워 넣으면 SW 기업이 하도급 구조에서 제값을 받지 못하는 문제를 막기 위해, 발주기관이 상용 SW를 따로 발주하도록 하는 제도입니다. 대상은 하드웨어가 아니라 상용 소프트웨어입니다. 개발·유지보수 동일 사업자 의무화는 이 제도와 무관하고, 하도급 공급 의무화는 제도 취지와 정반대입니다.","kw":["sw_procurement"]},{"s":"감리 및 사업관리","tp":"SW사업 대가산정","q":"SW사업 대가산정 가이드의 개발비 산정에 관한 설명으로 옳지 않은 것은?","o":["① 개발비 산정 방식으로 기능점수 방식과 투입인력 방식이 제시되어 있다","② 요구사항이 구체화되지 않은 초기에는 간이법을, 상세 요구사항이 확정되면 정통법을 활용할 수 있다","③ SW 개발비는 투입인력(M/M) 방식으로만 산정하며 기능점수 방식은 공공 사업에 적용하지 않는다","④ 기능점수 기반 개발원가에는 규모, 연계복잡성, 성능, 운영환경 호환성, 보안성 등 보정계수가 반영된다"],"a":2,"x":"공공 SW사업 대가산정에서 기능점수 방식은 개발비 산정의 대표적인 방식으로, 투입인력 방식만 쓴다는 설명이 틀렸습니다. 기능점수는 사용자 관점의 기능 규모를 재기 때문에 사람 수와 기간에 의존하는 M/M 방식보다 객관적인 근거를 제공합니다. 간이법·정통법 구분과 규모·연계복잡성·성능·운영환경 호환성·보안성 보정은 가이드의 일반적 내용입니다.","kw":["sw_cost","function_point"]},{"s":"감리 및 사업관리","tp":"기능점수 유형 분류","q":"인사 시스템이 회계 시스템에서 생성·관리하는 '부서 코드' 데이터를 조회 목적으로만 참조한다. 인사 시스템의 기능점수 산정 관점에서 이 데이터의 유형은?","o":["① ILF(내부 논리 파일)","② EI(외부 입력)","③ EIF(외부 연계 파일)","④ EQ(외부 조회)"],"a":2,"x":"다른 애플리케이션이 유지·관리하고 측정 대상 애플리케이션은 참조만 하는 논리적 데이터 묶음은 EIF입니다. 인사 시스템이 부서 코드를 직접 등록·수정·삭제한다면 ILF가 되겠지만, 여기서는 회계 시스템이 관리하므로 그렇지 않습니다. EI와 EQ는 데이터 묶음이 아니라 입력·조회 같은 트랜잭션 기능을 분류하는 유형입니다.","kw":["function_point"]},{"s":"감리 및 사업관리","tp":"기능점수 계산","q":"어떤 시스템에서 ILF 2개, EIF 1개, EI 5개, EO 3개, EQ 2개가 식별되었다. 모든 기능의 복잡도를 '보통'으로 보고 IFPUG 보통 가중치(ILF 10, EIF 7, EI 4, EO 5, EQ 4)를 적용할 때, 미조정 기능점수(UFP)는?","o":["① 60","② 65","③ 70","④ 75"],"a":2,"x":"각 유형의 개수에 가중치를 곱해 더하면 됩니다. ILF 2×10=20, EIF 1×7=7, EI 5×4=20, EO 3×5=15, EQ 2×4=8이고 합계는 70입니다. 60이나 65는 일부 항목을 빠뜨리거나 EO·EQ 가중치를 바꿔 적용했을 때 나오는 값이고, 75는 가중치를 과대 적용한 값입니다.","kw":["function_point","sw_cost"]},{"s":"감리 및 사업관리","tp":"기능점수 개념","q":"기능점수(Function Point)에 대한 설명으로 옳지 않은 것은?","o":["① 사용자 관점에서 제공되는 기능의 규모를 측정한다","② 데이터 기능은 ILF·EIF, 트랜잭션 기능은 EI·EO·EQ로 구분한다","③ EQ는 파생 데이터의 계산 없이 데이터를 조회해 내보내는 기능이다","④ 코드 라인 수(LOC)를 기반으로 산정하므로 개발 언어가 바뀌면 같은 기능이라도 기능점수가 달라진다"],"a":3,"x":"기능점수는 코드 줄 수가 아니라 사용자가 받는 기능을 기준으로 재기 때문에, 개발 언어나 기술과 독립적이라는 것이 큰 장점입니다. 그래서 언어가 바뀌면 점수가 달라진다는 설명이 틀렸습니다. 사용자 관점 측정, 데이터 기능(ILF·EIF)과 트랜잭션 기능(EI·EO·EQ)의 구분, 계산 없는 단순 조회인 EQ의 정의는 모두 맞는 내용입니다.","kw":["function_point"]},{"s":"감리 및 사업관리","tp":"ISP","q":"ISP(정보화전략계획)에 대한 설명으로 가장 적절한 것은?","o":["① 특정 시스템의 화면·테이블을 정의한 상세 설계서를 작성하는 활동이다","② 운영 중 장애가 발생했을 때의 조치 절차를 정의하는 활동이다","③ 단위·통합 테스트 시나리오를 작성하는 활동이다","④ 조직의 경영 전략을 지원하도록 환경·현황을 분석하고 정보화 비전과 목표 모델, 이행 계획을 수립하는 활동이다"],"a":3,"x":"ISP는 경영 전략과 정보화를 연결하는 상위 계획으로, 환경·현황 분석을 거쳐 목표 모델을 그리고 이를 실현할 이행 계획(과제·우선순위·로드맵)을 세웁니다. 상세 설계서는 개발 사업의 설계 단계 산출물이고, 장애 조치 절차는 운영 관리 영역입니다. 테스트 시나리오 작성 역시 개발 사업의 시험 활동이지 전략 계획이 아닙니다.","kw":["isp"]},{"s":"감리 및 사업관리","tp":"ISMP","q":"ISMP(정보시스템 마스터플랜)에 대한 설명으로 옳은 것은?","o":["① 특정 SW 구축사업을 대상으로 업무·기술 요건을 상세화하여 제안요청서 작성과 사업 규모·예산 산정의 근거를 마련하는 데 중점을 둔다","② 전사 차원의 중장기 정보화 비전 수립이 주목적이며 개별 사업의 요구사항은 다루지 않는다","③ 시스템 구축이 끝난 뒤 운영 단계에서 투자 성과를 평가하는 활동이다","④ 결과물이 상세 설계서이므로 개발사업자는 별도 분석·설계 없이 바로 구현에 들어간다"],"a":0,"x":"ISMP는 ISP보다 범위가 좁고 깊어서, 특정 구축사업의 요구사항을 구체화해 제안요청서와 사업비 산정의 근거를 만드는 데 초점이 있습니다. 전사 비전 수립이 주목적이라는 설명은 ISP에 해당합니다. ISMP는 구축 '이전'에 수행하므로 운영 단계 성과평가가 아니며, 그 결과가 상세 설계를 대체하는 것도 아니어서 개발사업자의 분석·설계는 여전히 필요합니다.","kw":["ismp","isp"]},{"s":"감리 및 사업관리","tp":"WBS","q":"WBS(작업분류체계)에 대한 설명으로 옳지 않은 것은?","o":["① 프로젝트 전체 범위를 산출물 중심으로 계층적으로 분해한 것이다","② WBS의 최하위 요소는 활동(activity)이며, 작업패키지는 WBS에 포함되지 않는다","③ 하위 요소의 합이 상위 요소의 범위와 같아야 한다는 100% 규칙을 따른다","④ 각 요소의 정의, 담당, 완료 기준 등은 WBS 사전에 기술할 수 있다"],"a":1,"x":"WBS의 최하위 요소는 작업패키지이며, 활동은 작업패키지를 일정 관리 목적으로 더 쪼갠 것으로 일정 계획 단계에서 정의합니다. 따라서 활동이 WBS의 최하위 요소라는 설명이 틀렸습니다. 산출물 중심 계층 분해, 빠짐도 넘침도 없게 하는 100% 규칙, 요소별 상세를 담는 WBS 사전은 모두 맞는 내용입니다.","kw":["wbs"]},{"s":"감리 및 사업관리","tp":"CPM","q":"다음 활동 정보에서 프로젝트의 주공정(Critical Path) 길이와 활동 C의 총여유시간(Total Float)을 바르게 짝지은 것은? / A: 3일(선행 없음) / B: 4일(선행 A) / C: 2일(선행 A) / D: 5일(선행 B) / E: 6일(선행 C) / F: 2일(선행 D, E)","o":["① 14일, 1일","② 13일, 0일","③ 14일, 0일","④ 16일, 1일"],"a":0,"x":"경로는 A-B-D-F(3+4+5+2=14일)와 A-C-E-F(3+2+6+2=13일) 두 개이며, 가장 긴 A-B-D-F 14일이 주공정입니다. C가 속한 경로는 주공정보다 1일 짧으므로 C(및 E)는 프로젝트 완료일을 늦추지 않고 1일까지 지연될 수 있어 총여유시간이 1일입니다. 13일은 짧은 경로의 길이이고, C는 주공정 위에 있지 않으므로 여유가 0일이 아닙니다.","kw":["cpm_pert"]},{"s":"감리 및 사업관리","tp":"PERT","q":"어떤 활동의 낙관치 4일, 최빈치 7일, 비관치 16일일 때 PERT의 기대 소요시간과 표준편차는?","o":["① 기대 소요시간 7일, 표준편차 2일","② 기대 소요시간 8일, 표준편차 4일","③ 기대 소요시간 9일, 표준편차 12일","④ 기대 소요시간 8일, 표준편차 2일"],"a":3,"x":"PERT 기대 소요시간은 (낙관치 + 4×최빈치 + 비관치)/6 = (4+28+16)/6 = 8일입니다. 표준편차는 (비관치 − 낙관치)/6 = 12/6 = 2일입니다. 7일은 최빈치를 그대로 쓴 값이고, 4는 표준편차가 아니라 분산(2의 제곱)이며, 12는 6으로 나누지 않은 범위입니다.","kw":["cpm_pert"]},{"s":"감리 및 사업관리","tp":"EVM 해석","q":"총예산(BAC) 1,000백만원인 사업의 현 시점 계획가치(PV) 500, 획득가치(EV) 400, 실제원가(AC) 500(단위: 백만원)이다. 이에 대한 해석으로 옳지 않은 것은?","o":["① SPI는 0.8로 일정이 계획보다 지연되고 있다","② CPI는 0.8로 실적 대비 원가가 초과되고 있다","③ 완료 시점 원가차이(VAC)는 +250백만원으로 예산 내 완료가 예상된다","④ 현재 원가 효율이 유지된다면 완료시점 추정원가(EAC=BAC/CPI)는 1,250백만원이다"],"a":2,"x":"SPI=EV/PV=400/500=0.8, CPI=EV/AC=400/500=0.8로 둘 다 1보다 작아 일정 지연과 원가 초과 상태입니다. EAC=BAC/CPI=1,000/0.8=1,250이므로 VAC=BAC−EAC=1,000−1,250=−250백만원, 즉 250백만원 초과가 예상됩니다. 따라서 VAC가 +250이라 예산 내 완료된다는 해석이 틀렸습니다.","kw":["evm"]},{"s":"감리 및 사업관리","tp":"EVM 계산","q":"BAC 2,000, EV 800, AC 1,000(단위: 백만원)인 사업이 남은 작업을 원래 예산(BAC) 안에서 끝내려면 필요한 완료성과지수(TCPI)는?","o":["① 0.8","② 1.2","③ 1.0","④ 1.5"],"a":1,"x":"BAC 기준 TCPI는 남은 작업량을 남은 예산으로 나눈 값으로 (BAC−EV)/(BAC−AC) = (2,000−800)/(2,000−1,000) = 1,200/1,000 = 1.2입니다. 즉 남은 기간에는 1원으로 1.2원어치 일을 해내야 예산을 지킬 수 있다는 뜻입니다. 0.8은 현재 CPI(EV/AC)이고, 1.0은 계획대로 진행될 때의 기준값이며, 1.5는 공식을 잘못 적용한 값입니다.","kw":["evm"]},{"s":"감리 및 사업관리","tp":"일정 단축 기법","q":"일정 단축 기법 중 공정 중첩 단축(Fast Tracking)에 대한 설명으로 옳은 것은?","o":["① 주공정 활동에 자원을 추가 투입해 기간을 줄이며, 주로 비용이 증가한다","② 원래 순차적으로 수행하던 활동을 병행·중첩 수행하여 기간을 줄이며, 재작업 위험이 커질 수 있다","③ 과업 범위를 축소하여 남은 일정을 줄이는 기법이다","④ 여유시간을 활용해 자원 사용량의 기복을 평탄하게 만드는 기법이다"],"a":1,"x":"Fast Tracking은 예를 들어 설계가 다 끝나기 전에 일부 개발을 시작하는 식으로 순차 활동을 겹쳐 수행해 기간을 줄입니다. 선행 결과가 바뀌면 후행 작업을 다시 해야 하므로 재작업 위험이 커집니다. 자원을 추가 투입해 비용을 들여 줄이는 것은 Crashing이고, 범위 축소는 일정 단축 기법이라기보다 범위 변경이며, 자원 사용 평탄화는 자원 평준화입니다.","kw":["cpm_pert","pm"]},{"s":"감리 및 사업관리","tp":"위험 대응 전략","q":"프로젝트팀이 검증되지 않은 신규 프레임워크 적용에 따른 위험이 크다고 판단하여, 이미 검증된 기존 프레임워크로 설계를 변경하였다. 이에 해당하는 위험 대응 전략은?","o":["① 전가(Transfer)","② 완화(Mitigate)","③ 회피(Avoid)","④ 수용(Accept)"],"a":2,"x":"위험의 원인 자체를 계획 변경으로 제거해 위험이 발생할 여지를 없애는 것은 회피입니다. 전가는 보험이나 계약으로 위험의 영향과 책임을 제3자에게 넘기는 것이고, 완화는 발생 확률이나 영향을 줄이는 것(예: 신규 프레임워크를 쓰되 사전 PoC 수행)입니다. 수용은 별도 조치 없이 발생 시 대응하거나 예비비를 두는 방식이라 이 사례와 다릅니다.","kw":["risk_response","risk_mgmt"]},{"s":"감리 및 사업관리","tp":"위험 분석 기법","q":"위험관리 프로세스 중 정량적 위험 분석에 주로 활용되는 기법은?","o":["① 확률·영향 매트릭스","② 몬테카를로 시뮬레이션","③ 브레인스토밍","④ SWOT 분석"],"a":1,"x":"몬테카를로 시뮬레이션은 활동 기간·비용의 불확실성을 확률분포로 놓고 수천 번 반복 계산해 완료일·총비용의 분포를 숫자로 보여주는 대표적인 정량적 분석 기법입니다. 확률·영향 매트릭스는 위험을 높음·중간·낮음 등으로 등급화해 우선순위를 정하는 정성적 분석 도구입니다. 브레인스토밍과 SWOT 분석은 주로 위험을 찾아내는 위험 식별 단계에서 쓰입니다.","kw":["risk_mgmt"]},{"s":"감리 및 사업관리","tp":"EMV","q":"어떤 사업에 두 가지 불확실한 사건이 있다. 위협 X는 발생 확률 30%, 발생 시 손실 2억원이고, 기회 Y는 발생 확률 20%, 발생 시 이익 1억원이다. 두 사건의 기대금전가치(EMV) 합계는?","o":["① −0.6억원","② −0.4억원","③ +0.2억원","④ −0.8억원"],"a":1,"x":"EMV는 확률 × 영향(손실은 음수, 이익은 양수)으로 계산합니다. 위협 X는 0.3×(−2억)=−0.6억, 기회 Y는 0.2×(+1억)=+0.2억이므로 합계는 −0.4억원입니다. −0.6억은 기회를 빼먹은 값, +0.2억은 위협을 빼먹은 값, −0.8억은 기회를 손실로 잘못 더한 값입니다.","kw":["risk_mgmt"]},{"s":"감리 및 사업관리","tp":"긍정적 위험 대응","q":"긍정적 위험(기회)에 대한 대응 전략에 해당하지 않는 것은?","o":["① 전가(Transfer)","② 활용(Exploit)","③ 공유(Share)","④ 증대(Enhance)"],"a":0,"x":"전가는 위협(부정적 위험)의 영향을 보험·계약 등으로 제3자에게 넘기는 전략이라 기회 대응 전략이 아닙니다. 기회에 대해서는 반드시 실현되도록 하는 활용, 더 잘 살릴 수 있는 파트너와 나누는 공유, 발생 확률이나 효과를 키우는 증대를 씁니다. 수용은 위협과 기회 모두에 쓸 수 있는 공통 전략입니다.","kw":["risk_response"]},{"s":"감리 및 사업관리","tp":"품질보증과 품질통제","q":"품질보증(QA)과 품질통제(QC)에 대한 설명으로 옳은 것은?","o":["① 품질보증은 완성된 산출물의 결함을 찾는 활동이고, 품질통제는 프로세스 표준 준수 여부를 확인하는 활동이다","② 품질보증은 프로세스가 계획과 표준대로 수행되는지 확인하는 활동이고, 품질통제는 산출물을 검사·측정해 결함을 찾아 시정하는 활동이다","③ 품질통제는 품질 목표와 기준을 정하는 계획 활동만을 의미한다","④ 품질보증은 고객에게 납품이 끝난 뒤에만 수행한다"],"a":1,"x":"품질보증은 '일하는 방식(프로세스)'이 제대로 지켜지는지를 봐서 좋은 결과가 나올 것이라는 신뢰를 주는 활동이고, 품질통제는 '만들어진 결과물'을 검사해 결함을 잡아내는 활동입니다. 두 번째 보기는 둘의 정의를 뒤바꾼 것입니다. 품질 목표·기준 수립은 품질계획 활동이며, 품질보증은 사업 전 기간에 걸쳐 수행됩니다.","kw":["sw_quality","pm"]},{"s":"감리 및 사업관리","tp":"품질관리 도구","q":"결함 유형별 발생 건수를 많은 순서의 막대와 누적 비율 선으로 함께 표시하여, 소수의 핵심 원인에 개선 노력을 집중하도록 돕는 품질관리 도구는?","o":["① 파레토 차트","② 특성요인도(피시본 다이어그램)","③ 관리도","④ 산점도"],"a":0,"x":"파레토 차트는 '결함의 대부분은 소수 원인에서 나온다'는 원리에 따라 원인을 빈도순으로 정렬하고 누적 비율을 보여줘 우선순위를 정하게 합니다. 특성요인도는 하나의 문제에 대한 잠재 원인을 생선뼈 모양으로 분류하는 도구입니다. 관리도는 프로세스가 관리 한계 안에서 안정적인지 시간 흐름으로 보고, 산점도는 두 변수 간 상관관계를 봅니다.","kw":["sw_quality"]},{"s":"감리 및 사업관리","tp":"품질비용","q":"품질비용(COQ) 중 예방 비용에 해당하는 것은?","o":["① 인수시험 수행 비용","② 시험에서 발견된 결함의 재작업 비용","③ 운영 중 장애로 인한 고객 보상 비용","④ 개발자 대상 코딩 표준 및 보안 코딩 교육 비용"],"a":3,"x":"예방 비용은 결함이 아예 생기지 않도록 미리 쓰는 돈으로 교육, 표준 수립, 프로세스 개선 등이 해당합니다. 인수시험 같은 검사·시험 비용은 결함을 찾아내기 위한 평가 비용입니다. 출시 전 재작업은 내부 실패 비용, 운영 중 장애 보상은 외부 실패 비용으로 모두 적합하지 않은 품질 때문에 생기는 비용입니다.","kw":["coq","sw_quality"]},{"s":"감리 및 사업관리","tp":"형상관리","q":"소프트웨어 형상관리의 주요 활동에 해당하지 않는 것은?","o":["① 형상 식별","② 형상 통제","③ 자원 평준화","④ 형상 감사"],"a":2,"x":"형상관리는 관리 대상(형상항목)을 정하는 식별, 변경을 공식 절차로 처리하는 통제, 변경 이력과 현황을 기록·보고하는 상태 보고, 기준선과 실제가 일치하는지 확인하는 감사로 구성됩니다. 자원 평준화는 일정관리에서 자원 사용량의 기복을 평탄하게 조정하는 기법으로 형상관리 활동이 아닙니다. 형상 식별, 통제, 감사는 모두 형상관리의 핵심 활동입니다.","kw":["config_mgmt"]},{"s":"감리 및 사업관리","tp":"변경관리","q":"프로젝트 변경관리에 대한 설명으로 옳지 않은 것은?","o":["① 변경 요청은 공식 문서로 접수하고 일정·비용·품질 등에 미치는 영향을 분석한다","② 변경통제위원회(CCB) 등 권한 있는 주체가 변경의 승인·반려를 결정한다","③ 개발자가 긴급하다고 판단한 요구 변경은 영향 분석 없이 먼저 코드에 반영하고, 기준선은 사업 종료 시 일괄 갱신하는 것이 바람직하다","④ 승인된 변경은 범위·일정·원가 기준선과 관련 산출물에 반영하고 이해관계자에게 알린다"],"a":2,"x":"변경관리의 핵심은 모든 변경을 공식 절차(요청, 영향 분석, 승인, 반영, 통보)로 처리하는 것입니다. 개인 판단으로 먼저 반영하면 범위가 통제 없이 늘어나는 범위 확산(scope creep)이 생기고, 기준선을 나중에 몰아서 갱신하면 진척·원가 측정의 기준이 틀어집니다. 공식 요청과 영향 분석, CCB 승인, 승인 후 기준선 반영과 통보는 모두 올바른 절차입니다.","kw":["config_mgmt","pm"]},{"s":"감리 및 사업관리","tp":"의사소통 관리","q":"프로젝트 팀원이 8명에서 12명으로 늘어났을 때, 잠재적 의사소통 채널 수의 증가분은?","o":["① 38개","② 4개","③ 28개","④ 66개"],"a":0,"x":"의사소통 채널 수는 n(n−1)/2로 계산합니다. 8명일 때 8×7/2=28개, 12명일 때 12×11/2=66개이므로 증가분은 66−28=38개입니다. 28과 66은 각각 변경 전·후의 채널 수이고, 4는 인원 증가분일 뿐 채널 증가분이 아닙니다.","kw":["pm","pmbok"]},{"s":"감리 및 사업관리","tp":"IT 거버넌스","q":"ISO/IEC 38500에서 제시하는 IT 거버넌스를 위한 경영진(이사회)의 주요 과업 모델로 옳은 것은?","o":["① 계획(Plan) – 실행(Do) – 점검(Check) – 조치(Act)","② 식별 – 분석 – 대응 – 통제","③ 정의 – 측정 – 분석 – 개선 – 관리","④ 평가(Evaluate) – 지시(Direct) – 모니터링(Monitor)"],"a":3,"x":"ISO/IEC 38500은 경영진이 IT의 현재와 미래 활용을 평가하고, 계획과 정책의 수립·실행을 지시하며, 성과와 준수 여부를 모니터링하는 EDM 모델을 제시합니다. PDCA는 품질·경영시스템 개선 사이클이고, 식별-분석-대응-통제는 위험관리 흐름입니다. 정의-측정-분석-개선-관리는 6시그마의 DMAIC입니다.","kw":["it_governance"]},{"s":"감리 및 사업관리","tp":"ITIL","q":"ITIL의 인시던트 관리와 문제 관리에 대한 설명으로 옳은 것은?","o":["① 인시던트 관리는 근본 원인 분석이 끝나기 전에는 서비스 복구 조치를 하지 않는다","② 인시던트 관리는 서비스를 가능한 한 빨리 정상 상태로 복구하는 것이 목적이고, 문제 관리는 인시던트의 근본 원인을 찾아 재발을 방지하는 데 초점을 둔다","③ 문제 관리는 개별 장애가 발생할 때마다 사용자 문의를 접수·응대하는 서비스데스크 업무이다","④ 인시던트와 문제는 같은 개념이므로 하나의 프로세스로만 관리한다"],"a":1,"x":"인시던트 관리는 원인보다 '빨리 살리는 것'이 우선이라 임시 해결책(우회책)을 써서라도 서비스를 복구합니다. 문제 관리는 반복되거나 영향이 큰 인시던트의 근본 원인을 분석하고 알려진 오류를 관리해 재발을 막습니다. 원인 분석 전 복구 금지는 인시던트 관리의 목적과 반대이고, 문의 접수·응대는 서비스데스크 업무이며, 두 개념은 목적이 달라 구분해 관리합니다.","kw":["itil"]},{"s":"감리 및 사업관리","tp":"SLA","q":"IT 서비스 제공 조직 내부에서 서비스데스크 팀과 DB 운영 팀이 장애 처리 지원 수준(응답·처리 시간 등)을 서로 합의해 문서화한 것은?","o":["① SLA(서비스 수준 협약)","② OLA(운영 수준 협약)","③ UC(지원 계약)","④ KPI(핵심 성과 지표)"],"a":1,"x":"OLA는 서비스 제공 조직 '내부' 부서 간에 지원 수준을 합의한 것으로, 고객과 맺은 SLA를 지키기 위한 뒷받침 역할을 합니다. SLA는 서비스 제공자와 고객 사이의 합의이고, UC는 외부 공급업체와 맺는 지원 계약입니다. KPI는 성과를 측정하는 지표일 뿐 부서 간 합의 문서가 아닙니다.","kw":["sla","itil"]},{"s":"감리 및 사업관리","tp":"운영 감리","q":"운영 중인 정보시스템에 대한 운영 감리의 점검 내용으로 가장 거리가 먼 것은?","o":["① 신규 구축 시스템의 요구사항 정의서와 제안요청서 간 추적성 확보 여부","② SLA에 따른 서비스 수준 측정·보고 체계의 적정성","③ 장애·변경·구성 관리 절차의 수립과 실제 운영 실태","④ 백업·복구 및 보안 통제의 이행 여부"],"a":0,"x":"운영 감리는 이미 가동 중인 시스템이 안정적이고 효율적으로 운영되는지를 보므로 서비스 수준, 장애·변경·구성 관리, 백업·복구, 보안 통제 등이 주요 점검 대상입니다. 요구사항 정의서와 제안요청서 간 추적성은 구축 사업의 요구정의 단계 감리에서 확인할 내용입니다. 나머지 보기는 운영 감리에서 대표적으로 다루는 운영 관리 영역입니다.","kw":["audit","sla","itil"]},{"s":"소프트웨어 공학","tp":"폭포수 모델","q":"폭포수(Waterfall) 모델에 대한 설명으로 옳지 않은 것은?","o":["① 각 단계의 산출물을 검토·승인한 뒤 다음 단계로 진행하는 순차적 모델이다.","② 요구사항 변경을 개발 후반부에도 적은 비용으로 쉽게 수용할 수 있다.","③ 단계별 산출물이 명확하여 진척 관리와 문서화가 용이하다.","④ 실제 동작하는 소프트웨어를 개발 후반부에야 확인할 수 있다."],"a":1,"x":"폭포수 모델은 앞 단계를 끝내고 다음 단계로 넘어가는 선형·순차 모델이므로, 후반부에 요구사항이 바뀌면 이미 끝낸 분석·설계 단계로 되돌아가야 해 비용이 크게 늘어난다. 따라서 ②가 틀린 설명이다. ①③은 폭포수의 대표 장점(단계 통제, 명확한 산출물)이고, ④는 작동하는 결과물을 늦게 보게 되는 대표 단점이다.","kw":["waterfall","sdlc"]},{"s":"소프트웨어 공학","tp":"나선형 모델","q":"Boehm의 나선형(Spiral) 모델에 대한 설명으로 옳은 것은?","o":["① 계획-분석-설계-구현을 한 번만 순차적으로 진행하는 모델이다.","② 위험 분석 단계를 생략하여 소규모 단기 프로젝트에 최적화된 모델이다.","③ 프로토타입을 사용하지 않고 완성된 문서만으로 고객 평가를 수행한다.","④ 반복(나선)마다 위험 분석을 수행하여 위험을 조기에 식별·감소시키며, 대규모·고위험 시스템에 적합하다."],"a":3,"x":"나선형 모델은 계획 수립, 위험 분석, 개발(공학), 고객 평가를 나선처럼 반복하며, 매 반복마다 위험 분석을 수행하는 것이 핵심이다. 그래서 대규모·고위험 프로젝트에 적합하다. ①은 폭포수 모델에 가까운 설명이고, ②는 위험 분석이 핵심이라는 점과 정반대이며, ③과 달리 나선형 모델은 위험을 줄이기 위해 프로토타입을 적극 활용한다.","kw":["spiral","sdlc"]},{"s":"소프트웨어 공학","tp":"RUP 단계","q":"RUP(Rational Unified Process)의 4개 단계 중 '아키텍처 기준선을 수립하고 주요 기술적 위험을 제거하며, 대부분의 유스케이스를 구체화하는 단계'는?","o":["① 정련(Elaboration)","② 도입(Inception)","③ 구축(Construction)","④ 전이(Transition)"],"a":0,"x":"RUP는 도입-정련-구축-전이 4단계로 구성되며, 정련 단계에서 요구사항을 상세화하고 실행 가능한 아키텍처 기준선을 확립해 주요 위험을 제거한다. 도입 단계는 사업 타당성과 범위를 정의하고, 구축 단계는 나머지 기능을 반복적으로 구현하며, 전이 단계는 사용자 환경으로 배포·인도하는 단계다. 따라서 정답은 ①이다.","kw":["spiral","sdlc"]},{"s":"소프트웨어 공학","tp":"스크럼","q":"스크럼(Scrum)에 대한 설명으로 옳지 않은 것은?","o":["① 스프린트는 한 달 이하의 고정된 기간(타임박스)으로 반복 수행된다.","② 데일리 스크럼은 15분 정도의 짧은 회의로 스프린트 목표 대비 진척과 계획을 점검한다.","③ 스크럼 마스터가 제품 백로그의 우선순위를 결정하고 개발자에게 작업을 지시한다.","④ 스프린트 회고는 팀의 일하는 방식과 프로세스를 개선하기 위한 회의다."],"a":2,"x":"제품 백로그의 우선순위를 결정하고 가치를 책임지는 사람은 제품 책임자(Product Owner)다. 스크럼 마스터는 지시하는 관리자가 아니라 스크럼이 잘 운영되도록 돕고 장애물을 제거하는 서번트 리더이며, 팀은 자기조직적으로 작업을 나눈다. ①②④는 스크럼 가이드의 스프린트, 데일리 스크럼, 회고에 대한 올바른 설명이다.","kw":["scrum","agile"]},{"s":"소프트웨어 공학","tp":"XP 실천사항","q":"XP(eXtreme Programming)의 실천사항(Practice)에 해당하지 않는 것은?","o":["① 짝 프로그래밍(Pair Programming)","② 테스트 주도 개발(Test-Driven Development)","③ 지속적 통합(Continuous Integration)","④ 구현 착수 전 전체 시스템의 상세 설계를 완료하고 변경을 동결"],"a":3,"x":"XP는 짧은 반복, 단순한 설계, 리팩토링을 통해 변화를 적극 수용하는 애자일 방법론이므로, 사전에 상세 설계를 모두 끝내고 변경을 동결하는 방식(Big Design Up Front)은 XP의 철학과 맞지 않는다. 짝 프로그래밍, 테스트 주도 개발, 지속적 통합은 모두 XP의 대표 실천사항이다. 이 밖에 소규모 릴리스, 공동 코드 소유, 코딩 표준 등도 XP 실천사항이다.","kw":["xp","agile"]},{"s":"소프트웨어 공학","tp":"애자일 선언문","q":"애자일 소프트웨어 개발 선언(Agile Manifesto)의 가치를 'A보다 B를 더 가치 있게 여긴다' 형식으로 나타낸 것 중 옳지 않은 것은?","o":["① 프로세스와 도구보다 개인과 상호작용","② 고객과의 협력보다 계약 협상","③ 포괄적인 문서보다 작동하는 소프트웨어","④ 계획을 따르기보다 변화에 대응하기"],"a":1,"x":"애자일 선언문은 '계약 협상보다 고객과의 협력'을 더 가치 있게 여긴다고 명시하므로 ②는 순서가 뒤바뀐 잘못된 표현이다. 나머지 ①③④는 선언문의 4대 가치 그대로다. 단, 선언문은 오른쪽 항목(프로세스, 문서, 계약, 계획)도 가치가 있지만 왼쪽 항목을 더 중시한다는 의미임을 기억해 두자.","kw":["agile"]},{"s":"소프트웨어 공학","tp":"요구사항 추적성","q":"요구사항 추적성(Traceability)에 대한 설명으로 옳은 것은?","o":["① 요구사항 추적 매트릭스(RTM)는 요구사항과 설계·코드·테스트 케이스 간의 연관을 양방향으로 추적하여 누락된 구현과 불필요한 기능을 식별하고 변경 영향 분석을 지원한다.","② 추적성은 요구사항에서 테스트 케이스 방향의 순방향 추적만을 의미한다.","③ 요구사항이 확정된 이후에는 추적성 관리가 더 이상 필요하지 않다.","④ 추적 매트릭스는 테스트 단계에서만 작성하며 설계 산출물과는 연결하지 않는다."],"a":0,"x":"추적성은 요구사항이 설계·구현·테스트로 어떻게 반영되었는지(순방향), 그리고 각 산출물이 어떤 요구사항에서 나왔는지(역방향)를 모두 추적하는 것이다. 이를 통해 구현 누락이나 근거 없는 기능(Gold Plating)을 찾고, 변경 시 영향 범위를 분석할 수 있다. ②는 역방향 추적을 빠뜨렸고, ③은 변경 관리가 프로젝트 내내 필요하다는 점을 무시했으며, ④는 설계와의 연결을 배제해 추적성의 목적에 어긋난다.","kw":["requirements","srs"]},{"s":"소프트웨어 공학","tp":"기능·비기능 요구사항","q":"온라인 쇼핑몰 구축 사업의 요구사항 중 기능 요구사항에 해당하는 것은?","o":["① 상품 검색 결과는 동시 사용자 1,000명 환경에서 2초 이내에 응답해야 한다.","② 시스템은 연간 99.9% 이상의 가용성을 보장해야 한다.","③ 회원은 자신의 주문 내역을 기간별로 조회할 수 있어야 한다.","④ 모든 화면은 웹 접근성 지침을 준수해야 한다."],"a":2,"x":"기능 요구사항은 시스템이 '무엇을 하는가', 즉 사용자에게 제공하는 기능과 동작을 정의한다. 주문 내역 기간별 조회는 시스템이 수행할 구체적 기능이므로 기능 요구사항이다. ①은 성능, ②는 가용성(신뢰성), ④는 사용성·접근성에 관한 것으로 시스템이 '얼마나 잘' 동작해야 하는지를 정하는 비기능 요구사항이다.","kw":["requirements","srs"]},{"s":"소프트웨어 공학","tp":"요구사항 검증(검토 기법)","q":"다음 설명에 해당하는 검토 기법은? / ㄱ. 훈련된 모더레이터가 주관한다. / ㄴ. 참석자는 사전에 산출물을 검토하고 체크리스트를 활용한다. / ㄷ. 발견된 결함을 공식적으로 기록하고, 수정 여부를 후속 조치(Follow-up)로 확인한다.","o":["① 워크스루(Walkthrough)","② 인스펙션(Inspection)","③ 데스크 체크(Desk Check)","④ 프로토타이핑(Prototyping)"],"a":1,"x":"인스펙션은 모더레이터, 기록자 등 역할이 정해진 가장 공식적인 검토 기법으로, 계획-사전준비-회의-재작업-후속조치 절차와 체크리스트, 결함 기록을 특징으로 한다. 워크스루는 보통 작성자가 주도하며 비교적 비공식적으로 산출물을 설명하고 의견을 받는 방식이다. 데스크 체크는 작성자 혼자 수행하는 점검이고, 프로토타이핑은 시제품으로 요구사항을 확인하는 기법이라 공식 검토 절차가 아니다.","kw":["static_analysis","requirements"]},{"s":"소프트웨어 공학","tp":"유스케이스 관계","q":"UML 유스케이스 다이어그램의 관계에 대한 설명으로 옳은 것은?","o":["① 포함(include) 관계의 포함 유스케이스는 기본 유스케이스 실행 시 조건에 따라 선택적으로 수행된다.","② 확장(extend) 관계의 화살표는 기본 유스케이스에서 확장 유스케이스 방향으로 그린다.","③ 일반화(generalization) 관계는 유스케이스 사이에만 사용할 수 있고 액터 사이에는 사용할 수 없다.","④ 확장(extend) 관계는 특정 조건을 만족할 때에만 확장 유스케이스의 동작이 기본 유스케이스에 추가된다."],"a":3,"x":"extend는 특정 조건(확장점)을 만족할 때만 추가 동작이 끼어드는 선택적 관계이므로 ④가 옳다. ①은 반대로, include는 기본 유스케이스가 실행될 때마다 반드시 포함 유스케이스를 수행한다. ②의 extend 화살표는 확장 유스케이스에서 기본 유스케이스 쪽을 향하며, ③과 달리 일반화는 액터 사이(예: 일반회원-VIP회원)에도 사용할 수 있다.","kw":["use_case","uml"]},{"s":"소프트웨어 공학","tp":"UML 다이어그램 분류","q":"UML 2.x 다이어그램 중 구조(Structure) 다이어그램으로만 묶인 것은?","o":["① 클래스 다이어그램, 시퀀스 다이어그램, 배치 다이어그램","② 유스케이스 다이어그램, 컴포넌트 다이어그램, 객체 다이어그램","③ 클래스 다이어그램, 컴포넌트 다이어그램, 배치 다이어그램","④ 패키지 다이어그램, 상태 머신 다이어그램, 활동 다이어그램"],"a":2,"x":"구조 다이어그램은 시스템의 정적 구성을 표현하며 클래스, 객체, 컴포넌트, 배치, 패키지, 복합 구조 다이어그램 등이 해당한다. 행위 다이어그램은 동적인 동작을 표현하며 유스케이스, 활동, 상태 머신, 시퀀스, 커뮤니케이션, 타이밍 다이어그램 등이 해당한다. ①의 시퀀스, ②의 유스케이스, ④의 상태 머신·활동은 행위 다이어그램이므로 정답은 ③이다.","kw":["uml"]},{"s":"소프트웨어 공학","tp":"클래스 간 관계","q":"클래스 다이어그램에서 '주문(Order)'과 '주문항목(OrderLine)'의 관계가 다음과 같을 때 가장 적합한 관계는? / ㄱ. 주문항목은 반드시 하나의 주문에만 속한다. / ㄴ. 주문 객체가 삭제되면 해당 주문항목도 함께 소멸한다. / ㄷ. 전체 쪽 끝에 채워진(검은) 마름모로 표기한다.","o":["① 합성(Composition)","② 집합(Aggregation)","③ 의존(Dependency)","④ 실체화(Realization)"],"a":0,"x":"합성은 부분의 생명주기가 전체에 종속되는 강한 전체-부분 관계로, 전체가 소멸하면 부분도 함께 소멸하며 채워진 마름모로 표기한다. 집합은 부분이 전체와 독립적으로 존재할 수 있는 약한 전체-부분 관계로 빈 마름모로 표기한다. 의존은 일시적으로 사용하는 관계(점선 화살표), 실체화는 인터페이스를 구현하는 관계(점선+빈 삼각형)이다.","kw":["uml","oop"]},{"s":"소프트웨어 공학","tp":"결합도","q":"모듈 결합도(Coupling)를 약한 것부터 강한 것 순으로 올바르게 나열한 것은?","o":["① 자료 → 제어 → 스탬프 → 공통 → 외부 → 내용","② 스탬프 → 자료 → 제어 → 외부 → 공통 → 내용","③ 자료 → 스탬프 → 제어 → 공통 → 외부 → 내용","④ 자료 → 스탬프 → 제어 → 외부 → 공통 → 내용"],"a":3,"x":"결합도는 자료(단순 값 전달) < 스탬프(자료구조 전달) < 제어(제어 플래그 전달) < 외부(외부 선언 데이터·포맷 공유) < 공통(전역 데이터 공유) < 내용(다른 모듈 내부 직접 참조) 순으로 강해진다. ①은 제어와 스탬프의 순서가, ②는 자료와 스탬프의 순서가, ③은 외부와 공통의 순서가 뒤바뀌었다. 좋은 설계는 결합도를 가능한 한 약하게 유지하는 것이다.","kw":["coupling","modularity"]},{"s":"소프트웨어 공학","tp":"응집도","q":"어떤 모듈이 '입력 파일을 읽어 레코드를 정제하고, 정제된 결과로 통계를 계산하며, 계산된 통계로 보고서를 생성'하는 작업을 수행한다. 각 활동의 출력이 다음 활동의 입력으로 사용될 때 이 모듈의 응집도로 가장 적절한 것은?","o":["① 기능적 응집도(Functional Cohesion)","② 순차적 응집도(Sequential Cohesion)","③ 교환적(통신적) 응집도(Communicational Cohesion)","④ 절차적 응집도(Procedural Cohesion)"],"a":1,"x":"한 활동의 출력 데이터가 다음 활동의 입력이 되는 구조는 순차적 응집도의 정의에 해당한다. 기능적 응집도는 모듈 내 모든 요소가 단 하나의 기능을 위해 존재하는 경우이고, 교환적 응집도는 동일한 입력이나 출력 데이터를 사용하는 활동들이 모인 경우다. 절차적 응집도는 정해진 순서로 수행되지만 활동 간 데이터 전달 관계가 없는 경우라 이 사례와 다르다.","kw":["cohesion","modularity"]},{"s":"소프트웨어 공학","tp":"SOLID 원칙(ISP)","q":"복합기용 인터페이스 IMachine에 print(), scan(), fax() 메서드가 정의되어 있다. 출력 기능만 있는 SimplePrinter 클래스가 IMachine을 구현하면서 scan()과 fax()를 아무 동작도 하지 않는 빈 메서드로 억지로 구현해야 하는 상황이다. 이 설계가 가장 직접적으로 위반한 원칙은?","o":["① 인터페이스 분리 원칙(ISP)","② 리스코프 치환 원칙(LSP)","③ 단일 책임 원칙(SRP)","④ 개방-폐쇄 원칙(OCP)"],"a":0,"x":"ISP는 클라이언트가 자신이 사용하지 않는 메서드에 의존하도록 강요받아서는 안 된다는 원칙으로, 비대한 인터페이스를 IPrinter, IScanner, IFax처럼 역할별로 분리하라고 요구한다. 사례는 쓰지 않는 scan(), fax()를 억지로 구현하는 전형적인 ISP 위반이다. LSP는 하위 타입이 상위 타입을 대체해도 정상 동작해야 한다는 원칙, SRP는 클래스가 하나의 변경 이유만 가져야 한다는 원칙, OCP는 확장에는 열리고 변경에는 닫혀야 한다는 원칙이다.","kw":["solid","oop"]},{"s":"소프트웨어 공학","tp":"SOLID 원칙(DIP)","q":"OrderService 클래스가 내부에서 new MySqlOrderRepository()로 구체 클래스를 직접 생성해 사용하고 있다. 이를 OrderRepository 인터페이스에 의존하도록 바꾸고 구현체는 외부에서 주입받도록 개선했다. 이 개선이 주로 따르는 원칙은?","o":["① 단일 책임 원칙(SRP)","② 리스코프 치환 원칙(LSP)","③ 의존 역전 원칙(DIP)","④ 인터페이스 분리 원칙(ISP)"],"a":2,"x":"DIP는 고수준 모듈(OrderService)이 저수준 모듈(MySQL 구현)에 직접 의존하지 말고 둘 다 추상화(인터페이스)에 의존해야 한다는 원칙이다. 인터페이스에 의존하고 구현체를 의존성 주입(DI)으로 받으면 DB를 바꾸거나 테스트용 가짜 구현으로 교체하기 쉬워진다. SRP, LSP, ISP도 중요한 원칙이지만, 구체 클래스 대신 추상화에 의존하도록 의존 방향을 바꾼 이 사례의 핵심은 DIP다.","kw":["solid","coupling"]},{"s":"소프트웨어 공학","tp":"캡슐화와 정보은닉","q":"캡슐화와 정보은닉에 대한 설명으로 옳지 않은 것은?","o":["① 캡슐화는 데이터와 그 데이터를 처리하는 연산을 하나의 단위(클래스)로 묶는 것이다.","② 정보은닉은 Parnas가 제안한 개념으로, 변경될 가능성이 높은 설계 결정을 모듈 내부에 숨기는 것이다.","③ private 등 접근 제어자는 정보은닉을 구현하는 대표적인 수단이다.","④ 정보은닉을 적용하면 모듈 간 결합도가 높아져 변경 시 파급 효과가 커진다."],"a":3,"x":"정보은닉은 모듈 내부 구현을 숨기고 공개된 인터페이스로만 상호작용하게 하므로, 내부가 바뀌어도 다른 모듈에 영향이 적어 결합도를 낮추고 변경 파급 효과를 줄인다. 따라서 ④는 반대로 설명한 것이다. ①은 캡슐화의 정의, ②는 Parnas의 정보은닉 개념, ③은 객체지향 언어에서 정보은닉을 구현하는 방법으로 모두 옳다.","kw":["encapsulation","info_hiding"]},{"s":"소프트웨어 공학","tp":"GoF 디자인 패턴 분류","q":"GoF 디자인 패턴 중 구조(Structural) 패턴으로만 묶인 것은?","o":["① Adapter, Singleton, Observer","② Adapter, Composite, Decorator","③ Builder, Proxy, Facade","④ Bridge, Iterator, Flyweight"],"a":1,"x":"GoF 구조 패턴은 Adapter, Bridge, Composite, Decorator, Facade, Flyweight, Proxy의 7개로, 클래스나 객체를 조합해 더 큰 구조를 만드는 패턴이다. ①의 Singleton은 생성 패턴, Observer는 행위 패턴이다. ③의 Builder는 생성 패턴이고, ④의 Iterator는 행위 패턴이므로 정답은 ②이다.","kw":["design_pattern"]},{"s":"소프트웨어 공학","tp":"디자인 패턴(Strategy)","q":"쇼핑몰의 할인 정책(정률 할인, 정액 할인, 회원등급 할인)을 각각 별도 클래스로 캡슐화하고 공통 인터페이스를 두어, 주문 객체가 실행 시점에 할인 정책 객체를 교체하여 사용할 수 있도록 설계하려 한다. 상속이 아닌 위임(구성)을 통해 알고리즘을 교체하는 이 설계에 가장 적합한 패턴은?","o":["① Strategy","② Template Method","③ Singleton","④ Visitor"],"a":0,"x":"Strategy 패턴은 동일한 목적의 알고리즘군을 각각 캡슐화하고 인터페이스로 추상화하여, 클라이언트가 실행 시점에 알고리즘을 바꿔 끼울 수 있게 한다. Template Method는 상위 클래스가 알고리즘 골격을 정하고 하위 클래스가 일부 단계를 재정의하는 상속 기반 패턴이라 실행 중 교체에 적합하지 않다. Singleton은 인스턴스를 하나로 제한하는 생성 패턴이고, Visitor는 객체 구조를 바꾸지 않고 새로운 연산을 추가하는 패턴이다.","kw":["design_pattern","oop"]},{"s":"소프트웨어 공학","tp":"아키텍처 평가(ATAM)","q":"ATAM(Architecture Tradeoff Analysis Method)으로 아키텍처를 평가하던 중 '데이터 암호화 수준을 높이면 보안성은 향상되지만 응답 성능이 저하된다'는 사실을 확인했다. 이처럼 하나의 아키텍처 결정이 둘 이상의 품질 속성에 상반된 영향을 주는 지점을 무엇이라 하는가?","o":["① 민감점(Sensitivity Point)","② 위험(Risk)","③ 절충점(Tradeoff Point)","④ 비위험(Non-risk)"],"a":2,"x":"절충점은 하나의 아키텍처 결정이 여러 품질 속성에 영향을 주어, 한 속성을 좋게 하면 다른 속성이 나빠지는 지점이다. 민감점은 특정 아키텍처 결정이 하나의 품질 속성에 민감하게 영향을 주는 지점이며, 절충점은 여러 속성에 걸친 민감점이라고 볼 수 있다. 위험은 품질 목표 달성을 어렵게 할 수 있는 문제 소지가 있는 결정이고, 비위험은 안전하다고 판단된 결정이다.","kw":["arch_evaluation","sw_quality"]},{"s":"소프트웨어 공학","tp":"동등분할 테스트","q":"정수 점수(score)를 입력받아 0~59는 '불합격', 60~89는 '합격', 90~100은 '우수'를 출력하고, 0 미만 또는 100 초과는 오류를 출력하는 프로그램이 있다. 동등분할(Equivalence Partitioning) 기법으로 유효·무효 동등 클래스마다 대표값을 하나씩 선택할 때 필요한 최소 테스트 케이스 수는?","o":["① 2개","② 3개","③ 4개","④ 5개"],"a":3,"x":"유효 동등 클래스는 0~59, 60~89, 90~100의 3개이고, 무효 동등 클래스는 0 미만과 100 초과의 2개다. 각 클래스에서 대표값을 하나씩 고르므로 3 + 2 = 5개의 테스트 케이스가 필요하다. 유효 클래스만 세면 3개가 되지만, 동등분할은 잘못된 입력을 처리하는지도 확인하기 위해 무효 클래스를 반드시 포함해야 한다.","kw":["blackbox","testing"]},{"s":"소프트웨어 공학","tp":"경계값 분석","q":"입력값의 유효 범위가 1 이상 100 이하인 정수 필드가 있다. 각 경계(최소·최대)에 대해 '경계값, 경계 바로 아래 값, 경계 바로 위 값'을 모두 시험하는 3값 경계값 분석을 적용할 때 필요한 서로 다른 테스트 입력값의 개수는?","o":["① 4개","② 6개","③ 8개","④ 9개"],"a":1,"x":"하한 경계 1에 대해 0, 1, 2를, 상한 경계 100에 대해 99, 100, 101을 시험하므로 총 6개다. 경계값과 바로 바깥 값만 쓰는 2값 경계값 분석이라면 0, 1, 100, 101의 4개가 되므로 ①은 다른 방식의 답이다. 경계값 분석은 결함이 입력 범위의 경계 부근에 몰리는 경향을 이용하는 블랙박스 기법으로, 보통 동등분할과 함께 쓴다.","kw":["blackbox","testing"]},{"s":"소프트웨어 공학","tp":"결정 테이블 테스트","q":"보험료 산정 로직의 조건이 다음과 같다. 모든 조건 조합을 결정 테이블(Decision Table)의 규칙으로 표현할 때 축약 전 최대 규칙(열) 수는? / ㄱ. 흡연 여부(예/아니오) / ㄴ. 기존 질환 여부(예/아니오) / ㄷ. 연령대(30세 미만 / 30~59세 / 60세 이상)","o":["① 7개","② 8개","③ 12개","④ 16개"],"a":2,"x":"결정 테이블의 최대 규칙 수는 각 조건이 가질 수 있는 값의 개수를 곱한 값이다. 흡연 2가지 × 질환 2가지 × 연령대 3가지 = 12개가 된다. 모든 조건을 2값으로 오해하면 2의 3제곱인 8개(②)로 잘못 계산하게 된다. 실제 테스트에서는 결과가 같은 규칙을 무관 조건(-)으로 합쳐 규칙 수를 줄일 수 있다.","kw":["blackbox","testing"]},{"s":"소프트웨어 공학","tp":"상태전이 테스트","q":"상태전이(State Transition) 테스트에 대한 설명으로 옳은 것은?","o":["① 0-스위치 커버리지는 상태전이도의 모든 유효한 개별 전이를 최소 한 번씩 수행하는 것을 목표로 한다.","② 1-스위치 커버리지는 모든 상태를 한 번씩 방문하기만 하면 달성된다.","③ 상태전이 테스트는 소스 코드의 분기 구조를 기반으로 하는 화이트박스 기법이다.","④ 정의되지 않은 무효 전이는 발생할 수 없으므로 테스트 대상에서 제외한다."],"a":0,"x":"0-스위치(전이) 커버리지는 각 유효 전이를 최소 1회 수행하는 것이고, 1-스위치 커버리지는 연속된 2개 전이의 모든 쌍을 수행하는 것이므로 ②는 틀리다. 상태전이 테스트는 명세의 상태 모델을 기반으로 하는 블랙박스 기법이라 ③도 틀리다. 무효 전이가 실제로 거부되는지 확인하는 것도 중요하므로 ④도 잘못된 설명이다.","kw":["blackbox","testing"]},{"s":"소프트웨어 공학","tp":"순환복잡도","q":"어떤 모듈의 제어 흐름 그래프가 하나로 연결되어 있고 노드(Node) 11개, 간선(Edge) 14개로 구성되어 있다. 이 모듈의 McCabe 순환복잡도(Cyclomatic Complexity)는?","o":["① 4","② 5","③ 6","④ 7"],"a":1,"x":"순환복잡도는 V(G) = E - N + 2P로 계산하며, 연결 요소가 하나(P=1)이면 E - N + 2이다. 따라서 14 - 11 + 2 = 5가 된다. 순환복잡도는 '단순 결정 노드 수 + 1' 또는 '평면 그래프의 닫힌 영역 수 + 1'로도 구할 수 있으며, 기본 경로 테스트에서 필요한 독립 경로의 수를 의미한다. 값이 클수록 테스트와 유지보수가 어려워진다.","kw":["whitebox","coverage"]},{"s":"소프트웨어 공학","tp":"코드 커버리지 포함관계","q":"코드 커버리지에 대한 설명으로 옳지 않은 것은?","o":["① 결정(분기) 커버리지를 100% 만족하면 구문 커버리지도 100% 만족한다.","② MC/DC는 결정 내 각 개별 조건이 다른 조건과 독립적으로 결정 결과에 영향을 미침을 보여야 한다.","③ 다중 조건 커버리지는 결정 내 조건이 n개일 때 최대 2의 n제곱개의 조건 조합을 모두 시험한다.","④ 조건 커버리지를 100% 만족하면 결정 커버리지도 항상 100% 만족한다."],"a":3,"x":"조건 커버리지는 각 개별 조건이 참과 거짓을 한 번씩 갖도록 하지만, 그 조합에 따라 전체 결정 결과는 한쪽으로만 나올 수 있다. 예를 들어 (A && B)에서 (A=참, B=거짓), (A=거짓, B=참)으로 조건 커버리지를 100% 달성해도 결정 결과는 모두 거짓이라 결정 커버리지를 만족하지 못한다. 그래서 둘을 함께 만족하는 조건/결정 커버리지와 MC/DC가 쓰인다. ①②③은 모두 옳은 설명이다.","kw":["coverage","whitebox","mcdc"]},{"s":"소프트웨어 공학","tp":"MC/DC","q":"결정문 if (A && B && C)에 대해 MC/DC(수정 조건/결정 커버리지)를 만족시키기 위한 최소 테스트 케이스 수는? (A, B, C는 서로 독립적인 단순 조건이다)","o":["① 4개","② 5개","③ 6개","④ 8개"],"a":0,"x":"(T,T,T)는 결과가 참이고, 여기서 A, B, C를 하나씩만 거짓으로 바꾼 (F,T,T), (T,F,T), (T,T,F)는 결과가 거짓이 된다. 이 4개 케이스로 각 조건이 단독으로 결정 결과를 바꾼다는 것을 모두 보일 수 있다. 일반적으로 조건이 n개면 MC/DC는 최소 n+1개 케이스로 달성할 수 있다. ④의 8개는 모든 조합을 시험하는 다중 조건 커버리지의 개수다.","kw":["mcdc","coverage"]},{"s":"소프트웨어 공학","tp":"통합 테스트(스텁·드라이버)","q":"통합 테스트 전략에 대한 설명으로 옳은 것은?","o":["① 상향식 통합은 아직 개발되지 않은 상위 모듈을 대신하기 위해 스텁(Stub)이 필요하다.","② 드라이버(Driver)는 호출되는 하위 모듈의 동작을 흉내 내는 임시 모듈이다.","③ 하향식 통합은 아직 개발되지 않은 하위 모듈을 대신하기 위해 스텁(Stub)을 사용한다.","④ 빅뱅 통합은 모든 모듈을 한 번에 결합하므로 결함 위치를 파악하기가 가장 쉽다."],"a":2,"x":"하향식 통합은 상위 모듈부터 시험하므로 아직 없는 하위 모듈 자리에 단순한 응답만 돌려주는 스텁을 둔다. 반대로 상향식 통합은 하위 모듈부터 시험하므로 이를 호출해 줄 상위 역할의 드라이버가 필요하다. 따라서 ①과 ②는 스텁과 드라이버의 역할을 뒤바꾼 설명이다. 빅뱅 통합은 한꺼번에 합치기 때문에 결함이 어느 인터페이스에서 생겼는지 찾기가 가장 어렵다.","kw":["integration_test","test_levels"]},{"s":"소프트웨어 공학","tp":"뮤테이션 테스트","q":"뮤테이션 테스트에서 원본 프로그램으로부터 뮤턴트 50개를 생성했다. 이 중 10개는 원본과 의미적으로 동일하게 동작하는 등가 뮤턴트(Equivalent Mutant)로 판명되었고, 테스트 스위트를 실행한 결과 30개의 뮤턴트를 제거(kill)했다. 등가 뮤턴트를 제외하고 계산한 뮤테이션 점수(Mutation Score)는?","o":["① 50%","② 60%","③ 70%","④ 75%"],"a":3,"x":"뮤테이션 점수는 '제거된 뮤턴트 수 / (전체 뮤턴트 수 - 등가 뮤턴트 수)'로 계산하므로 30 / (50 - 10) = 75%다. 등가 뮤턴트는 어떤 테스트로도 원본과 구별할 수 없으므로 분모에서 빼야 한다. ②의 60%는 등가 뮤턴트를 빼지 않고 30/50으로 계산한 값이다. 뮤테이션 테스트는 코드를 고치는 것이 아니라 테스트 케이스가 결함을 얼마나 잘 잡아내는지를 평가하는 기법이다.","kw":["mutation_test","testing"]},{"s":"소프트웨어 공학","tp":"V-모델","q":"V-모델에서 개발 단계와 그에 대응하는 테스트 단계의 연결로 옳은 것은?","o":["① 상세(모듈) 설계 - 단위 테스트","② 요구사항 분석 - 통합 테스트","③ 상세(모듈) 설계 - 인수 테스트","④ 코딩 - 시스템 테스트"],"a":0,"x":"V-모델은 왼쪽 개발 단계와 오른쪽 테스트 단계를 대칭으로 대응시켜, 각 단계의 산출물을 해당 테스트의 기준으로 삼는다. 일반적으로 요구사항 분석은 인수 테스트, 시스템(요구) 명세는 시스템 테스트, 아키텍처 설계는 통합 테스트, 상세 설계는 단위 테스트와 대응한다. 따라서 ①이 옳고, ②③④는 대응 관계가 어긋나 있다.","kw":["test_levels","testing"]},{"s":"소프트웨어 공학","tp":"ISO/IEC 25010 품질 특성","q":"ISO/IEC 25010:2011 제품 품질 모델에서 주특성과 부특성의 연결로 옳지 않은 것은?","o":["① 신뢰성 - 시험성(Testability)","② 보안성 - 부인방지(Non-repudiation)","③ 유지보수성 - 모듈성(Modularity)","④ 성능 효율성 - 자원 활용성(Resource Utilization)"],"a":0,"x":"시험성은 유지보수성의 부특성이며, 신뢰성의 부특성은 성숙성, 가용성, 결함 허용성, 회복성이다. 보안성은 기밀성, 무결성, 부인방지, 책임추적성, 인증성을, 유지보수성은 모듈성, 재사용성, 분석성, 수정성, 시험성을 부특성으로 가진다. 성능 효율성은 시간 반응성, 자원 활용성, 용량으로 구성된다.","kw":["sw_quality"]},{"s":"소프트웨어 공학","tp":"CMMI 성숙도 단계","q":"CMMI 단계적 표현에서 '조직 차원의 표준 프로세스가 정의·문서화되어 있고, 각 프로젝트는 이를 테일러링하여 사용하는' 성숙도 수준은?","o":["① 2단계 관리(Managed)","② 4단계 정량적 관리(Quantitatively Managed)","③ 3단계 정의(Defined)","④ 5단계 최적화(Optimizing)"],"a":2,"x":"3단계 정의 수준에서는 조직 표준 프로세스가 수립되어 있고 프로젝트가 이를 테일러링해 일관되게 적용한다. 2단계 관리 수준은 프로젝트 단위로 요구사항·계획·감시 등이 관리되는 단계로, 조직 표준이 아직 없다. 4단계는 통계적·정량적 기법으로 프로세스 성과를 관리하는 단계이고, 5단계는 정량적 이해를 바탕으로 프로세스를 지속적으로 개선하는 단계다.","kw":["cmmi","tailoring"]},{"s":"소프트웨어 공학","tp":"리팩토링","q":"리팩토링(Refactoring)에 대한 설명으로 옳은 것은?","o":["① 사용자 요구에 따라 새로운 기능을 추가하면서 코드 구조를 함께 바꾸는 활동이다.","② 소프트웨어의 외부 동작은 바꾸지 않으면서 내부 구조를 개선해 이해와 수정을 쉽게 만드는 활동이다.","③ 리팩토링 후 기능이 그대로인지 확인하는 회귀 테스트는 필요하지 않다.","④ 너무 긴 메서드는 여러 메서드의 코드를 하나로 합치는 방식으로 리팩토링한다."],"a":1,"x":"리팩토링은 겉으로 드러나는 동작(기능)을 그대로 둔 채 중복 제거, 이름 변경, 메서드 추출 등으로 내부 구조를 개선하는 활동이다. ①처럼 기능 추가와 섞으면 리팩토링이라 보기 어렵다. 동작이 바뀌지 않았음을 보장하려면 자동화된 회귀 테스트가 필수이므로 ③은 틀리다. 긴 메서드(Long Method)는 일부를 별도 메서드로 떼어내는 메서드 추출(Extract Method)로 해결하므로 ④도 틀리다.","kw":["refactoring","tech_debt"]},{"s":"소프트웨어 공학","tp":"재공학과 역공학","q":"소프트웨어 재공학(Re-engineering)과 역공학(Reverse Engineering)에 대한 설명으로 옳지 않은 것은?","o":["① 재공학은 일반적으로 역공학, 재구조화, 순공학 활동을 포함한다.","② 재구조화(Restructuring)는 같은 추상화 수준에서 기능을 바꾸지 않고 표현 형태를 바꾸는 것이다.","③ 역공학은 문서가 부족한 레거시 시스템의 이해와 유지보수를 위해 활용된다.","④ 역공학은 상위 수준의 설계 명세로부터 새로운 소스 코드를 생성하는 과정이다."],"a":3,"x":"역공학은 기존 소스 코드나 실행 결과물을 분석해 설계 정보나 데이터 구조처럼 더 높은 추상화 수준의 정보를 뽑아내는 과정이다. ④처럼 설계에서 코드를 만들어 내는 것은 순공학(Forward Engineering)이다. 재공학은 역공학으로 기존 시스템을 이해하고, 재구조화로 개선한 뒤, 순공학으로 새 시스템을 만드는 일련의 과정이므로 ①②③은 옳다.","kw":["reengineering","sw_maintenance"]},{"s":"소프트웨어 공학","tp":"형상관리 활동","q":"운영 중인 시스템의 소스 코드 수정 요청이 접수되었다. 변경 통제 위원회(CCB)가 영향 분석 결과를 검토해 변경을 승인하고, 승인된 변경만 기준선(Baseline)에 반영되도록 관리하였다. 이 활동에 해당하는 형상관리 활동은?","o":["① 형상 식별","② 형상 감사","③ 형상 통제","④ 형상 상태 보고"],"a":2,"x":"형상 통제는 변경 요청을 접수해 영향을 분석하고, CCB의 승인·반려 결정에 따라 승인된 변경만 기준선에 반영하는 활동이다. 형상 식별은 관리 대상 항목을 정하고 식별자와 버전 체계를 부여하는 활동이다. 형상 감사는 기준선의 무결성과 요구사항 충족 여부를 검증하는 활동이고, 형상 상태 보고는 변경 현황과 이력을 기록·보고하는 활동이다.","kw":["config_mgmt","baseline"]},{"s":"소프트웨어 공학","tp":"기능점수 유형 분류","q":"인사관리 시스템의 기능점수(FP)를 산정하려 한다. 기능 유형의 분류로 옳은 것은?","o":["① 회계 시스템이 유지·관리하고 인사관리 시스템은 참조만 하는 '부서 코드' 데이터 - EIF","② 사원 등록 화면에서 입력받아 사원 정보를 신규 저장하는 기능 - EO","③ 계산이나 파생 데이터 없이 사원 정보를 조건 검색해 그대로 보여 주는 조회 화면 - EO","④ 인사관리 시스템이 직접 생성·수정·삭제하며 관리하는 '사원' 데이터 - EIF"],"a":0,"x":"EIF(외부 연계 파일)는 측정 대상 애플리케이션이 참조만 하고 유지관리는 다른 애플리케이션이 하는 데이터이므로 ①이 옳다. ②는 외부 입력으로 내부 데이터를 유지하는 처리이므로 EI(외부 입력)이고, ③은 계산·파생 데이터 없이 데이터를 그대로 조회하므로 EQ(외부 조회)이다. ④는 애플리케이션 내부에서 유지관리하는 데이터이므로 ILF(내부 논리 파일)다.","kw":["function_point"]},{"s":"소프트웨어 공학","tp":"COCOMO","q":"COCOMO 모델에 대한 설명으로 옳지 않은 것은?","o":["① 기본 COCOMO는 원시 코드 라인 수(KDSI)를 바탕으로 노력(Person-Month)을 추정한다.","② 내장형(Embedded) 모드는 노력 산정식의 지수가 가장 작아 규모 증가에 따른 노력 증가율이 가장 낮다.","③ 개발 유형은 유기형(Organic), 반분리형(Semi-detached), 내장형(Embedded)으로 구분된다.","④ 중간 COCOMO는 제품·컴퓨터·인력·프로젝트 특성에 관한 노력 승수(비용 동인)로 기본 추정치를 보정한다."],"a":1,"x":"기본 COCOMO의 노력 산정식은 a × (KDSI)^b 형태이며, 지수 b는 유기형 1.05, 반분리형 1.12, 내장형 1.20으로 내장형이 가장 크다. 따라서 내장형은 규모가 커질수록 노력이 가장 가파르게 늘어나며 ②는 반대로 설명한 것이다. ①③④는 COCOMO의 입력값, 개발 유형, 중간 COCOMO의 비용 동인 보정에 대한 올바른 설명이다.","kw":["cocomo"]},{"s":"소프트웨어 공학","tp":"배포 전략","q":"CI/CD 파이프라인으로 신규 버전을 배포할 때, 먼저 전체 트래픽의 5%만 신규 버전으로 보내 오류율과 응답 시간을 모니터링하고, 문제가 없으면 단계적으로 비율을 늘려 최종적으로 전체를 전환하는 배포 전략은?","o":["① 블루-그린(Blue-Green) 배포","② 롤링(Rolling) 배포","③ 재생성(Recreate) 배포","④ 카나리(Canary) 배포"],"a":3,"x":"카나리 배포는 신규 버전을 일부 사용자나 트래픽에만 먼저 노출해 위험을 검증한 뒤 점진적으로 확대하는 방식이다. 블루-그린 배포는 운영(블루)과 동일한 신규(그린) 환경을 준비한 뒤 트래픽을 한 번에 전환하고, 문제 시 즉시 되돌리는 방식이다. 롤링 배포는 서버(인스턴스)를 순차적으로 교체하는 방식이고, 재생성 배포는 기존 버전을 모두 내린 뒤 새 버전을 올리므로 중단 시간이 생긴다.","kw":["deploy_strategy","ci_cd","devops"]},{"s":"소프트웨어 공학","tp":"마이크로서비스 아키텍처","q":"마이크로서비스 아키텍처(MSA)에 대한 설명으로 옳지 않은 것은?","o":["① 각 서비스는 독립적으로 개발·배포·확장할 수 있도록 설계한다.","② API 게이트웨이는 클라이언트 요청의 라우팅, 인증, 요청 집계 등을 담당할 수 있다.","③ 데이터 일관성 확보를 위해 모든 서비스가 하나의 공유 데이터베이스 스키마를 직접 사용하는 것을 원칙으로 한다.","④ 서킷 브레이커 패턴은 장애가 발생한 서비스로의 호출을 차단해 장애가 연쇄적으로 전파되는 것을 막는다."],"a":2,"x":"MSA는 서비스별로 자신의 데이터를 소유하는 '서비스별 데이터베이스(Database per Service)'를 원칙으로 하며, 하나의 공유 DB 스키마를 직접 쓰면 서비스 간 결합도가 높아져 독립 배포의 장점이 사라진다. 여러 서비스에 걸친 일관성은 Saga 패턴이나 이벤트 기반의 최종 일관성으로 다룬다. ①②④는 MSA의 독립성, API 게이트웨이, 서킷 브레이커에 대한 올바른 설명이다.","kw":["msa","eda"]},{"s":"소프트웨어 공학","tp":"시큐어코딩","q":"웹 애플리케이션의 SQL 삽입(SQL Injection) 보안약점을 제거하기 위한 시큐어코딩 방법으로 가장 적절한 것은?","o":["① 클라이언트 측 자바스크립트로 입력값을 검증하면 서버 측 검증은 생략해도 된다.","② 사용자 입력값을 문자열 연결로 쿼리에 붙이지 않고, 파라미터화된 쿼리(PreparedStatement 등)로 바인딩한다.","③ 쿼리 오류 발생 시 DB 오류 메시지와 스택 트레이스를 화면에 그대로 출력해 원인을 쉽게 파악하게 한다.","④ DB 접속 계정에 관리자(DBA) 권한을 부여해 쿼리 실패를 줄인다."],"a":1,"x":"파라미터화된 쿼리는 입력값을 SQL 구문이 아닌 데이터로만 처리하므로 SQL 삽입을 막는 가장 기본적이고 효과적인 방법이다. 클라이언트 측 검증은 공격자가 쉽게 우회할 수 있어 서버 측 검증을 대신할 수 없다. ③처럼 상세 오류를 노출하면 공격자에게 DB 구조 정보를 주게 되고, ④는 최소 권한 원칙에 어긋나 공격 성공 시 피해를 키운다.","kw":["secure_coding","injection"]},{"s":"데이터베이스","tp":"관계 해소(M:N)","q":"개념 모델의 '학생'과 '강좌' 엔터티가 M:N(다대다) 관계일 때, 이를 관계형 논리 모델로 변환하는 방법으로 가장 적절한 것은?","o":["① '학생' 엔터티에 '강좌번호' 외래키 컬럼 하나를 추가한다","② 두 엔터티를 하나의 엔터티로 통합한다","③ 두 엔터티의 식별자를 외래키로 가지는 교차(연관) 엔터티 '수강'을 새로 만든다","④ 관계의 카디널리티를 1:1로 바꾸어 표현한다"],"a":2,"x":"관계형 모델의 테이블은 M:N 관계를 직접 표현할 수 없으므로, 양쪽 식별자를 외래키로 갖는 교차 엔터티(예: 수강)를 만들어 1:M 관계 두 개로 해소합니다. ①처럼 한쪽에 외래키 하나만 두면 한 학생이 여러 강좌를 듣는 상황을 담을 수 없습니다. ②는 불필요한 중복과 이상현상을 만들고, ④는 업무 규칙 자체를 왜곡합니다.","kw":["data_modeling","er_model"]},{"s":"데이터베이스","tp":"식별 관계와 비식별 관계","q":"데이터 모델링에서 식별 관계와 비식별 관계에 대한 설명으로 옳지 않은 것은?","o":["① 식별 관계에서는 부모 엔터티의 식별자가 자식 엔터티 식별자(기본키)의 일부가 된다","② 비식별 관계에서는 부모 엔터티의 식별자가 자식 엔터티의 일반 속성(외래키)으로만 상속된다","③ 식별 관계가 여러 단계 이어지면 하위 엔터티의 기본키 컬럼 수가 늘어나 조인 조건이 복잡해질 수 있다","④ 비식별 관계에서 자식 엔터티의 외래키 컬럼에는 어떤 경우에도 NULL을 허용할 수 없다"],"a":3,"x":"비식별 관계는 부모가 없어도 자식이 존재할 수 있는 선택적(Optional) 관계로도 정의할 수 있으며, 이 경우 외래키 컬럼에 NULL이 허용됩니다. 따라서 '어떤 경우에도 NULL 불가'라는 ④가 틀렸습니다. ①②는 두 관계의 정의 그대로이고, ③은 식별 관계를 과도하게 쓸 때 생기는 대표적 단점(복합키 비대화)입니다.","kw":["data_modeling","er_model","db_key"]},{"s":"데이터베이스","tp":"키의 종류","q":"관계형 데이터베이스의 키에 대한 설명으로 옳지 않은 것은?","o":["① 후보키는 튜플을 유일하게 식별하는 유일성과, 불필요한 속성이 없는 최소성을 모두 만족한다","② 외래키 컬럼은 참조하는 테이블의 기본키 컬럼과 이름이 반드시 같아야 한다","③ 슈퍼키는 유일성만 만족하면 되며 최소성은 요구되지 않는다","④ 후보키 중 기본키로 선택되지 않은 나머지를 대체키라고 한다"],"a":1,"x":"외래키는 참조 대상 키와 도메인(데이터 타입·의미)이 일치하면 되며 컬럼 이름은 달라도 됩니다(예: 사원.소속부서 → 부서.부서번호). 그래서 ②가 틀렸습니다. ①은 후보키의 정의, ③은 슈퍼키의 정의, ④는 대체키의 정의로 모두 맞습니다.","kw":["db_key","relational_model"]},{"s":"데이터베이스","tp":"참조 무결성","q":"부서(부서번호 PK) 테이블과 사원(사원번호 PK, 부서번호 FK) 테이블이 있고, 사원.부서번호 외래키에 ON DELETE SET NULL 옵션이 지정되어 있다. 부서 테이블에서 부서번호 'D1' 행을 삭제할 때의 결과로 옳은 것은? (사원.부서번호는 NULL 허용)","o":["① 'D1'을 참조하는 사원이 있으므로 삭제가 거부된다","② 'D1' 소속 사원 행도 모두 함께 삭제된다","③ 부서 'D1' 행은 삭제되고, 'D1' 소속 사원의 부서번호는 NULL로 바뀐다","④ 부서 'D1' 행은 삭제되고, 'D1' 소속 사원의 부서번호는 컬럼 기본값으로 바뀐다"],"a":2,"x":"ON DELETE SET NULL은 부모 행을 지우면 이를 참조하던 자식 행의 외래키 값을 NULL로 바꾸는 참조 동작입니다. ①은 RESTRICT/NO ACTION, ②는 CASCADE, ④는 SET DEFAULT의 동작입니다. 어떤 옵션이든 결과적으로 존재하지 않는 부모를 가리키는 자식이 남지 않게 해 참조 무결성을 지킵니다.","kw":["integrity","db_key"]},{"s":"데이터베이스","tp":"함수 종속과 후보키","q":"릴레이션 R(A, B, C, D, E)에 함수 종속 집합 F = {A → B, B → C, CD → E}가 성립한다. R의 후보키로 옳은 것은?","o":["① A","② AD","③ ACD","④ BD"],"a":1,"x":"A와 D는 어떤 함수 종속의 오른쪽에도 나오지 않으므로 모든 후보키에 반드시 포함되어야 합니다. AD의 폐포를 구하면 A→B, B→C로 B·C를 얻고, CD→E로 E를 얻어 AD+ = {A,B,C,D,E}가 되므로 AD가 후보키입니다. ①은 D를 결정하지 못하고, ③은 모든 속성을 결정하지만 C가 불필요해 최소성을 어긴 슈퍼키이며, ④의 BD+는 {B,C,D,E}로 A를 결정하지 못합니다.","kw":["functional_dependency","db_key"]},{"s":"데이터베이스","tp":"정규형 단계","q":"정규화 단계와 각 단계에서 제거하는 대상을 연결한 것으로 옳지 않은 것은?","o":["① 제1정규형 - 반복 그룹·다중값 속성을 없애 모든 속성값을 원자값으로 만든다","② 제2정규형 - 기본키에 대한 부분 함수 종속을 제거한다","③ 제3정규형 - 기본키에 대한 이행적 함수 종속을 제거한다","④ 제4정규형 - 후보키를 통하지 않는 조인 종속을 제거한다"],"a":3,"x":"제4정규형은 다치 종속(MVD)을 제거하는 단계이고, 조인 종속을 제거하는 것은 제5정규형입니다. 따라서 ④가 틀렸습니다. ①②③은 1NF·2NF·3NF의 정의를 올바르게 설명합니다. 참고로 BCNF는 3NF와 4NF 사이에서 '모든 결정자가 후보키'가 되도록 하는 단계입니다.","kw":["normal_forms","normalization"]},{"s":"데이터베이스","tp":"BCNF","q":"릴레이션 수강(학번, 과목, 교수)에서 다음 업무 규칙이 성립한다. '한 학생은 한 과목을 한 교수에게만 듣는다((학번, 과목) → 교수)', '각 교수는 한 과목만 담당한다(교수 → 과목)'. 이 릴레이션에 대한 설명으로 옳은 것은?","o":["① 기본키 (학번, 과목)에 대한 부분 함수 종속이 있어 제2정규형을 만족하지 않는다","② 제3정규형은 만족하지만 BCNF는 만족하지 않는다","③ 모든 결정자가 후보키이므로 BCNF를 만족한다","④ 속성값이 원자값이 아니므로 제1정규형도 만족하지 않는다"],"a":1,"x":"후보키는 (학번, 과목)과 (학번, 교수) 두 개이고, 세 속성 모두 어떤 후보키의 일부인 주요 속성이므로 2NF·3NF 위반이 없습니다. 그러나 결정자 '교수'는 후보키가 아니므로 BCNF를 위반합니다. 따라서 ②가 옳고 ③은 틀립니다. 이를 (교수, 과목)과 (학번, 교수)로 분해하면 무손실이지만 (학번, 과목) → 교수 종속은 보존되지 않는다는 점도 함께 기억해 두면 좋습니다.","kw":["normal_forms","functional_dependency"]},{"s":"데이터베이스","tp":"이상현상","q":"주문상세 테이블에 주문마다 고객주소가 반복 저장되어 있다. 어떤 고객이 이사하여 주소를 수정했는데 그 고객의 주문 행 중 일부만 수정되어 같은 고객의 주소가 서로 다르게 남았다. 이 현상에 해당하는 것은?","o":["① 삽입 이상","② 삭제 이상","③ 갱신 이상","④ 팬텀 리드"],"a":2,"x":"중복 저장된 데이터 중 일부만 변경되어 데이터 간 불일치가 생기는 것은 갱신(수정) 이상입니다. 삽입 이상은 불필요한 데이터 없이는 원하는 데이터를 넣을 수 없는 경우, 삭제 이상은 한 정보를 지우면 다른 필요한 정보까지 사라지는 경우입니다. 팬텀 리드는 정규화가 아니라 동시성 제어(트랜잭션 격리)에서 다루는 현상입니다.","kw":["anomaly","normalization"]},{"s":"데이터베이스","tp":"무손실 분해","q":"릴레이션 R(A, B, C)에 함수 종속 A → B만 성립한다. 다음 분해 중 무손실 조인(lossless join) 분해인 것은?","o":["① R1(A, B), R2(A, C)","② R1(A, B), R2(B, C)","③ R1(A, C), R2(B, C)","④ R1(A, B), R2(C)"],"a":0,"x":"두 릴레이션으로 분해할 때 공통 속성이 한쪽 릴레이션 전체를 함수적으로 결정하면 무손실 분해입니다. ①은 공통 속성 A가 A → B에 의해 R1(A, B)를 결정하므로 무손실입니다. ②의 공통 속성 B와 ③의 공통 속성 C는 어느 쪽도 결정하지 못해 자연 조인 시 원래 없던 가짜 튜플이 생길 수 있고, ④는 공통 속성이 없어 카티션 곱이 됩니다.","kw":["normalization","functional_dependency"]},{"s":"데이터베이스","tp":"다치 종속과 제4정규형","q":"릴레이션 강좌(과목, 교수, 교재)는 세 속성 전체가 기본키이고, 한 과목에 담당 교수 집합과 교재 집합이 서로 독립적으로 정해진다(과목 →→ 교수, 과목 →→ 교재). 이에 대한 설명으로 옳은 것은?","o":["① 과목 →→ 교수가 성립하면 과목 →→ 교재도 성립한다","② 기본키가 전체 속성이므로 BCNF를 위반한다","③ 제4정규형으로 만들려면 (과목, 교수)와 (교수, 교재)로 분해한다","④ 다치 종속은 항상 함수 종속이기도 하다"],"a":0,"x":"다치 종속에는 보완 규칙이 있어 X →→ Y이면 X →→ (R − X − Y)도 성립하므로, 과목 →→ 교수이면 과목 →→ 교재가 됩니다. 전체 속성이 키이고 자명하지 않은 함수 종속이 없으므로 이 릴레이션은 BCNF를 만족하지만 다치 종속 때문에 4NF는 위반합니다(②오답). 4NF 분해는 결정자 '과목'을 기준으로 (과목, 교수)와 (과목, 교재)로 나누어야 하고(③오답), 함수 종속이 다치 종속의 특수한 경우일 뿐 그 역은 성립하지 않습니다(④오답).","kw":["normal_forms","functional_dependency"]},{"s":"데이터베이스","tp":"반정규화","q":"반정규화(역정규화)에 대한 설명으로 옳지 않은 것은?","o":["① 조회 성능을 높이기 위해 정규화된 모델에 의도적으로 중복이나 통합을 허용하는 기법이다","② 반정규화를 적용하기 전에 인덱스 조정, 클러스터링, 뷰, 파티셔닝 등 다른 성능 개선 방법을 먼저 검토한다","③ 파생 컬럼 추가, 이력 테이블에 최근값 컬럼 추가, 테이블 병합·분할 등이 대표적 기법이다","④ 반정규화를 하면 데이터 무결성 유지 부담이 줄어들어 입력·수정·삭제 성능도 함께 좋아진다"],"a":3,"x":"반정규화는 중복을 늘리는 것이므로 중복 데이터를 일치시키기 위한 트리거·애플리케이션 로직 등 무결성 유지 부담이 오히려 커지고, 입력·수정·삭제 시 처리할 대상도 늘어납니다. 따라서 ④가 틀렸습니다. ①은 반정규화의 정의, ②는 권장 적용 절차, ③은 대표적 기법으로 모두 맞습니다.","kw":["denormalization","db_tuning"]},{"s":"데이터베이스","tp":"외부 조인 결과 행 수","q":"EMP(eno, dept) 테이블에는 (1, 10), (2, 20), (3, NULL), (4, 10)의 4개 행이, DEPT(dept) 테이블에는 10, 30의 2개 행(중복 없음)이 있다. 다음 SQL의 결과 행 수는? / SELECT * FROM EMP E FULL OUTER JOIN DEPT D ON E.dept = D.dept","o":["① 4","② 5","③ 6","④ 7"],"a":1,"x":"조인 조건을 만족하는 행은 (1,10)-10과 (4,10)-10의 2개입니다. FULL OUTER JOIN은 여기에 짝이 없는 EMP 행((2,20), (3,NULL)) 2개와 짝이 없는 DEPT 행(30) 1개를 NULL로 채워 추가하므로 2+2+1 = 5행입니다. NULL은 어떤 값과도 = 비교가 참이 되지 않으므로 eno 3은 매칭되지 않습니다. 참고로 INNER JOIN은 2행, LEFT OUTER JOIN은 4행입니다.","kw":["join","sql"]},{"s":"데이터베이스","tp":"NOT IN과 NULL","q":"T1(c) 테이블에는 1, 2, 3이, T2(c) 테이블에는 2, NULL이 들어 있다. 다음 두 SQL의 결과 행 수를 순서대로 나열한 것은? / (가) SELECT c FROM T1 WHERE c NOT IN (SELECT c FROM T2) / (나) SELECT c FROM T1 a WHERE NOT EXISTS (SELECT 1 FROM T2 b WHERE b.c = a.c)","o":["① 2, 2","② 1, 2","③ 0, 2","④ 0, 0"],"a":2,"x":"(가)에서 c NOT IN (2, NULL)은 c <> 2 AND c <> NULL로 해석되는데, c <> NULL은 항상 UNKNOWN이라 전체 조건이 참이 될 수 없어 0행입니다. (나)의 NOT EXISTS는 b.c = a.c를 만족하는 행이 '없는지'만 보므로 NULL 행은 단순히 매칭되지 않고, 1과 3이 반환되어 2행입니다. 그래서 서브쿼리 컬럼에 NULL이 섞일 수 있으면 NOT IN 대신 NOT EXISTS를 쓰거나 NULL을 걸러야 합니다.","kw":["sql"]},{"s":"데이터베이스","tp":"GROUP BY와 HAVING, 집계 함수의 NULL 처리","q":"SALES(region, amt) 테이블에 (A, 100), (A, 200), (B, 50), (B, NULL), (C, NULL) 행이 있다. 다음 SQL의 결과에 대한 설명으로 옳은 것은? / SELECT region, COUNT(*), COUNT(amt), SUM(amt) FROM SALES GROUP BY region HAVING COUNT(amt) >= 1","o":["① 결과는 3행이다","② B 그룹의 COUNT(*)는 1이다","③ B 그룹의 COUNT(amt)는 1이고 SUM(amt)는 50이다","④ C 그룹은 SUM(amt)가 0으로 출력된다"],"a":2,"x":"COUNT(*)는 NULL 여부와 관계없이 행 수를 세고, COUNT(컬럼)과 SUM은 NULL을 제외하고 계산합니다. B 그룹은 COUNT(*) = 2, COUNT(amt) = 1, SUM(amt) = 50이므로 ③이 옳고 ②는 틀립니다. C 그룹은 COUNT(amt) = 0이라 HAVING 조건에서 제외되어 결과는 A, B 두 행뿐입니다(①오답). 또 모든 값이 NULL인 그룹의 SUM은 0이 아니라 NULL입니다(④오답).","kw":["sql"]},{"s":"데이터베이스","tp":"윈도우 함수(순위 함수)","q":"점수가 100, 90, 90, 80인 4개 행에 대해 ORDER BY 점수 DESC 기준으로 RANK(), DENSE_RANK(), ROW_NUMBER()를 각각 구했다. 점수 80인 행의 값을 (RANK, DENSE_RANK, ROW_NUMBER) 순서로 옳게 나타낸 것은?","o":["① (4, 3, 4)","② (3, 3, 4)","③ (4, 4, 4)","④ (3, 2, 4)"],"a":0,"x":"RANK는 동점자에게 같은 순위를 주고 동점자 수만큼 다음 순위를 건너뛰므로 1, 2, 2, 4가 되어 80점은 4입니다. DENSE_RANK는 같은 순위를 주되 건너뛰지 않아 1, 2, 2, 3이므로 3입니다. ROW_NUMBER는 동점이어도 1, 2, 3, 4처럼 고유 번호를 붙이므로 4입니다.","kw":["sql"]},{"s":"데이터베이스","tp":"SQL 논리적 처리 순서","q":"SELECT 문의 논리적 처리 순서로 옳은 것은?","o":["① SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY","② FROM → WHERE → SELECT → GROUP BY → HAVING → ORDER BY","③ FROM → GROUP BY → WHERE → HAVING → SELECT → ORDER BY","④ FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY"],"a":3,"x":"SQL은 FROM으로 대상 집합을 만들고, WHERE로 행을 거른 뒤, GROUP BY로 그룹을 만들고, HAVING으로 그룹을 거른 다음, SELECT로 출력 컬럼을 계산하고, 마지막에 ORDER BY로 정렬합니다. 이 순서 때문에 WHERE 절에서는 집계 함수를 쓸 수 없고(그룹이 아직 없음), ORDER BY에서는 SELECT 절의 별칭을 쓸 수 있습니다. 나머지 보기는 그룹화와 필터링 순서가 뒤바뀌어 있습니다.","kw":["sql"]},{"s":"데이터베이스","tp":"B+트리 인덱스","q":"B+트리 인덱스에 대한 설명으로 옳지 않은 것은?","o":["① 루트에서 모든 리프 노드까지의 깊이가 같은 균형 트리이다","② 모든 키 값은 리프 노드에 존재하며, 리프 노드끼리 연결되어 있어 범위 검색에 유리하다","③ 내부(브랜치) 노드는 리프로 가는 탐색 경로를 안내하는 키를 가진다","④ 삽입으로 노드가 가득 차면 분할이 리프 방향으로 전파되어 트리 높이가 리프 쪽에서 증가한다"],"a":3,"x":"B+트리에서 노드가 넘치면 분할된 키가 부모 노드로 올라가며, 이 분할이 루트까지 전파되면 새 루트가 생겨 높이가 '위쪽(루트)'에서 1 증가합니다. 그래서 항상 균형이 유지되며 ④가 틀렸습니다. ①②③은 B+트리의 핵심 특징으로, 특히 리프 노드 연결 리스트 덕분에 BETWEEN 같은 범위 조회가 효율적입니다.","kw":["btree","index"]},{"s":"데이터베이스","tp":"비트맵 인덱스","q":"비트맵 인덱스에 대한 설명으로 가장 옳은 것은?","o":["① 성별·지역코드처럼 카디널리티(서로 다른 값의 수)가 낮은 컬럼에 적합하며, 여러 조건을 비트 AND·OR 연산으로 빠르게 결합할 수 있다","② 동시 갱신이 매우 많은 OLTP 테이블에 가장 적합한 인덱스이다","③ 컬럼의 카디널리티가 높을수록 인덱스 크기가 작아진다","④ 비트맵 인덱스는 등치 조건에만 쓰이고 범위 조건이나 OR 조건에는 전혀 사용할 수 없다"],"a":0,"x":"비트맵 인덱스는 값마다 행 위치를 비트열로 표현하므로 값 종류가 적은 컬럼에서 저장 공간이 작고, 여러 조건을 비트 연산으로 결합하기 좋아 DW·분석 질의에 많이 쓰입니다. 반면 한 비트맵 조각이 많은 행을 담당해 갱신 시 잠금 범위가 넓어지므로 동시 갱신이 많은 OLTP에는 부적합합니다(②오답). 값 종류가 많아질수록 비트맵 수가 늘어 커지며(③오답), OR 결합에 오히려 강점이 있습니다(④오답).","kw":["index"]},{"s":"데이터베이스","tp":"결합 인덱스 컬럼 순서","q":"EMP 테이블에 결합 인덱스 IDX_EMP(dept, hire_date)가 있다. 다음 중 이 인덱스를 일반적인 인덱스 범위 스캔으로 효율적으로 사용하기 가장 어려운 조건은?","o":["① WHERE dept = 'D1' AND hire_date >= DATE '2024-01-01'","② WHERE dept = 'D1'","③ WHERE hire_date >= DATE '2024-01-01'","④ WHERE dept IN ('D1', 'D2') AND hire_date = DATE '2025-03-02'"],"a":2,"x":"결합 인덱스는 선두 컬럼(dept) 순으로 정렬되고 같은 dept 안에서만 hire_date 순으로 정렬되어 있습니다. ③처럼 선두 컬럼 조건 없이 두 번째 컬럼만 조건으로 주면 탐색 시작점을 잡을 수 없어 범위 스캔이 어렵고, 전체 인덱스를 훑거나 일부 DBMS의 Skip Scan 같은 특수 방식에 의존해야 합니다. ①②④는 모두 선두 컬럼 dept에 등치(또는 IN) 조건이 있어 정상적인 범위 스캔이 가능합니다.","kw":["index","optimizer"]},{"s":"데이터베이스","tp":"인덱스 미사용 조건","q":"CUSTOMER 테이블의 name(VARCHAR) 컬럼과 reg_dt(DATE) 컬럼에 각각 일반 B-트리 인덱스가 있고 함수 기반 인덱스는 없다. 다음 <보기> 중 해당 인덱스를 범위 스캔으로 사용하기 어려운 조건을 모두 고른 것은? / ㄱ. WHERE SUBSTR(name, 1, 2) = '김철' / ㄴ. WHERE name LIKE '김%' / ㄷ. WHERE name LIKE '%수' / ㄹ. WHERE TO_CHAR(reg_dt, 'YYYYMMDD') = '20260101'","o":["① ㄱ, ㄴ","② ㄴ, ㄹ","③ ㄱ, ㄷ, ㄹ","④ ㄱ, ㄴ, ㄷ, ㄹ"],"a":2,"x":"인덱스는 컬럼의 원래 값 순서로 정렬되어 있으므로, ㄱ·ㄹ처럼 인덱스 컬럼을 함수로 가공하면 정렬 순서를 이용할 수 없습니다. ㄷ처럼 LIKE 패턴이 %로 시작하면 시작 위치를 알 수 없어 역시 범위 스캔이 불가능합니다. 반면 ㄴ은 '김'으로 시작하는 구간만 읽으면 되므로 범위 스캔이 가능합니다. ㄹ은 reg_dt >= DATE '2026-01-01' AND reg_dt < DATE '2026-01-02'처럼 컬럼을 가공하지 않는 형태로 바꾸면 인덱스를 쓸 수 있습니다.","kw":["index","db_tuning"]},{"s":"데이터베이스","tp":"해시 조인","q":"해시 조인(Hash Join)에 대한 설명으로 가장 옳은 것은?","o":["① 등치(=) 조인 조건에서 사용되며, 보통 작은 집합으로 해시 테이블을 만들고(Build) 큰 집합을 읽으며 해시 테이블을 탐색(Probe)한다","② 부등호(<, >)나 BETWEEN 같은 비등치 조인 조건에서 가장 효율적인 조인 방식이다","③ 조인 전에 양쪽 집합을 조인 키 순서로 반드시 정렬해야 한다","④ 선행 테이블의 결과 건수가 적고 후행 테이블 조인 컬럼에 인덱스가 있을 때 가장 유리한 방식으로, 부분범위 처리에 최적이다"],"a":0,"x":"해시 조인은 조인 키의 해시값으로 같은 버킷을 찾는 방식이라 등치 조인에서만 쓸 수 있고, 작은 쪽으로 메모리에 해시 테이블을 만든 뒤 큰 쪽을 탐색합니다. 해시 함수는 크기 순서를 보존하지 않으므로 비등치 조인에는 쓸 수 없습니다(②오답). 양쪽 정렬이 필요한 것은 소트 머지 조인(③), 인덱스를 타고 한 건씩 찾아가는 것은 중첩 루프 조인(④)의 특징입니다.","kw":["join","optimizer"]},{"s":"데이터베이스","tp":"NL 조인과 소트 머지 조인","q":"조인 방식에 대한 설명으로 옳지 않은 것은?","o":["① 중첩 루프(NL) 조인은 선행 테이블의 각 행마다 후행 테이블을 탐색하므로 인덱스를 통한 랜덤 액세스가 많다","② 소트 머지 조인은 정렬 작업이 필요 없기 때문에 정렬용 메모리나 임시 공간을 전혀 사용하지 않는다","③ NL 조인은 결과를 한 건씩 바로 돌려줄 수 있어 부분범위 처리가 가능한 OLTP 화면 조회에 유리하다","④ 소트 머지 조인은 양쪽을 조인 키로 정렬한 후 병합하며, 비등치 조인에도 사용할 수 있다"],"a":1,"x":"소트 머지 조인은 이름 그대로 양쪽 집합을 조인 키로 정렬(Sort)한 뒤 병합(Merge)하므로 정렬용 메모리와, 부족하면 임시 공간을 사용합니다. 따라서 ②가 틀렸습니다(이미 인덱스 등으로 정렬된 경우 정렬을 생략할 수는 있습니다). ①③은 NL 조인의 특징, ④는 정렬된 순서를 이용하기 때문에 범위 조건 조인도 가능한 소트 머지 조인의 장점입니다.","kw":["join","optimizer"]},{"s":"데이터베이스","tp":"옵티마이저(RBO·CBO)","q":"옵티마이저에 대한 설명으로 가장 옳은 것은?","o":["① 비용 기반 옵티마이저(CBO)는 테이블 행 수, 컬럼 값 분포 등 통계 정보를 바탕으로 예상 비용이 가장 낮은 실행계획을 선택한다","② 규칙 기반 옵티마이저(RBO)는 통계 정보가 최신일수록 더 정확한 실행계획을 만든다","③ CBO는 통계 정보가 오래되어도 항상 최적의 실행계획을 선택한다","④ 같은 SQL이라도 실행계획이 바뀌면 조회 결과 데이터가 달라진다"],"a":0,"x":"CBO는 통계 정보로 각 실행계획의 I/O·CPU 비용을 추정해 가장 싼 계획을 고릅니다. RBO는 미리 정해진 우선순위 규칙(예: 인덱스 접근 경로 순위)만 쓰므로 통계와 무관합니다(②오답). 통계가 실제 데이터와 다르면 CBO는 잘못된 계획을 고를 수 있어 통계 관리가 중요합니다(③오답). 실행계획은 '어떻게' 찾을지의 차이일 뿐 결과 집합은 같아야 합니다(④오답).","kw":["optimizer","db_tuning"]},{"s":"데이터베이스","tp":"ACID","q":"트랜잭션의 ACID 특성과 그 설명을 연결한 것으로 옳지 않은 것은?","o":["① 원자성(Atomicity) - 연산이 모두 반영되거나 전혀 반영되지 않아야 하며, 이는 주로 2단계 로킹 규약으로 보장한다","② 일관성(Consistency) - 트랜잭션 수행 전후에 데이터베이스가 무결성 제약을 만족하는 일관된 상태를 유지한다","③ 고립성(Isolation) - 동시에 수행되는 트랜잭션이 서로의 중간 결과에 간섭하지 않아야 하며, 병행 제어로 보장한다","④ 지속성(Durability) - 커밋된 결과는 장애가 나도 유지되어야 하며, 로그와 회복 기법으로 보장한다"],"a":0,"x":"원자성의 정의(All or Nothing)는 맞지만, 이를 보장하는 수단은 2단계 로킹이 아니라 실패한 트랜잭션의 변경을 되돌리는 회복 기법(Undo, 롤백)입니다. 2단계 로킹 같은 병행 제어는 ③의 고립성을 보장하는 수단입니다. ②④는 일관성과 지속성을 올바르게 설명합니다.","kw":["acid","transaction"]},{"s":"데이터베이스","tp":"충돌 직렬가능성","q":"다음 스케줄 S에 대한 설명으로 옳은 것은? (r: 읽기, w: 쓰기, 숫자: 트랜잭션 번호) / S: r1(A), r2(A), w1(A), w2(A)","o":["① 충돌 연산은 T1 → T2 방향뿐이므로 충돌 직렬가능하다","② 선행 그래프에 T1 → T2, T2 → T1 간선이 모두 있어 사이클이 생기므로 충돌 직렬가능하지 않다","③ 두 트랜잭션의 연산 수가 같으므로 항상 직렬가능하다","④ 실행 결과는 언제나 T1, T2 순서로 직렬 실행한 결과와 같다"],"a":1,"x":"서로 다른 트랜잭션이 같은 데이터에 접근하고 그중 하나 이상이 쓰기면 충돌 연산입니다. r1(A)가 w2(A)보다 앞서므로 T1 → T2, r2(A)가 w1(A)보다 앞서므로 T2 → T1 간선이 생겨 사이클이 존재하고, 따라서 충돌 직렬가능하지 않습니다. 실제로 두 트랜잭션이 같은 값을 읽고 각자 덮어써 T1의 갱신이 사라지는 갱신 손실(Lost Update) 형태입니다. 연산 수는 직렬가능성과 무관합니다(③오답).","kw":["concurrency_control","transaction"]},{"s":"데이터베이스","tp":"2단계 로킹(2PL)","q":"2단계 로킹(2PL) 규약에 대한 설명으로 옳은 것은?","o":["① 2PL을 따르면 교착상태(Deadlock)가 원천적으로 발생하지 않는다","② 잠금을 획득만 하는 확장 단계와 해제만 하는 축소 단계로 나누며, 모든 트랜잭션이 이를 따르면 충돌 직렬가능성이 보장된다","③ 축소 단계에 들어간 트랜잭션도 필요하면 새로운 잠금을 획득할 수 있다","④ 기본 2PL만 따르면 연쇄 복귀(Cascading Rollback)가 항상 방지된다"],"a":1,"x":"2PL은 한 번이라도 잠금을 해제하면 더 이상 새 잠금을 얻지 못하게 하여 직렬가능성을 보장합니다(②정답, ③오답). 그러나 서로가 가진 잠금을 기다리는 상황은 막지 못하므로 교착상태는 발생할 수 있습니다(①오답). 기본 2PL은 커밋 전에 쓰기 잠금을 풀 수 있어 다른 트랜잭션이 미확정 값을 읽을 수 있으므로, 연쇄 복귀를 막으려면 배타 잠금을 커밋까지 유지하는 Strict 2PL이 필요합니다(④오답).","kw":["locking_2pl","concurrency_control"]},{"s":"데이터베이스","tp":"타임스탬프 순서 기법","q":"기본 타임스탬프 순서(Basic Timestamp Ordering) 병행 제어에서 TS(T1) = 10, TS(T2) = 20이다. 데이터 X는 이미 T2가 기록하여 W-TS(X) = 20인 상태에서 T1이 read(X)를 요청했다. 이때의 처리로 옳은 것은?","o":["① T1의 읽기를 허용하고 R-TS(X)를 10으로 바꾼다","② T2를 철회(Rollback)하고 T1의 읽기를 허용한다","③ T1을 철회하고 새로운 타임스탬프를 받아 재시작하게 한다","④ T2가 커밋할 때까지 T1을 잠금 대기시킨다"],"a":2,"x":"타임스탬프 순서 기법은 타임스탬프 순서대로 직렬 실행한 것과 같은 결과를 보장해야 합니다. 더 오래된 T1(10)이 자기보다 늦은 T2(20)가 이미 쓴 값을 읽으면 순서가 뒤집히므로, TS(T1) < W-TS(X)인 경우 T1을 철회하고 새 타임스탬프로 재시작시킵니다. 이 기법은 잠금을 쓰지 않으므로 대기(④)가 없고, 늦게 들어온 요청자를 철회하지 이미 수행된 T2를 철회하지 않습니다(②오답).","kw":["concurrency_control","transaction"]},{"s":"데이터베이스","tp":"트랜잭션 격리 수준","q":"ANSI/ISO SQL 표준의 트랜잭션 격리 수준과 허용되는 이상현상에 대한 설명으로 옳지 않은 것은?","o":["① READ UNCOMMITTED에서는 Dirty Read가 발생할 수 있다","② READ COMMITTED는 Dirty Read를 방지하지만 Non-repeatable Read는 발생할 수 있다","③ REPEATABLE READ는 Non-repeatable Read를 방지하지만 표준상 Phantom Read는 발생할 수 있다","④ SERIALIZABLE에서도 표준상 Phantom Read는 허용된다"],"a":3,"x":"SQL 표준에서 SERIALIZABLE은 Dirty Read, Non-repeatable Read, Phantom Read를 모두 허용하지 않는 가장 높은 격리 수준이므로 ④가 틀렸습니다. ①②③은 표준 정의 그대로입니다. 다만 실제 DBMS는 MVCC 등 구현 방식에 따라 REPEATABLE READ에서도 팬텀을 막는 경우가 있으므로, 시험에서는 '표준 기준'인지 확인하는 습관이 필요합니다.","kw":["isolation_level","read_anomalies"]},{"s":"데이터베이스","tp":"MVCC","q":"다중 버전 동시성 제어(MVCC)에 대한 설명으로 가장 옳은 것은?","o":["① 데이터 변경 시 이전 버전을 유지하여, 읽기 트랜잭션이 쓰기 잠금을 기다리지 않고 일관된 스냅샷을 읽을 수 있게 한다","② 쓰기-쓰기 충돌도 버전으로 해결되므로 갱신 시 잠금이나 충돌 검사가 전혀 필요 없다","③ 생성된 이전 버전은 영구히 보관되므로 별도의 정리 작업이 필요 없다","④ MVCC 기반 스냅샷 격리는 Write Skew를 포함한 모든 이상현상을 막아 항상 직렬가능성을 보장한다"],"a":0,"x":"MVCC의 핵심은 '읽기는 쓰기를 막지 않고, 쓰기는 읽기를 막지 않는다'는 것으로, 읽기 시점의 버전(스냅샷)을 제공합니다. 같은 행을 동시에 수정하는 쓰기-쓰기 충돌은 여전히 잠금이나 충돌 검사로 처리해야 합니다(②오답). 오래된 버전은 언두 영역 재사용이나 VACUUM 같은 정리 작업이 필요하고(③오답), 일반 스냅샷 격리는 Write Skew가 발생할 수 있어 그 자체로 직렬가능성을 보장하지 않습니다(④오답).","kw":["mvcc","isolation_level"]},{"s":"데이터베이스","tp":"읽기 이상현상","q":"트랜잭션 T1이 SELECT COUNT(*) FROM EMP WHERE dept = 10을 실행해 5를 얻었다. 그 사이 T2가 dept = 10인 사원 행을 새로 INSERT하고 커밋했으며, T1이 같은 SELECT를 다시 실행하자 6이 나왔다. 이 현상에 해당하는 것은?","o":["① Dirty Read","② Non-repeatable Read","③ Phantom Read","④ Lost Update"],"a":2,"x":"같은 조건으로 다시 조회했을 때 다른 트랜잭션의 삽입(또는 삭제)으로 이전에 없던 행이 나타나는 것은 Phantom Read입니다. Dirty Read는 커밋되지 않은 데이터를 읽는 것이고, Non-repeatable Read는 이미 읽은 '같은 행'의 값이 다른 트랜잭션의 수정으로 바뀌는 것입니다. Lost Update는 두 트랜잭션의 갱신 중 하나가 덮어써져 사라지는 현상입니다.","kw":["read_anomalies","isolation_level"]},{"s":"데이터베이스","tp":"체크포인트 기반 회복","q":"즉시 갱신(Immediate Update) 방식의 로그 기반 회복을 사용하는 DBMS에서 체크포인트 이후 시스템 장애가 발생했다. 각 트랜잭션 상태가 다음과 같을 때 Redo 대상과 Undo 대상을 옳게 짝지은 것은? / T1: 체크포인트 이전에 시작·커밋 / T2: 체크포인트 이전 시작, 체크포인트 이후 장애 전 커밋 / T3: 체크포인트 이전 시작, 장애 시점까지 미완료 / T4: 체크포인트 이후 시작, 장애 전 커밋 / T5: 체크포인트 이후 시작, 장애 시점까지 미완료","o":["① Redo: T1, T2, T4 / Undo: T3, T5","② Redo: T2, T4 / Undo: T3, T5","③ Redo: T2, T3 / Undo: T4, T5","④ Redo: T4 / Undo: T2, T3, T5"],"a":1,"x":"체크포인트 시점에는 그 전까지의 변경이 디스크에 반영되므로, 체크포인트 이전에 커밋을 마친 T1은 아무 작업도 필요 없습니다. 장애 전에 커밋 로그가 있는 T2·T4는 디스크 반영을 확신할 수 없으므로 Redo하고, 커밋하지 못한 T3·T5는 즉시 갱신으로 이미 디스크에 쓰였을 수 있는 변경을 Undo합니다. ①은 T1까지 Redo해 불필요한 작업을 하고, ③④는 커밋 여부와 반대로 처리했습니다.","kw":["recovery","wal"]},{"s":"데이터베이스","tp":"WAL(로그 선행 기록)","q":"WAL(Write-Ahead Logging)과 체크포인트에 대한 설명으로 옳은 것은?","o":["① WAL을 만족하려면 커밋할 때마다 변경된 모든 데이터 페이지를 디스크에 먼저 기록해야 한다","② 변경된 데이터 페이지를 디스크에 기록한 후에 해당 로그 레코드를 기록하는 것이 WAL의 원칙이다","③ 체크포인트를 수행하면 로그가 필요 없어지므로 회복 과정에서 로그를 전혀 읽지 않는다","④ 변경된 데이터 페이지를 디스크에 쓰기 전에, 그 변경을 기술한 로그 레코드를 먼저 안정 저장소에 기록해야 한다"],"a":3,"x":"WAL은 '로그를 먼저, 데이터는 나중에'라는 원칙으로, 데이터 페이지가 디스크에 쓰이기 전에 관련 로그가 먼저 기록되어야 장애 시 Undo·Redo가 가능합니다(④정답, ②는 순서가 반대). 커밋 시 데이터 페이지까지 강제로 쓰는 것은 Force 정책으로 WAL의 요건이 아니며, WAL에서는 커밋 시 로그만 디스크에 기록하면 됩니다(①오답). 체크포인트는 회복 시 읽을 로그 범위를 줄여 줄 뿐, 그 이후 로그는 여전히 필요합니다(③오답).","kw":["wal","recovery"]},{"s":"데이터베이스","tp":"버퍼 관리 정책과 회복","q":"DBMS의 버퍼 관리 정책으로 Steal(커밋 전 변경 페이지를 디스크에 기록 허용)과 No-Force(커밋 시 변경 페이지를 디스크에 강제 기록하지 않음)를 함께 사용할 때, 장애 회복에 필요한 작업으로 옳은 것은?","o":["① Undo만 필요하다","② Redo만 필요하다","③ Undo와 Redo가 모두 필요하다","④ Undo와 Redo 모두 필요 없다"],"a":2,"x":"Steal 정책에서는 커밋되지 않은 변경이 디스크에 쓰여 있을 수 있으므로 이를 되돌리는 Undo가 필요합니다. No-Force 정책에서는 커밋된 변경이 아직 디스크에 없을 수 있으므로 다시 반영하는 Redo가 필요합니다. 따라서 두 작업이 모두 필요하며, 대신 버퍼 운영이 유연해 성능이 좋아 대부분의 상용 DBMS가 이 조합을 씁니다. 참고로 No-Steal/Force 조합이면 이론상 둘 다 필요 없습니다.","kw":["recovery","wal"]},{"s":"데이터베이스","tp":"분산 투명성","q":"고객 테이블이 지역별로 나뉘어 서울·부산 서버에 저장되어 있지만, 사용자는 이를 의식하지 않고 하나의 고객 테이블인 것처럼 SELECT 문을 작성해 조회할 수 있다. 이 사례가 직접적으로 보여주는 분산 데이터베이스의 투명성은?","o":["① 위치 투명성","② 중복 투명성","③ 병행 투명성","④ 분할 투명성"],"a":3,"x":"하나의 논리적 테이블이 여러 조각(단편)으로 나뉘어 저장되어 있다는 사실을 사용자가 몰라도 되는 것이 분할(단편화) 투명성입니다. 위치 투명성은 데이터가 '어느 서버에 있는지' 몰라도 되는 것, 중복 투명성은 같은 데이터가 여러 곳에 복제되어 있음을 몰라도 되는 것입니다. 병행 투명성은 여러 트랜잭션이 동시에 수행되어도 결과의 일관성이 유지되는 것을 말합니다.","kw":["dist_transparency","distributed_db"]},{"s":"데이터베이스","tp":"2단계 커밋(2PC)","q":"분산 트랜잭션의 2단계 커밋(2PC) 프로토콜에 대한 설명으로 옳지 않은 것은?","o":["① 1단계(준비·투표)에서 코디네이터가 모든 참여자에게 커밋할 준비가 되었는지 묻는다","② 참여자 중 하나라도 No로 투표하거나 응답이 없으면 코디네이터는 전체 트랜잭션을 철회한다","③ 모든 참여자가 Yes로 투표하면 코디네이터가 커밋을 결정하고 2단계에서 각 참여자에게 알린다","④ Yes로 투표한 참여자는 이후 코디네이터가 장애로 응답하지 않아도 스스로 커밋 또는 철회를 결정할 수 있으므로 블로킹 문제가 없다"],"a":3,"x":"Yes로 투표해 준비 상태가 된 참여자는 코디네이터의 최종 결정을 알 때까지 임의로 커밋하거나 철회할 수 없으며, 잠금을 쥔 채 기다려야 합니다. 이것이 2PC의 대표적 약점인 블로킹 문제이므로 ④가 틀렸습니다. 이를 완화하기 위해 3PC나 합의 알고리즘 기반 방식이 제안되었습니다. ①②③은 2PC의 정상 동작을 바르게 설명합니다.","kw":["two_pc","distributed_db"]},{"s":"데이터베이스","tp":"샤딩","q":"샤딩(Sharding)에 대한 설명으로 가장 옳은 것은?","o":["① 해시 기반 샤딩은 키 값의 순서를 유지하므로 범위 질의를 한 샤드에서 효율적으로 처리할 수 있다","② 범위(Range) 기반 샤딩은 날짜처럼 계속 증가하는 키를 쓰면 최신 범위를 담당하는 샤드에 쓰기가 몰리는 핫스팟이 생길 수 있다","③ 샤딩은 단일 서버의 CPU·메모리를 늘리는 수직 확장(Scale-up) 기법이다","④ 샤딩을 하면 여러 샤드에 걸친 조인과 트랜잭션 처리가 단일 데이터베이스보다 쉬워진다"],"a":1,"x":"범위 샤딩에서 주문일자처럼 증가하는 키를 쓰면 새 데이터가 모두 마지막 샤드로 몰려 부하가 한쪽에 집중됩니다(②정답). 해시 샤딩은 데이터를 고르게 흩뜨리는 대신 순서가 깨져 범위 질의가 여러 샤드에 퍼집니다(①오답). 샤딩은 데이터를 여러 서버에 나누는 수평 확장(Scale-out)이고(③오답), 샤드 간 조인·분산 트랜잭션은 오히려 어려워집니다(④오답).","kw":["sharding","partitioning"]},{"s":"데이터베이스","tp":"CAP 이론과 BASE","q":"CAP 이론과 BASE 특성에 대한 설명으로 옳지 않은 것은?","o":["① CAP 이론에 따르면 네트워크 분할(Partition)이 발생했을 때 분산 시스템은 일관성과 가용성 중 하나를 포기해야 한다","② BASE는 ACID보다 강한 즉시 일관성을 보장하므로 금융 원장처럼 엄격한 정합성이 필요한 시스템에 특히 적합하다","③ BASE는 Basically Available, Soft state, Eventually consistent의 약자이다","④ 최종 일관성(Eventual Consistency)은 새 갱신이 없으면 시간이 지나 결국 모든 복제본이 같은 값을 갖게 된다는 의미이다"],"a":1,"x":"BASE는 가용성과 확장성을 위해 일시적인 불일치를 허용하고 '결국' 일관성을 맞추는 느슨한 모델로, ACID보다 약한 일관성을 제공합니다. 따라서 엄격한 정합성이 필요한 금융 원장에 특히 적합하다는 ②가 틀렸습니다. ①은 CAP 이론의 핵심, ③은 BASE의 구성, ④는 최종 일관성의 정의로 모두 맞습니다.","kw":["cap","base","nosql"]},{"s":"데이터베이스","tp":"데이터 표준화","q":"데이터 표준화에 대한 설명으로 옳지 않은 것은?","o":["① 업무 담당자의 이해를 돕기 위해 같은 의미의 용어라도 부서마다 자유롭게 서로 다른 이름(이음동의어)을 표준 용어로 등록해 쓰는 것이 바람직하다","② 데이터 표준은 일반적으로 표준 단어, 표준 도메인, 표준 용어, 표준 코드 등으로 구성된다","③ 표준 도메인은 금액·일자·번호처럼 성격이 같은 컬럼의 데이터 타입과 길이를 묶어 정의한 것이다","④ 데이터 표준화는 명칭·정의·형식을 일관되게 관리하여 데이터 품질과 시스템 간 연계성을 높인다"],"a":0,"x":"데이터 표준화의 핵심 목적은 같은 의미에는 하나의 표준 이름을 쓰도록 이음동의어(예: 고객번호·회원번호·CUST_NO 혼용)와 동음이의어를 정비하는 것입니다. 따라서 이음동의어를 자유롭게 등록하라는 ①이 틀렸습니다. ②③은 표준의 구성 요소와 표준 도메인의 개념, ④는 표준화의 기대 효과로 모두 맞습니다.","kw":["data_standard","data_quality","metadata"]},{"s":"데이터베이스","tp":"데이터 웨어하우스와 OLAP","q":"데이터 웨어하우스(DW)와 OLAP에 대한 설명으로 옳지 않은 것은?","o":["① DW는 주제 지향성, 통합성, 시계열성, 휘발성(Volatile)을 특징으로 하여 데이터가 수시로 갱신·삭제된다","② 스타 스키마는 중앙의 사실(Fact) 테이블과 이를 둘러싼 비정규화된 차원(Dimension) 테이블로 구성된다","③ 스노우플레이크 스키마는 차원 테이블을 정규화하여 여러 단계로 나눈 형태이다","④ 드릴다운(Drill-down)은 요약된 데이터에서 더 상세한 수준의 데이터로 내려가며 분석하는 OLAP 연산이다"],"a":0,"x":"DW의 4대 특징은 주제 지향성, 통합성, 시계열성, 그리고 '비휘발성(Non-volatile)'입니다. DW에 적재된 데이터는 분석용 이력으로 보존되며 일반적으로 갱신·삭제되지 않고 적재와 조회 위주로 사용되므로 ①이 틀렸습니다. ②③은 대표적 차원 모델링 스키마를 바르게 설명하고, ④는 롤업(Roll-up)의 반대 연산인 드릴다운의 정의입니다.","kw":["dw","olap"]},{"s":"데이터베이스","tp":"DB 접근통제와 암호화","q":"데이터베이스 보안에 대한 설명으로 가장 옳은 것은?","o":["① 뷰(View)는 실제 데이터를 별도로 복사해 저장하므로 기밀 컬럼의 노출을 통제하는 수단으로 사용할 수 없다","② WITH GRANT OPTION으로 권한을 받은 사용자는 그 권한을 다른 사용자에게 다시 부여할 수 없다","③ 사용자 비밀번호는 필요 시 원문을 확인할 수 있도록 AES 같은 양방향 암호로 저장하는 것이 바람직하다","④ 역할 기반 접근통제(RBAC)는 권한을 역할에 부여하고 사용자에게 역할을 할당하므로, 인사이동 시 역할만 바꾸면 되어 권한 관리가 쉽다"],"a":3,"x":"RBAC는 '사용자-역할-권한' 구조로 사용자 변동이 있어도 역할 할당만 바꾸면 되므로 관리가 단순해집니다(④정답). 일반 뷰는 데이터를 복사하지 않는 가상 테이블이며, 필요한 컬럼·행만 보여 주어 접근 범위를 제한하는 보안 수단으로 쓰입니다(①오답). WITH GRANT OPTION은 받은 권한을 남에게 다시 줄 수 있게 하는 옵션입니다(②오답). 비밀번호는 원문 복원이 불가능하도록 솔트를 적용한 일방향 해시로 저장해야 합니다(③오답).","kw":["access_control","encryption"]},{"s":"시스템 구조","tp":"파이프라인 해저드","q":"명령어 파이프라인의 해저드(hazard)에 대한 설명으로 옳지 않은 것은?","o":["① 구조적 해저드는 둘 이상의 명령어가 같은 하드웨어 자원(예: 단일 메모리 포트)을 동시에 사용하려 할 때 발생한다.","② 데이터 해저드는 뒤 명령어가 앞 명령어의 결과를 사용해야 하는데 그 결과가 아직 준비되지 않았을 때 발생한다.","③ 포워딩(바이패싱)을 적용하면 적재-사용(load-use) 경우를 포함한 모든 데이터 해저드가 지연(stall) 없이 완전히 제거된다.","④ 분기 예측과 지연 분기(delayed branch)는 제어 해저드로 인한 성능 저하를 줄이기 위한 기법이다."],"a":2,"x":"포워딩은 ALU 결과를 다음 명령어에 바로 넘겨 대부분의 데이터 해저드를 해소하지만, 메모리에서 읽어 온 값을 바로 다음 명령어가 쓰는 load-use 해저드는 값이 MEM 단계 끝에서야 나오므로 고전적 5단계 파이프라인에서 최소 1사이클의 지연이 남습니다. 그래서 '모든 데이터 해저드가 지연 없이 제거'는 틀린 설명입니다. ①은 자원 충돌, ②는 데이터 의존성, ④는 분기 결과를 늦게 아는 문제를 줄이는 대표 기법으로 모두 옳습니다.","kw":["cpu","computer_arch"]},{"s":"시스템 구조","tp":"파이프라인 성능 계산","q":"각 단계가 1클럭인 5단계 명령어 파이프라인에서 해저드 없이 100개의 명령어를 실행한다. 파이프라인을 사용하지 않고 명령어마다 5클럭씩 순차 실행하는 경우와 비교한 속도 향상(speedup)으로 가장 가까운 것은?","o":["① 약 4.50배","② 약 4.81배","③ 5.00배","④ 약 5.20배"],"a":1,"x":"파이프라인 실행 시간은 첫 명령어가 5클럭(k)에 끝난 뒤 나머지 99개가 1클럭마다 하나씩 끝나므로 k+n-1 = 5+100-1 = 104클럭입니다. 비파이프라인은 5×100 = 500클럭이므로 속도 향상은 500/104 ≈ 4.81배입니다. 5배는 명령어 수가 무한히 많을 때의 이론적 상한일 뿐이고, 채우는 시간(fill) 때문에 실제로는 그보다 작습니다. 5배를 넘는 ④는 단계 수보다 큰 향상이어서 불가능합니다.","kw":["cpu","computer_arch"]},{"s":"시스템 구조","tp":"캐시 유효 접근 시간","q":"캐시 접근 시간 10ns, 주기억장치 접근 시간 100ns, 캐시 적중률 90%인 시스템이 있다. 캐시 미스 시에는 캐시를 먼저 확인한 뒤 주기억장치에 접근(계층적 접근)한다고 할 때 평균 메모리 접근 시간은?","o":["① 19ns","② 10ns","③ 29ns","④ 20ns"],"a":3,"x":"계층적 접근에서는 미스가 나도 캐시 확인 시간 10ns를 이미 썼으므로 미스 시 비용은 10+100 = 110ns입니다. 따라서 0.9×10 + 0.1×110 = 9 + 11 = 20ns입니다. 19ns는 캐시와 주기억장치를 동시에 접근하는 방식(0.9×10 + 0.1×100)으로 계산한 값이어서 문제의 조건과 다릅니다. 10ns는 적중률 100%일 때의 값입니다.","kw":["cache","memory"]},{"s":"시스템 구조","tp":"캐시 매핑 주소 구성","q":"32비트 바이트 주소를 쓰는 시스템에 용량 64KB, 블록(라인) 크기 32바이트인 직접 사상(direct-mapped) 캐시가 있다. 주소의 태그(tag)/인덱스(index)/오프셋(offset) 비트 수로 옳은 것은?","o":["① 16 / 11 / 5","② 18 / 9 / 5","③ 21 / 6 / 5","④ 16 / 12 / 4"],"a":0,"x":"블록 크기 32바이트 = 2^5이므로 오프셋은 5비트입니다. 라인 수는 64KB/32B = 2
